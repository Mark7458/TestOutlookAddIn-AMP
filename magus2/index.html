        if (tool === 'utility' || tool === 'tools') content = h('div', { class: 'v2-tool' }, tool === 'utility' ? utilityView() : toolsView());
        else if (tool) content = h('section', { class: 'v2-main v2-pane' }, h('div', { class: 'scroll side', 'data-scroll': `pane:${tool}` }, tool === 'tasks' ? tasksPanel(null) : teamsPanel(null)));
        // Senza un thread scelto: lista a colonna e pannelli vuoti (stessa struttura di quando è aperto).
        else if (!item) content = [state.listHidden ? null : v2List(), emptyThread()];
        else content = [state.listHidden ? null : v2List(), v2Thread(item)];
        const single = Boolean(tool) || state.listHidden;
        if (isCompact()) {
            // Telefono: una cosa alla volta (lista o thread); cartelle e strumenti nel menu ☰.
            const body = tool ? content : item ? v2Thread(item) : v2List(false);
            return h('main', { class: 'workspace v2 compact' }, body,
                state.drawerOpen ? h('div', { class: 'drawer-backdrop', onclick: event => { if (event.target === event.currentTarget || event.target.closest('.folder')) { state.drawerOpen = false; render(); } } }, h('div', { class: 'drawer' }, folderNav())) : null,
                palette());
        }
        return h('main', { class: `workspace v2${single ? ' no-list' : ''}${tool ? ' tool' : ''}` }, folderNav(), content, palette());
    }
    function workspace() {
        return v2Workspace();
        if (state.tab === 'tools') return toolsView();
        if (state.tab === 'utility') return utilityView();
        const item = selectedItem();
        return h('main', { class: `workspace${item ? ' detail-open' : ''}${state.sideCollapsed ? ' side-collapsed' : ''}` }, listColumn(), threadColumn(item), sideColumn(item));
    }
    // Promemoria scaduti (i miei task di Planner con l'ora): ogni 20 secondi; ognuno avvisa una volta (rimandabile di 10 min).
    const REMINDED_KEY = 'magus_reminded_v1';
    const reminded = () => { try { return JSON.parse(localStorage.getItem(REMINDED_KEY) || '{}'); } catch { return {}; } };
    function markReminded(task, until = 'done') { const seen = reminded(); seen[task.id] = until; try { localStorage.setItem(REMINDED_KEY, JSON.stringify(seen)); } catch { /* comodità */ } }
    function checkReminders() {
        if (!state.user || state.reminder) return;
        const seen = reminded();
        const due = [...(state.tasks.mine || []), ...[...state.tasks.thread.values()].flat().filter(Boolean)]
            .filter(task => !task.done && String(task.due || '').includes('T') && (!task.assignedTo || isMe(task.assignedTo)))
            .find(task => Date.parse(task.due) <= Date.now() && (!seen[task.id] || (seen[task.id] !== 'done' && Date.parse(seen[task.id]) <= Date.now())));
        if (due) { state.reminder = due; render(); }
    }
    setInterval(checkReminders, 20000);
    function reminderAlert() {
        const task = state.reminder;
        if (!task) return null;
        const thread = task.parentItemId ? allItems().find(item => item.parentItemId === Number(task.parentItemId) && item.key.startsWith('thread:')) : null;
        const close = until => { markReminded(task, until); state.reminder = null; render(); };
        return h('div', { class: 'reminder-alert', role: 'alert' },
            h('div', { class: 'reminder-alert-head' }, icon(ICONS.clock), h('b', {}, 'Promemoria'), h('span', {}, dueText(task.due))),
            h('div', { class: 'reminder-alert-text' }, task.title),
            thread ? h('div', { class: 'hint' }, thread.subject) : null,
            h('div', { class: 'reminder-alert-actions' },
                thread ? h('button', { type: 'button', class: 'btn primary', onclick: () => { close('done'); state.view = 'mine'; select(thread); } }, 'Apri il thread') : null,
                h('button', { type: 'button', class: 'btn', onclick: () => close(new Date(Date.now() + 10 * 60000).toISOString()) }, 'Tra 10 min'),
                h('button', { type: 'button', class: 'btn', onclick: () => { close('done'); toggleTask(task); } }, 'Fatto')));
    }
    function toast() {
        if (!state.toast) return null;
        const { text, tone, action, icon: paths } = state.toast;
        return h('div', { class: `toast ${tone}`, role: 'status' },
            paths ? icon(paths) : null,
            h('span', {}, text),
            action ? h('button', { type: 'button', class: 'toast-action', onclick: () => { state.toast = null; action.onclick(); } }, action.label) : null);
    }

    // ---- Movimenti delle schede (gli stessi del pannello: unfold, fold, exitCard, morph) ----
    // unfold: prima si apre lo spazio, poi il contenuto compare; fold: prima il contenuto si affievolisce, poi lo spazio
    // si chiude. Durante un movimento Magus non si ridisegna: i ridisegni chiesti nel frattempo si fanno alla fine.
    const MOTION = { unfold: 320, fold: 320, swap: 240, hold: 150, exit: 380, remove: 260 };
    const JOURNEY = { build: 200, easing: 'cubic-bezier(.3, .8, .2, 1)' };
    function playOn(element, frames, duration, easing = 'ease-in-out') {
        if (!element?.animate || reducedMotion()) return Promise.resolve(null);
        const overflow = element.style.overflow;
        element.style.overflow = 'hidden';
        const animation = element.animate(frames, { duration, easing, fill: 'forwards' });
        return animation.finished.catch(() => {}).then(() => ({ animation, overflow }));
    }
    async function unfold(element, from = 0) {
        if (!element) return;
        const height = `${element.scrollHeight}px`;
        const pad = getComputedStyle(element).paddingTop;
        const result = await playOn(element, [
            { maxHeight: `${from}px`, paddingTop: '0px', opacity: 0 },
            { maxHeight: height, paddingTop: pad, opacity: 0, offset: .55 },
            { maxHeight: height, paddingTop: pad, opacity: 1 }
        ], MOTION.unfold);
        if (result) { result.animation.cancel(); element.style.overflow = result.overflow; }
    }
    function fold(element) {
        if (!element) return Promise.resolve();
        const height = `${element.scrollHeight}px`;
        const pad = getComputedStyle(element).paddingTop;
        return playOn(element, [
            { maxHeight: height, paddingTop: pad, opacity: 1 },
            { maxHeight: height, paddingTop: pad, opacity: 0, offset: .4 },
            { maxHeight: '0px', paddingTop: '0px', opacity: 0 }
        ], MOTION.fold);
    }
    let renderHolds = 0, renderPending = false;
    async function holding(task) {
        renderHolds += 1;
        motion.busy = true;
        try { return await task(); } finally {
            renderHolds -= 1;
            if (!renderHolds) { motion.busy = false; if (renderPending) { renderPending = false; render(); } }
        }
    }
    // Uscita di una scheda dopo un'azione riuscita: svanisce rimpicciolendosi appena, poi il suo spazio si chiude.
    async function exitCard(card) {
        if (!card?.isConnected || reducedMotion()) return;
        await holding(async () => {
            await playOn(card, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.97)' }], MOTION.exit, 'ease-out');
            card.style.visibility = 'hidden';
            await playOn(card, [{ maxHeight: `${card.offsetHeight}px` }, { maxHeight: '0px', paddingTop: '0px', paddingBottom: '0px', marginTop: '-6px', borderWidth: '0px' }], MOTION.remove);
        });
    }
    const fadeAll = (elements, from, to, options) => Promise.all(elements.map(element => element.animate([{ opacity: from }, { opacity: to }], options).finished.catch(() => {})));
    // Forma di un elemento (posizione, misura, angoli) per il riquadro che si trasforma (pillola → modulo e ritorno).
    const shapeOfElement = element => {
        const rect = element.getBoundingClientRect();
        return { rect, radius: `${Math.min(parseFloat(getComputedStyle(element).borderTopLeftRadius) || 0, rect.height / 2)}px` };
    };
    async function morphShell(from, to) {
        const shell = h('div', { class: 'morph-shell' });
        document.body.append(shell);
        Object.assign(shell.style, { left: `${to.rect.left}px`, top: `${to.rect.top}px`, width: `${to.rect.width}px`, height: `${to.rect.height}px` });
        const frame = form => ({ transform: `translate(${form.rect.left - to.rect.left}px, ${form.rect.top - to.rect.top}px)`, width: `${form.rect.width}px`, height: `${form.rect.height}px`, borderRadius: form.radius });
        await shell.animate([frame(from), frame(to)], { duration: JOURNEY.build + 60, easing: JOURNEY.easing, fill: 'forwards' }).finished.catch(() => {});
        shell.remove();
    }
    async function morphInto(element, from) {
        await holding(async () => {
            element.style.visibility = 'hidden';
            await morphShell(from, shapeOfElement(element));
            element.style.visibility = '';
            await fadeAll([...element.children], 0, 1, { duration: MOTION.swap, easing: 'ease-in' });
        });
    }
    async function copyText(text) {
        try { await navigator.clipboard.writeText(text); return true; } catch {
            const area = h('textarea', { style: 'position: fixed; opacity: 0;' });
            area.value = text;
            document.body.append(area);
            area.select();
            const copied = document.execCommand('copy');
            area.remove();
            return copied;
        }
    }

    // ------------------------------------------------------------------
    // Movimento (come nel pannello): la pillola della voce scelta scivola nei selettori e nelle schede; le parti che
    // cambiano contenuto entrano con una breve dissolvenza; le schede in alto fanno scorrere la vista nel loro verso.
    // Il ridisegno ricrea tutto: si anima solo ciò che è cambiato dal disegno precedente.
    // ------------------------------------------------------------------
    const motion = { keys: new Map(), thumbs: new Map(), icons: new Map(), modal: false, settingsTab: null, tab: null, toast: null, busy: false };
    const reducedMotion = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    // Pillola sotto la voce scelta: parte da dove era e scivola sulla nuova.
    function slideThumb(group, selector, key) {
        const chosen = group?.querySelector(selector);
        if (!chosen) return;
        const thumb = h('span', { class: 'thumb', 'aria-hidden': 'true' });
        group.prepend(thumb);
        const place = { x: chosen.offsetLeft, width: chosen.offsetWidth };
        const before = motion.thumbs.get(key);
        motion.thumbs.set(key, place);
        const put = ({ x, width }) => { thumb.style.transform = `translateX(${x}px)`; thumb.style.width = `${width}px`; };
        put(before && !reducedMotion() ? before : place);
        if (!before || reducedMotion() || (before.x === place.x && before.width === place.width)) return;
        thumb.getBoundingClientRect();
        thumb.classList.add('moving');
        put(place);
    }
    // Selettore con le icone: la voce di prima si stringe e il suo nome svanisce mentre la nuova si allarga e il suo
    // nome compare; la pillola segue, tutto con lo stesso movimento.
    function growIcons(group, key) {
        const buttons = [...group.querySelectorAll('.segment')];
        const index = buttons.findIndex(button => button.classList.contains('big'));
        if (index < 0) return;
        const before = motion.icons.get(key);
        motion.icons.set(key, index);
        const thumb = h('span', { class: 'thumb', 'aria-hidden': 'true' });
        group.prepend(thumb);
        const put = button => { thumb.style.transform = `translateX(${button.offsetLeft}px)`; thumb.style.width = `${button.offsetWidth}px`; };
        if (before === undefined || before === index || !buttons[before] || reducedMotion()) { put(buttons[index]); return; }
        const from = buttons[before], to = buttons[index];
        // dove arriverà la voce nuova: si misura con le larghezze finali
        const end = { x: to.offsetLeft, width: to.offsetWidth };
        to.classList.remove('big'); from.classList.add('big');
        put(from);
        group.getBoundingClientRect();
        group.classList.add('growing');
        thumb.classList.add('moving');
        from.classList.remove('big'); to.classList.add('big');
        thumb.style.transform = `translateX(${end.x}px)`; thumb.style.width = `${end.width}px`;
    }
    function enter(element, key, name, className = 'enter') {
        if (!element) return;
        const before = motion.keys.get(name);
        motion.keys.set(name, key);
        if (before !== undefined && before !== key && !reducedMotion()) element.classList.add(className);
    }
    function animate() {
        slideThumb(root.querySelector('.tabs'), '.tab[aria-selected="true"]', 'tabs');
        root.querySelectorAll('.segmented.icons').forEach(group => growIcons(group, group.getAttribute('aria-label')));
        root.querySelectorAll('.segmented:not(.icons)').forEach(group => slideThumb(group, '.segment[aria-pressed="true"]', `segmented:${group.getAttribute('aria-label')}`));
        // La finestra delle impostazioni entra solo quando si apre, non a ogni ridisegno; cambiando scheda il contenuto
        // scorre nel verso dello spostamento (come nel pannello).
        const backdrop = root.querySelector('.modal-backdrop');
        if (backdrop && !motion.modal && !reducedMotion()) backdrop.classList.add('opening');
        motion.modal = !!backdrop;
        if (backdrop) {
            const at = SETTINGS_TABS.findIndex(([id]) => id === state.settingsTab);
            if (motion.settingsTab !== null && motion.settingsTab !== at && !reducedMotion()) backdrop.querySelector('.scroll.settings')?.classList.add(at > motion.settingsTab ? 'enter-next' : 'enter-back');
            motion.settingsTab = at;
        } else motion.settingsTab = null;
        const order = TABS.findIndex(tab => tab.id === state.tab);
        if (motion.tab !== null && motion.tab !== order && !reducedMotion()) root.querySelector('.workspace')?.classList.add(order > motion.tab ? 'enter-next' : 'enter-back');
        motion.tab = order;
        if (state.tab !== 'work') return;
        enter(root.querySelector('[aria-label="Elenco"] .scroll'), state.section, 'list');
        enter(root.querySelector('.workspace > .column:nth-child(2) > .card, .v2-main > .v2-body > .v2-conversation'), state.selected || '', 'thread');
        enter(root.querySelector('aside .side'), `${state.selected}|${state.panel?.type || state.panel || ''}`, 'side');
        const toastNode = root.querySelector('.toast');
        if (toastNode && motion.toast !== state.toast.id) { motion.toast = state.toast.id; toastNode.classList.add('enter'); }
    }

    // Telefono: ogni livello aperto (thread, pannello dell'azione, cassetto delle cartelle) è un passo nella cronologia,
    // così il gesto o il tasto Indietro chiude prima quello in cima invece di uscire dal thread.
    let navLayers = [], skipPops = 0;
    function wantedLayers() {
        if (!isCompact() || !isV2() || !state.user) return [];
        const item = state.tab === 'work' ? selectedItem() : null;
        const layers = [];
        if (item) layers.push('thread');
        if (item && state.sideCards.has(item.key)) layers.push('panel');
        if (state.drawerOpen) layers.push('drawer');
        return layers;
    }
    function syncHistory() {
        const want = wantedLayers();
        if (want.length > navLayers.length) want.slice(navLayers.length).forEach((layer, index) => history.pushState({ magusLayer: navLayers.length + index + 1 }, '', location.href));
        else if (want.length < navLayers.length) { skipPops += 1; history.go(want.length - navLayers.length); }
        navLayers = want;
    }
    window.addEventListener('popstate', () => {
        if (skipPops) { skipPops -= 1; return; }
        const top = navLayers.pop();
        if (!top) return;
        const item = selectedItem();
        if (top === 'drawer') state.drawerOpen = false;
        else if (top === 'panel' && item) { state.sideCards.delete(item.key); state.forms.delete(`take:${item.key}`); }
        else if (top === 'thread') { state.selected = null; state.mobileTab = 'mail'; }
        render();
    });
    // Ridisegna tutto tenendo la posizione degli elenchi e il campo attivo.
    function render() {
        if (!state.user) return;
        // durante un movimento, o con una tendina aperta, si ridisegna alla fine (un ridisegno chiuderebbe la tendina)
        if (renderHolds || document.querySelector('.ao-select-menu')) { renderPending = true; return; }
        const scrolls = new Map([...root.querySelectorAll('[data-scroll]')].map(node => [node.dataset.scroll, node.scrollTop]));
        const active = document.activeElement;
        const focus = active?.id ? { id: active.id, start: active.selectionStart, end: active.selectionEnd } : null;
        root.replaceChildren(topbar(), workspace(), state.settingsOpen ? settingsView() : '', toast() || '', reminderAlert() || '');
        syncHistory();
        animate();
        root.querySelectorAll('[data-scroll]').forEach(node => { if (scrolls.has(node.dataset.scroll)) node.scrollTop = scrolls.get(node.dataset.scroll); });
        const field = focus && document.getElementById(focus.id);
        if (field) {
            field.focus();
            try { if (typeof focus.start === 'number') field.setSelectionRange(focus.start, focus.end); } catch { /* campo senza selezione */ }
        }
    }

    // Chi non è entrato vede solo Accedi (login Microsoft con reindirizzamento, poi si torna qui).
    function loginScreen() {
        return h('main', { class: 'login' },
            h('div', { class: 'card' },
                h('h1', {}, 'Magus'),
                h('button', { type: 'button', class: 'btn primary wide', onclick: () => window.MagusAuth.login() },
                    icon('<path d="M12 4h3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 15 16h-3M7.5 13.5 11 10 7.5 6.5M11 10H3.5"/>'), 'Accedi con Microsoft')));
    }

    // Aggiornamento degli elenchi: ogni config.refresh.listsSeconds (60 s) e quando la pagina torna in primo piano.
    let refreshTimer = null, refreshWatching = false;
    function scheduleRefresh() {
        clearInterval(refreshTimer);
        refreshTimer = setInterval(() => { if (document.visibilityState === 'visible' && !state.busy) { loadLists(); loadMyTasks(true); loadMentions(); } }, refreshSettings().listsSeconds * 1000);
        if (!refreshWatching) document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !state.busy) loadLists(); });
        refreshWatching = true;
    }

    // Scorciatoie (come Front e Help Scout), fuori dai campi di testo: frecce per cambiare thread, R / A rispondi (a tutti)
    // all'ultima mail ricevuta, T crea ticket, E etichetta, K task, P apre o chiude il pannello di destra.
    const SHORTCUTS = [['Ctrl K', 'Cerca mail e ticket'], ['N', 'Nota interna'], ['↑ ↓', 'Thread precedente / successivo'], ['R', 'Rispondi'], ['A', 'Rispondi a tutti'], ['T', 'Apri ticket'], ['E', 'Etichetta'], ['K', 'Task dalla mail'], ['P', 'Lista / pannello di destra']];
    document.addEventListener('keydown', event => {
        if (state.user && (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k' && document.documentElement.dataset.layout === 'wide') {
            event.preventDefault();
            if (state.palette) { state.palette = null; document.activeElement?.blur(); render(); } else openPalette();
            return;
        }
        if (!state.user || state.tab !== 'work' || state.settingsOpen || state.palette || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.target.closest?.('input, textarea, select, [contenteditable="true"]') || document.querySelector('.ao-select-menu')) return;
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (key === 'ArrowDown' || key === 'ArrowUp') {
            const items = visibleItems();
            if (!items.length) return;
            event.preventDefault();
            const index = items.findIndex(item => item.key === state.selected);
            const next = items[Math.min(items.length - 1, Math.max(0, index < 0 ? 0 : index + (key === 'ArrowDown' ? 1 : -1)))];
            if (next && next.key !== state.selected) { select(next); document.querySelector(`.item[data-key="${CSS.escape(next.key)}"]`)?.scrollIntoView({ block: 'nearest' }); }
            return;
        }
        if (key === 'p') {
            event.preventDefault();
            if (isV2()) { state.listHidden = !state.listHidden; state.listAuto = false; render(); }
            else setSide(state.sideTab, !state.sideCollapsed);
            return;
        }
        const item = selectedItem();
        const thread = item && state.threads.get(item.parentItemId);
        if (!item || !thread?.messages?.length) return;
        if (key === 'e' && item.key.startsWith('thread:') && item.section === 'active') { event.preventDefault(); toggleTag(item); return; }
        const received = isV2() ? pickedMessage(item) : [...thread.messages].reverse().find(entry => !sameEmail(entry.from.email, serviceMailbox()));
        if (key === 'n' && isV2() && item.parentItemId) { event.preventDefault(); state.editorMode = 'note'; render(); document.getElementById('note-text')?.focus(); return; }
        if (key === 't' && received && item.section !== 'ignored') { event.preventDefault(); if (isV2()) makeRoom(); openCard(item, received.id, 'take'); return; }
        if (isV2() && (key === 'r' || key === 'a') && received) { event.preventDefault(); openComposer(item, thread, key === 'r' ? 'one' : 'all', null, received.id); return; }
        const target = { r: '[data-action="one"]', a: '[data-action="all"]', k: '[data-action="task"]' }[key];
        if (!target || !received) return;
        event.preventDefault();
        const press = () => document.querySelector(`.message[data-message="${CSS.escape(received.id)}"] ${target}`)?.click();
        if (!document.querySelector(`.message[data-message="${CSS.escape(received.id)}"]:not(.compact)`)) {
            const opened = state.expanded.get(item.parentItemId) || new Set();
            opened.add(received.id);
            state.expanded.set(item.parentItemId, opened);
            render();
        }
        press();
    });

    // Il menu dell'utente si chiude con un clic fuori o con Esc.
    document.addEventListener('click', event => {
        if (state.menuOpen && !event.target.closest('.account')) { state.menuOpen = false; render(); }
        if (state.armed && !event.target.closest('.tag.swap, .ao-tag-swap')) { state.armed = null; render(); }
        if (state.snoozeMenu && !event.target.closest('.snooze')) { state.snoozeMenu = null; render(); }
        if (state.manageMenu && !event.target.closest('.manage')) { state.manageMenu = null; render(); }
        if (state.palette?.inline && !event.target.closest('.top-search')) { state.palette = null; render(); }
    });
    document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        if (state.menuOpen) { state.menuOpen = false; render(); }
        else if (state.palette) { state.palette = null; render(); }
        else if (state.drawerOpen) { state.drawerOpen = false; render(); }
        else if (state.snoozeMenu) { state.snoozeMenu = null; render(); }
        else if (state.manageMenu) { state.manageMenu = null; render(); }
        else if (document.querySelector('.ao-select-menu')) closeAoSelects();
        else if (state.settingsOpen) closeSettings();
    });
    applyAppearance(state.settings);
    darkQuery?.addEventListener?.('change', () => applyAppearance(state.settings));
    narrowQuery?.addEventListener?.('change', () => applyLayout(state.settings));
    mediumQuery?.addEventListener?.('change', () => applyLayout(state.settings));

    (async () => {
        state.user = await Data.session();
        if (!state.user) { root.replaceChildren(loginScreen()); return; }
        render();
        try { state.config = await Data.config(); } catch { state.config = {}; }
        await loadLists();
        openFromLink();
        loadMentions();
        loadMyTasks();
        scheduleRefresh();
    })();
})();

</script>
</body>
