#ao-root .ao-item, #ao-root .ao-card, #ao-root .ao-segmented, #ao-root .ao-bar-btn, #ao-root .ao-new-ticket, #ao-root .ao-mailbar, #ao-root .ao-statusbar { -webkit-backdrop-filter: var(--ao-blur); backdrop-filter: var(--ao-blur); }
#ao-root .ao-item:not(.ao-expanded, .ao-static):hover { background: var(--ao-item-hover); box-shadow: var(--ao-shadow-card), var(--ao-item-hover-glow), inset 0 0 0 1px var(--ao-item-hover-edge); }
#ao-root :is(.ao-new-ticket, .ao-thread-bar .ao-pill):hover { border-color: var(--ao-call-edge-hover); box-shadow: var(--ao-call-glow-hover); animation: ao-call-on .4s ease-out, ao-call-sway 4.8s ease-in-out .4s infinite; }
@keyframes ao-call-on { from { box-shadow: var(--ao-call-glow-rest); } to { box-shadow: var(--ao-call-glow-hover); } }
@keyframes ao-call-sway {
    0%, 100% { box-shadow: var(--ao-call-glow-hover); }
    25% { box-shadow: var(--ao-call-glow-left); }
    75% { box-shadow: var(--ao-call-glow-right); } }

/* ==========================================================================================================
   MAPPA DEGLI STILI DI MAGUS: un solo stile per ogni tipo di elemento, ovunque.
   Si carica per ultimo: porta sugli stessi valori anche le schede prese dal pannello AMP (#ao-root.ao-host).
   Ogni elemento nuovo usa uno di questi tipi; il controllo automatico (audit) misura tutte le schermate e
   segnala qualunque tipo con più di una variante.

   TIPO                 CLASSI                                   STILE
   Colonna              .card                                    fondo --surface, bordo --line, angoli 16, ombra card
   Scheda interna       .tool .config-item .composer .ao-item    fondo --panel-bg, bordo --line, angoli 12, niente ombra
     aperta/attiva      .config-item.open .ao-item.ao-expanded   bordo --accent-line + bagliore --glow-rest
   Campo                input select textarea .ao-input          fondo --field-bg (pieno), bordo --line-strong, angoli 10,
                                                                 15 px, altezza 36 (nel modulo di risposta: senza bordo)
   Etichetta di campo   .field-input>span .ao-label              13 px normale, colore --muted
   Titolo di sezione    .side h2 .tool h2 .ao-card-title          15 px seminero, colore --text
   Area del selettore   .tabs .segmented .ao-segmented .ao-choice fondo --track (in una card --track-in-card), bordo --line,
                                                                 angoli 12, margine interno 3
   Voce del selettore   .tab .segment .ao-segment .ao-choice-opt 13 px medio (schede in alto 15), --muted; scelta --text;
                                                                 nelle azioni delle schede: il colore dell'azione (come nel pannello)
   Pillola della scelta .thumb .ao-segment-thumb .ao-choice-thumb fondo --seg-thumb, filo --seg-line, ombra --seg-shadow,
                                                                 angoli 9
   Pulsante principale  .btn.primary .ao-button.ao-primary       pieno --btn-fill (o colore dell'azione), angoli 10,
                                                                 15 px medio, altezza 36
   Pulsante secondario  .btn .ao-button                          contorno --line-strong, angoli 10, 15 px medio, altezza 36
   Comando di testo     .link .ao-link-button                    13 px medio, colore --accent
   Comando della mail   .message-action                          12 px medio, --muted; al passaggio fondo --hover
   Etichetta (tag)      .tag .ao-user-tag .ao-chip               pillola alta 20, 12 px medio, bordo --line-strong;
                                                                 la propria: colore dell'etichetta dell'operatore
   Menu a tendina       .menu .ao-menu                           fondo --menu-bg (pieno), bordo --line-strong, angoli 12,
                                                                 ombra --menu-shadow; voci 13 px, al passaggio --hover
   Etichetta "suggerita" .ao-suggest-tag                         pillola piccola, fondo --selected, testo --accent
   Sezione chiusa       .ao-closed-toggle                        contorno tratteggiato --line-strong, angoli 10
   Testo citato         .ao-mail-preview .ao-ticket-description  fondo --field-bg, angoli 10, 13 px --muted
   Pulsante di chiamata .new-ticket .ao-pill .ao-new-ticket      bordo --line, testo --accent, bagliore --glow-rest; al
                                                                 passaggio bordo --accent-line e bagliore che respira
   Sezione chiusa (2)   .list-section-toggle                     come .ao-closed-toggle (Ignorate in fondo a Posta)
   Freccia di chiusura  .ao-collapse                             come nel pannello
   Pillola Cc            .tag.cc-pill                           etichetta piccola, testo --muted: il servizio è solo in Cc

   Schede del pannello (#ao-root.ao-host): testo e misure sono quelli del pannello AMP (13 px base, 12 voci e
   anteprima, 11 etichette, pulsanti e campi alti 32, seminero 600); i colori restano quelli della mappa.
   ========================================================================================================== */

/* Valori del pannello ricondotti a quelli di Magus */
#ao-root.ao-host {
  --ao-surface: var(--panel-bg);
  --ao-bg: var(--field-bg);
  --ao-quote-bg: var(--field-bg);
  --ao-line: var(--line);
  --ao-line-light: var(--line);
  --ao-line-strong: var(--line-strong);
  --ao-text: var(--text);
  --ao-text-muted: var(--muted);
  --ao-text-subtle: var(--subtle);
  --ao-text-accent: var(--accent);
  --ao-accent: var(--accent);
  --ao-accent-bg: var(--selected);
  --ao-accent-border: var(--accent-line);
  --ao-hover: var(--hover);
  --ao-radius-base: 10px;
  --ao-radius-pill: 999px;
  --ao-radius-badge: 999px;
  /* testo e misure del pannello AMP, uguali all'originale */
  --ao-fs-xs: 10px;
  --ao-fs-sm: 11px;
  --ao-fs-md: 12px;
  --ao-fs-base: 13px;
  --ao-fs-lg: 14px;
  --ao-fs-xl: 16px;
  --ao-fw-normal: 400;
  --ao-fw-medium: 600;
  --ao-fw-bold: 700;
  --ao-control-height: 32px;
  --ao-blur: none;
  --ao-shadow-card: 0 0 transparent;
  --ao-item-hover-glow: 0 0 transparent;
  --ao-open-shadow: var(--glow-rest);
  --ao-open-edge: var(--accent-line);
  --ao-segment-track: var(--track-in-card);
  --ao-choice-track: var(--track-in-card);
  --ao-selection: var(--seg-thumb);
  --ao-selection-line: var(--seg-line);
  --ao-selection-shadow: var(--seg-shadow);
  --ao-btn-highlight: var(--btn-highlight);
  --ao-tone-line: var(--btn-line);
  font-size: var(--ao-fs-base);
  line-height: 1.4;
  color: var(--text);
}

/* Scheda interna */
#ao-root.ao-host .ao-item { padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-bg); box-shadow: none; transform: none; filter: none; }
#ao-root.ao-host .ao-item.ao-expanded { border-color: var(--accent-line); box-shadow: var(--glow-rest); transform: none; }
#ao-root.ao-host .ao-item:not(.ao-expanded, .ao-static):hover { background: var(--hover); box-shadow: none; }
#ao-root.ao-host .ao-update-card { border-color: var(--line); }

/* Campo */
#ao-root.ao-host .ao-input { min-height: var(--ao-control-height); padding: 6px 10px; border: 1px solid var(--line-strong) !important; border-radius: 10px; background: var(--field-bg) !important; color: var(--text) !important; }
#ao-root.ao-host textarea.ao-input { padding: 8px 10px; }
#ao-root.ao-host .ao-mail-preview { border-radius: 10px; background: var(--field-bg); color: var(--muted); }

/* Etichetta di campo e titolo di sezione */
#ao-root.ao-host .ao-label { color: var(--muted); letter-spacing: 0; text-transform: none; }
#ao-root.ao-host .ao-card-title { color: var(--text); }

/* Area del selettore, voci e pillola */
#ao-root.ao-host :is(.ao-segmented, .ao-choice) { padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--track-in-card); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
#ao-root.ao-host :is(.ao-segment, .ao-choice-option) { border-radius: 9px; }
#ao-root.ao-host .ao-choice-sub { } /* colore come nel pannello (si tinge sulla voce scelta) */
#ao-root.ao-host :is(.ao-segment-thumb, .ao-choice-thumb) { top: 3px; bottom: 3px; border-radius: 9px; }

/* Pulsanti */
#ao-root.ao-host .ao-button { padding: 0 14px; border-radius: 10px; }
#ao-root.ao-host .ao-button:not(.ao-primary) { border: 1px solid var(--line-strong); background: transparent; color: var(--text); }
#ao-root.ao-host .ao-button.ao-primary:not(.ao-fill-forward, .ao-fill-danger, .ao-fill-resolve, .ao-fill-hold) { border-color: var(--btn-line); background: var(--btn-fill); box-shadow: var(--btn-highlight); }

/* Comando di testo */
#ao-root.ao-host .ao-link-button { color: var(--accent); letter-spacing: 0; text-transform: none; }
#ao-root.ao-host .ao-link-button:hover:not(:disabled) { color: var(--text); }

/* Etichetta (tag) */
#ao-root.ao-host :is(.ao-user-tag, .ao-chip) { height: 20px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 999px; background: transparent; box-shadow: none; color: var(--text); font-size: var(--ao-fs-sm); font-weight: var(--ao-fw-medium); line-height: 18px; }
#ao-root.ao-host .ao-user-tag.mine { border-color: color-mix(in srgb, var(--label) 60%, transparent); background: color-mix(in srgb, var(--label) 22%, transparent); color: color-mix(in srgb, var(--label) 45%, var(--text)); }
#ao-root.ao-host .ao-chip.ao-tone-hold { border-color: color-mix(in srgb, var(--working) 50%, transparent); color: var(--working); }

/* Tempo lavorato: area come i selettori, pulsanti come la pillola */
#ao-root.ao-host .ao-timer { height: 32px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--track-in-card); }
#ao-root.ao-host .ao-timer-step { border-radius: 9px; background: var(--seg-thumb); box-shadow: inset 0 0 0 1px var(--seg-line), var(--seg-shadow); color: var(--text); }
#ao-root.ao-host .ao-timer-value { }

/* Testo della scheda */
#ao-root.ao-host .ao-item-number { color: var(--accent); }
#ao-root.ao-host .ao-item-title { color: var(--text); }
#ao-root.ao-host :is(.ao-item-company, .ao-item-activity, .ao-item-sub, .ao-ticket-dates, .ao-item-time) { color: var(--muted); }
#ao-root.ao-host .ao-ticket-dates b { color: var(--text); }

/* Magus: il modulo di risposta è una scheda interna come le altre */
.composer { border-color: var(--line); background: var(--panel-bg); }
.ticket-stack { display: grid; gap: 10px; }
/* Sezione dentro una scheda (Attività del ticket): solo una riga sopra, niente riquadro */
#ao-root.ao-host .ao-card { padding: 12px 0 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; box-shadow: none; }

/* Menu a tendina: come il menu dell'utente */
#ao-root.ao-host .ao-menu { padding: 6px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--menu-bg); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--menu-shadow); }
#ao-root.ao-host .ao-menu-item { min-height: 34px; border-radius: 8px; color: var(--text); }
#ao-root.ao-host .ao-menu-item:hover, #ao-root.ao-host .ao-menu-item.ao-active { background: var(--hover); }
#ao-root.ao-host .ao-menu-group { color: var(--subtle); }
#ao-root.ao-host .ao-select-search { color: var(--text); }
#ao-root.ao-host .ao-suggest-tag { margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--selected); color: var(--accent); font-size: var(--ao-fs-xs); font-weight: var(--ao-fw-medium); }
#ao-root.ao-host .ao-suggest-mark { color: var(--accent); }
/* Ticket chiusi */
#ao-root.ao-host .ao-closed-toggle { border: 1px dashed var(--line-strong); border-radius: 10px; background: none; color: var(--muted); font-size: var(--ao-fs-md); }
#ao-root.ao-host .ao-closed-item { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-bg); }
#ao-root.ao-host .ao-ticket-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
/* Testo citato */
#ao-root.ao-host .ao-ticket-description { padding: 8px 10px; border-radius: 10px; background: var(--field-bg); color: var(--muted); font-size: var(--ao-fs-md); white-space: pre-line; overflow-wrap: anywhere; max-height: 160px; overflow-y: auto; }
/* Etichetta di un collega da prendere (due clic) */
#ao-root.ao-host .ao-tag-swap { cursor: pointer; }
#ao-root.ao-host .ao-tag-swap.ao-armed-tag { gap: 4px; border-color: color-mix(in srgb, var(--label) 60%, transparent); }
#ao-root.ao-host .ao-tag-swap .icon { width: 11px; height: 11px; }
/* Tempo scritto a mano */
#ao-root.ao-host .ao-timer-value { cursor: text; }
#ao-root.ao-host .ao-timer-input { background: var(--field-bg); color: var(--text); }
/* Selettore a icone nella colonna stretta: la voce scelta ha spazio per il nome intero */
#ao-root.ao-host .ao-segmented-icons .ao-segment.ao-grow { flex: 4; }
/* Tools: riga della connessione (pallino, esito, Prova a destra) */
#ao-root.ao-host .ao-health { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--ao-fs-md); }
#ao-root.ao-host .ao-health .statusbar-dot.danger { background: var(--danger); }
#ao-root.ao-host .ao-health .statusbar-dot.neutral { background: var(--subtle); }

        const node = document.createElement(tag);

            if (value === null || value === undefined || value === false) continue;
            if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
            else if (key === 'class') node.className = value;
            else if (key === 'value') node.value = value;

    // ------------------------------------------------------------------
    // Formati
    // ------------------------------------------------------------------
    const pad = value => String(value).padStart(2, '0');
    function parseDate(value) {
        if (!value) return null;
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date;
    }
    // Oggi: ora; ieri: "ieri"; prima: giorno/mese.
    function shortWhen(value) {
        const date = parseDate(value);
        if (!date) return '';
        const days = Math.round((new Date(new Date().toDateString()) - new Date(date.toDateString())) / 86400000);
        if (days === 0) return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        if (days === 1) return 'ieri';
        return `${pad(date.getDate())}/${pad(date.getMonth() + 1)}`;
    }
    function fullWhen(value) {
        const date = parseDate(value);
        return date ? `${pad(date.getDate())}/${pad(date.getMonth() + 1)} ${pad(date.getHours())}:${pad(date.getMinutes())}` : '';
    }
    const sameEmail = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
    // "Nome <email>" oppure solo l'email.
    function sender(from) {
        const text = String(from || '').trim();
        const match = text.match(/^(.*?)\s*<([^>]+)>$/);
        if (match) return { name: match[1].replace(/^"|"$/g, '') || match[2], email: match[2] };
        return { name: text, email: text.includes('@') ? text : '' };
    }
    const initials = name => String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0].toUpperCase()).join('');
    const surname = name => String(name || '').trim().split(/\s+/).pop() || '';
    const addresses = text => String(text || '').split(/[;,\s]+/).map(item => item.trim()).filter(Boolean);
    const cleanSubject = subject => String(subject || '').replace(/^\s*((re|r|fw|fwd|i)\s*:\s*)+/i, '').trim();
    const byName = ([, a], [, b]) => String(a.name || '').localeCompare(String(b.name || ''), 'it');

    // ------------------------------------------------------------------
    // Configurazioni dell'operatore (come nel pannello: profilo, agenzie, attività, risposte utili)
    // ------------------------------------------------------------------
    const SETTINGS_KEY = 'snow_ticket_assistant_v1';
    // Colori dell'etichetta dell'operatore (gli stessi del pannello).
    const LABELS = {
        rosso: '#d13438', arancio: '#ca5010', ambra: '#c19c00', verde: '#107c10', acqua: '#038387',
        azzurro: '#0078d4', indaco: '#4f6bed', viola: '#8764b8', rosa: '#c239b3', grafite: '#69797e'
    };
    // Tema (automatico, chiaro, scuro) delle preferenze, sulla radice della pagina.
    const darkQuery = window.matchMedia?.('(prefers-color-scheme: dark)');
    function applyAppearance(settings) {
        const theme = settings.preferences.theme || 'auto';
        const dark = theme === 'dark' || (theme === 'auto' && (darkQuery ? darkQuery.matches : true));
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
        document.documentElement.dataset.style = 'glass'; // un solo stile (il flat è stato tolto)
        document.documentElement.dataset.mail = settings.preferences.mailView === 'classic' ? 'classic' : 'chat'; // mail: a chat leggera o classiche
        document.documentElement.style.setProperty('--label', LABELS[settings.profile.label] || LABELS.azzurro);
        applyLayout(settings);
    }
    // Vista computer o mobile: scelta nelle impostazioni, oppure (automatica) dalla larghezza dello schermo.
    const narrowQuery = window.matchMedia?.('(max-width: 760px)');
    const mediumQuery = window.matchMedia?.('(max-width: 1100px)');
    function applyLayout(settings) {
        const view = settings.preferences.view || 'auto';
        const narrow = !!narrowQuery?.matches;
        const layout = view === 'mobile' || (view === 'auto' && narrow) ? 'mobile' : mediumQuery?.matches ? 'medium' : 'wide';
        const changed = document.documentElement.dataset.layout !== layout;
        document.documentElement.dataset.layout = layout;
        document.documentElement.toggleAttribute('data-wide', layout === 'mobile' && !narrow);
        // i dettagli stanno a destra (computer largo) o sopra la mail: cambiando vista si ridisegna
        if (changed && typeof state !== 'undefined' && state.user) render();
    }
    function reference(value) {
        if (!value) return { value: '', displayValue: '' };
        if (typeof value === 'string') return { value: '', displayValue: value };
        return { value: value.value || '', displayValue: value.displayValue || '' };
    }
    function normalizeSettings(data) {
        const object = value => (value && typeof value === 'object' && !Array.isArray(value) ? value : {});
        const companies = object(data?.companies);
        Object.values(companies).forEach(company => {
            const list = Array.isArray(company.domains) ? company.domains : String(company.domains || '').split(/[,;\s]+/);
            company.domains = [...new Set(list.map(item => String(item).trim().toLowerCase().replace(/^@/, '')).filter(Boolean))];
        });
        return {
            ...object(data),
            profile: { ...object(data?.profile), assignedTo: reference(data?.profile?.assignedTo), label: LABELS[data?.profile?.label] ? data.profile.label : 'azzurro' },
            preferences: { ...object(data?.preferences) },
            companies,
            activities: object(data?.activities),
            usefulResponses: object(data?.usefulResponses)
        };
    }
    function loadSettings() {
        try { return normalizeSettings(JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null')); }
        catch { return normalizeSettings(null); }
    }
    function saveSettings(settings) {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ ...settings, updated: new Date().toISOString() })); return true; }
        catch { return false; }
    }

    // ------------------------------------------------------------------
    // Function (le stesse del pannello AMP, senza quelle di Outlook)
    // ------------------------------------------------------------------
    const FUNCTIONS_URL = 'https://jakfunction-bzh9g2e6amhtdgff.italynorth-01.azurewebsites.net/api/';
    // Token rifiutato dalla Function (401): se ne chiede uno nuovo e si riprova una volta.
    async function call(name, params = {}, method = 'GET', retried = false) {
        let url = FUNCTIONS_URL + name;
        const request = { method, headers: { Accept: 'application/json', Authorization: `Bearer ${await window.MagusAuth.token({ fresh: retried })}` } };
        if (method === 'GET') {
            const query = new URLSearchParams(Object.entries(params).filter(([, value]) => value !== undefined && value !== null));
            if (String(query)) url += `?${query}`;
        } else {
            request.headers['Content-Type'] = 'application/json';
            request.body = JSON.stringify(params);
        }
        const response = await fetch(url, request);
        if (response.status === 401 && !retried) return call(name, params, method, true);
        const data = await response.json().catch(() => null);
        const reading = ['PluginConfig', 'ListQueue', 'ListThreadMessages', 'GetMailBody', 'SearchTicketRecords', 'Health'].includes(name);
        if (!reading || !response.ok) ActionLog.add('function', name, `${response.status}${params.action ? ` ${params.action}` : ''}${data?.reason ? ` ${data.reason}` : ''}`); // registro: azioni ed errori
        if (!response.ok || data?.status === 'error') {
            const error = new Error(data?.message || `${name}: errore ${response.status}`);
            error.reason = data?.reason || data?.error || null;
            error.data = data;
            throw error;
        }
        return data;
    }

    const OPEN_TICKET_STATUSES = ['In Progress', 'On Hold'];
    const THREAD_STATUS = { New: 'Nuovo', Working: 'In coda', Acquired: 'In carico', Ignored: 'Ignorata', Forwarded: 'Inoltrata', Solved: 'Risolta' };
    const TICKET_STATUS = { 'In Progress': 'In Progress', 'On Hold': 'On Hold', Resolved: 'Resolved', Canceled: 'Canceled' }; // come nel pannello
    const TICKET_TONE = { 'In Progress': 'accent', 'On Hold': 'hold', Resolved: 'success', Canceled: 'neutral' };
    // Etichetta dello stato del ticket (come stateChip del pannello): In Progress non si mostra.
    const stateChip = ticket => (ticket.status && ticket.status !== 'In Progress' ? h('span', { class: `ao-chip ao-tone-${TICKET_TONE[ticket.status] || 'neutral'}` }, TICKET_STATUS[ticket.status] || ticket.status) : null);
    const NOTES_MAX = 2000;
    // Il thread è cambiato nel frattempo: la function si è fermata, la vista si aggiorna.
    const CHANGED = {
        thread_changed: 'Nuovo messaggio nel thread: aggiornato',
        tagged_by_other: 'C’è il tag di un collega: aggiornato',
        thread_acquired: 'Già in carico a un collega: aggiornato',
        thread_forwarded: 'Già inoltrata: aggiornato',
        not_in_queue: 'Non è più in coda: aggiornato',
        not_ignored: 'Non è più tra le ignorate: aggiornato',
        not_tagged: 'Serve il tuo tag'
    };

    const operators = () => Object.values(state.config.operators || {});
    const operatorName = email => operators().find(operator => sameEmail(operator?.email, email))?.displayName || email || '';
    const serviceMailbox = () => state.config.ticketing?.email || '';
    const isMe = email => sameEmail(email, state.user?.email);
    const forwardGroups = () => Object.entries(state.config.forwardingTargets || {})
        .filter(([, target]) => target && target.enabled !== false)
        .map(([id, target]) => ({ id, tag: target.code || target.tag || id, name: target.name || '' }))
        .sort((a, b) => a.tag.localeCompare(b.tag, 'it'));
    // Nome dell'operatore: il profilo (assegnatario di ServiceNow), poi quello della config, poi l'account.
    function currentUser() {
        const profile = state.settings.profile.assignedTo;
        if (profile.displayValue) return profile;
        const name = operatorName(state.user?.email);
        return { displayValue: name && name !== state.user?.email ? name : state.user?.name || '', value: '' };
    }

    // Il servizio è tra i destinatari (A) o solo in copia (Cc) nell'ultima mail del thread (campi To e CC di MailEvents).
    const recipients = value => (Array.isArray(value) ? value : String(value || '').split(/[;,]/)).map(entry => String(entry).match(/[^\s<>"]+@[^\s<>"]+/)?.[0] || '').filter(Boolean);
    function addressedAs(message) {
        const box = serviceMailbox();
        if (!box) return null;
        if (recipients(message.to).some(address => sameEmail(address, box))) return 'to';
        return recipients(message.cc).some(address => sameEmail(address, box)) ? 'cc' : null;
    }
    function toThread(item, section) {
        const last = item.lastMessage || {};
        const thread = item.thread || {};
        return {
            key: `thread:${item.parentItemId}`,
            parentItemId: Number(item.parentItemId),
            section,
            subject: item.subject || last.subject || '(senza oggetto)',
            from: sameEmail(sender(last.from).email, serviceMailbox()) || !last.from ? sender(item.from || last.from) : sender(last.from), // l'ultima nostra: si mostra chi ha scritto
            receivedAt: item.lastReceived || last.receivedDate,
            messageCount: Number(item.messageCount) || 0,
            status: thread.status || 'New',
            assignedTo: thread.assignedTo || '',
            statusBy: thread.statusBy || '',
            statusAt: thread.statusAt || '',
            addressed: addressedAs(last),
            hasAttachment: Boolean(item.hasAttachment),
            lastFromService: sameEmail(sender(last.from || item.from).email, serviceMailbox())
        };
    }
    function toTicket(record, unseen) {
        return {
            key: `ticket:${record.ticketId}`,
            number: record.ticketId,
            parentItemId: Number(record.parentItemId) || null,
            subject: record.shortDescription || record.ticketId,
            status: record.status,
            agency: record.agency || '',
            operator: record.operator || '',
            ampReference: record.ampReference || '',
            openedAt: record.created || '',
            holdUntil: record.holdUntil || '',
            minutes: Number(record.elapsedTime) || 0,
            notes: record.notes || '',
            description: record.description || '',
            resolutionNotes: record.resolutionNotes || '',
            forwardGroup: record.forwardGroup || '',
            repliedAt: record.repliedAt || '',
            unseen: unseen?.unseenCount || 0,
            threadInfo: unseen || null,
            lastAt: unseen?.lastReceived || record.modified || record.created
        };
    }

    const Data = {
        session: () => window.MagusAuth.start(),
        // Task del thread (Planner, piano del team) e i miei task (To Do + Planner assegnati a me). Teams: colleghi con
        // la presenza e chat uno a uno. Function da creare: ThreadTasks, MyTasks, TeamsPeople, TeamsChat.
        // Note interne: si salvano col thread e partono sul canale Teams del servizio con le @menzioni. Function da creare: ThreadNotes.
        notes: async parentItemId => (await call('ThreadNotes', { parentItemId }))?.notes || [],
        // Sul canale Teams la nota arriva con il link che riapre il thread in Magus.
        addNote: (parentItemId, text, mentions, link) => call('ThreadNotes', { action: 'create', parentItemId, text, mentions, link }, 'POST'),
        mentions: async () => (await call('ThreadNotes', { mentions: 'me' }))?.notes || [],
        readMentions: parentItemId => call('ThreadNotes', { action: 'read', parentItemId }, 'POST'),
        threadTasks: async parentItemId => (await call('ThreadTasks', { parentItemId }))?.tasks || [],
        addThreadTask: (parentItemId, task) => call('ThreadTasks', { action: 'create', parentItemId, ...task }, 'POST'),
        setTask: (task, done) => call(task.source === 'todo' ? 'MyTasks' : 'ThreadTasks', { action: 'update', taskId: task.id, done }, 'POST'),
        myTasks: async () => (await call('MyTasks'))?.tasks || [],
        people: async () => (await call('TeamsPeople'))?.people || [],
        chat: async email => (await call('TeamsChat', { with: email }))?.messages || [],
        sendChat: (email, text) => call('TeamsChat', { with: email, text }, 'POST'),
        async config() {
            const raw = await call('PluginConfig');
            return raw?.payload || raw || {};
        },
        async queue(section) {
            const result = await call('ListQueue', { section });
            return (result?.threads || []).map(item => toThread(item, section));
        },
        async tickets() {
            const [found, mine] = await Promise.all([
                call('SearchTicketRecords', { statuses: OPEN_TICKET_STATUSES }, 'POST'),
                call('ListQueue', { section: 'mine' }).catch(() => null)
            ]);
            const unseen = new Map((mine?.threads || []).map(item => [Number(item.parentItemId), item]));
            return (found?.records || []).map(record => toTicket(record, unseen.get(Number(record.parentItemId))));
        },
        // Ticket chiusi (risolti, annullati) di un thread: si vedono soltanto, in fondo al pannello di destra.
        async closedTickets(parentItemId) {
            const result = await call('SearchTicketRecords', { parentItemId, statuses: ['Resolved', 'Canceled'], resultSize: 20 }, 'POST');
            return (result?.records || []).map(record => ({ ...toTicket(record), found: true }));
        },
        async searchTickets(text) {
            const result = await call('SearchTicketRecords', { text, resultSize: 20 }, 'POST');
            return (result?.records || []).map(record => ({ ...toTicket(record), found: true }));
        },
        async messages(parentItemId) {
            const result = await call('ListThreadMessages', { parentItemId });
            return (result?.messages || [])
                .map(message => ({ id: message.messageId, subject: message.subject || '', from: sender(message.from), receivedAt: message.receivedDate, hasAttachment: Boolean(message.hasAttachment), status: message.status }))
                .sort((a, b) => (parseDate(a.receivedAt) || 0) - (parseDate(b.receivedAt) || 0));
        },
        async body(messageId) {
            const result = await call('GetMailBody', { messageId });
            return { text: result?.newText || result?.text || '', to: result?.to || [], cc: result?.cc || [], hasAttachments: Boolean(result?.hasAttachments) };
        },
        // Azioni sul thread (MailEvents). knownCount: le mail che la vista conosce; se ne è arrivata un'altra la function
        // si ferma (thread_changed).
        thread(item, action, extra = {}) {
            const counted = ['tag', 'acquire', 'ignore', 'restore'].includes(action) && item.messageCount;
            return call('ManageThread', { action, parentItemId: item.parentItemId, ...(counted ? { knownCount: item.messageCount } : {}), ...extra }, 'POST');
        },
        async createTicket(item, { agency, shortDescription, description, minutes, forwardGroup }) {
            const result = await call('ManageTicket', {
                action: 'createTicket',
                ...(item ? { parentItemId: item.parentItemId, messageId: item.messageId } : {}),
                operator: state.user.email,
                status: 'In Progress',
                shortDescription,
                description: String(description || '').slice(0, 4000),
                agency: agency || '',
                elapsedTime: String(Number(minutes) || 0),
                ...(forwardGroup ? { forwardGroup } : {})
            }, 'POST');
            return toTicket(result.ticket);
        },
        async editTicket(number, changes, force = false) {
            const result = await call('ManageTicket', { action: 'editTicket', ticketId: number, force, ...changes }, 'POST');
            return toTicket(result.ticket);
        },
        // Testo e azione sul ticket: commento nelle note (con data e autore), risoluzione/annullamento nelle note di
        // risoluzione; un commento su un ticket in attesa lo rimette in lavorazione.
        async updateTicket(ticket, type, text, addMinutes, holdUntil = '') {
            const changes = {};
            if (text) {
                if (type === 'resolve' || type === 'cancel') changes.resolutionNotes = text.slice(0, NOTES_MAX);
                else {
                    const line = `${fullWhen(new Date().toISOString())} ${currentUser().displayValue}: ${text}`;
                    changes.notes = (ticket.notes ? `${ticket.notes}\n${line}` : line).slice(-NOTES_MAX);
                }
            }
            if (type === 'resolve') changes.status = 'Resolved';
            if (type === 'cancel') changes.status = 'Canceled';
            if (type === 'hold') { changes.status = 'On Hold'; if (holdUntil) changes.holdUntil = holdUntil; } // scadenza dell'attesa: campo da aggiungere al record
            if (type === 'comment' && ticket.status === 'On Hold') changes.status = 'In Progress';
            if (Number(addMinutes)) changes.elapsedTime = String(Math.max(0, ticket.minutes + Number(addMinutes)));
            return Object.keys(changes).length ? Data.editTicket(ticket.number, changes) : ticket;
        },
        forward: (item, group) => call('ForwardConversation', { parentItemId: item.parentItemId, groupName: group.id }, 'POST'),
        // Risposta a tutti dalla casella del servizio. Senza destinatari e oggetto: quelli della risposta a tutti
        // (presa in carico, inoltro con la sigla del gruppo).
        reply: (parentItemId, options) => call('ReplyAll', { parentItemId, ...options }, 'POST')
    };

    // ------------------------------------------------------------------
    // Stato
    // ------------------------------------------------------------------
    const TABS = [
        { id: 'work', label: 'Thread', icon: 'queue' },
        { id: 'utility', label: 'Utility', icon: 'utility' },
        { id: 'tools', label: 'Tools', icon: 'tools' }
    ];
    const state = {
        user: null,
        config: {},
        settings: loadSettings(),
        tab: 'work',
        section: 'mail', // Posta | Ticket
        ignoredOpen: false, // sezione delle ignorate aperta in fondo a Posta
        postaFilter: 'all', // filtri rapidi sopra Posta: all | mine | free | cc
        // Magus v2 (layout a cartelle, stile Help Scout): cartella o strumento aperto, lista e colonna del contatto
        view: 'free', // free | mine | others | tickets | later | attention | ignored | mailless | tasks | teams | utility | tools
        listHidden: false, listAuto: false, // lista richiusa a mano, o da sola mentre c'è il pannello del ticket
        reminder: null, // promemoria scaduto da mostrare (avviso in Magus)
        drawerOpen: false, mobileTab: 'mail', // telefono: menu delle cartelle; scheda del thread (mail | tickets)
        snoozed: (() => { try { return new Map(Object.entries(JSON.parse(localStorage.getItem('magus_snooze_v1') || '{}'))); } catch { return new Map(); } })(),
        picked: new Map(), // v2: parentItemId → mail scelta nel thread
        pickedTicket: new Map(), // v2: parentItemId → ticket scelto a destra
        notes: new Map(), noteDraft: '', mentions: [], editorMode: 'reply', // editor in cima al thread: reply | note // note interne del thread (anche sul canale Teams) e menzioni non lette
        snoozeMenu: null, palette: null, manageMenu: null, // Gestisci aperto sotto la mail (id) // menu di Rimanda; menu dei comandi (Ctrl+K): { text, index }
        expanded: new Map(), // parentItemId → mail aperte a mano (le altre, tranne l'ultima, restano su una riga)
        sideTab: 'thread', // pannello di destra: thread | tasks | teams
        sideCollapsed: (() => { try { return localStorage.getItem('magus_side_collapsed_v1') === '1'; } catch { return false; } })(),
        tasks: { thread: new Map(), mine: null, loading: new Set(), draft: { title: '', assignedTo: '', due: '' } }, // Task: Planner (del thread) e To Do
        teams: { people: null, loading: false, open: null, chats: new Map(), draft: '' }, // Teams: colleghi, presenza, chat
        lists: { active: [], ignored: [], tickets: [], threads: [] },
        found: null, // risultati della ricerca nei ticket
        search: '',
        loaded: false,
        error: '',
        selected: null, // chiave dell'elemento aperto (thread:<id>, ticket:<numero>, new)
        threads: new Map(), // parentItemId → { messages, bodies: Map, loading, error }
        drafts: new Map(), // parentItemId → risposta in corso
        composing: new Set(), // parentItemId con il modulo di risposta aperto (sotto la mail della bozza)
        sideCards: new Map(), // scheda del thread nel pannello di destra: key → { messageId, choice, group }
        openTicket: new Map(), // parentItemId → numero del ticket aperto (espanso) nel pannello di destra
        closed: new Map(), // parentItemId → ticket chiusi del thread (null mentre si caricano)
        closedOpen: null, // parentItemId con la sezione dei ticket chiusi aperta
        tagEntering: null,
        utility: { step: 0, operation: '', agency: '', values: {}, run: null }, // Utility: passo e dati dell'attività
        threadUtility: null, utilityEvents: new Map(), // Utility aperta sul ticket del thread; righe "Utility su …" nella cronologia
        toolsTab: 'diagnostics', health: null, refreshDraft: null, // riga della coda con l'etichetta appena messa (piccolo rimbalzo)
        panel: null, // azione aperta nella colonna dei dettagli: take | forward | update
        forms: new Map(), // chiave → bozza dei moduli (presa in carico, aggiornamento, nuovo ticket)
        forwardJobs: new Map(), // numero del ticket → inoltro in corso o fermo a metà
        busy: false,
        menuOpen: false, // menu a tendina dell'utente
        settingsOpen: false, // finestra delle impostazioni
        settingsTab: 'profile',
        editing: null, // voce aperta nelle impostazioni { kind, id } (id null = nuova)
        armed: null, // subentro sul tag di un collega: chiave in attesa del secondo clic
        toast: null
    };
    const allItems = () => [...state.lists.active, ...state.lists.threads, ...state.lists.ignored, ...state.lists.tickets, ...(state.found || [])];
    // Nuovo ticket senza mail (da Ticket): una voce finta, così centro e destra lo trattano come gli altri.
    const NEW_TICKET = { key: 'new-ticket', subject: 'Nuovo ticket', parentItemId: null, section: 'tickets', newTicket: true };
    const selectedItem = () => (state.selected === NEW_TICKET.key ? NEW_TICKET : allItems().find(item => item.key === state.selected) || null);

    // Pillola dell'esito, in basso.
    let toastTimer = null;
    function showStatus(text, tone = 'success', action = null, iconPaths = null) {
        state.toast = { text, tone, action, icon: iconPaths, id: Date.now() };
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { state.toast = null; render(); }, 3800);
        render();
    }
    // Esegue un'azione: blocca i pulsanti, mostra l'esito; se il thread è cambiato nel frattempo aggiorna tutto.
    async function run(action, done) {
        if (state.busy) return null;
        state.busy = true;
        render();
        try {
            const result = await action();
            if (done) showStatus(typeof done === 'function' ? done(result) : done);
            return result ?? true;
        } catch (error) {
            console.error('[Magus]', error);
            if (CHANGED[error.reason]) {
                showStatus(CHANGED[error.reason], 'warning');
                if (error.reason !== 'not_tagged') reloadAll();
            } else showStatus(error.message || 'Operazione non riuscita', 'danger');
            return null;
        } finally {
            state.busy = false;
            render();
        }
    }

    // Thread con ticket aperti: nell'elenco compare la mail (il thread), i suoi ticket stanno nel pannello di destra.
    function ticketThreads(tickets, active) {
        const groups = new Map();
        tickets.filter(ticket => ticket.parentItemId && !active.some(item => item.parentItemId === ticket.parentItemId)).forEach(ticket => {
            if (!groups.has(ticket.parentItemId)) groups.set(ticket.parentItemId, []);
            groups.get(ticket.parentItemId).push(ticket);
        });
        return [...groups.entries()].map(([parentItemId, list]) => {
            const info = list.find(ticket => ticket.threadInfo)?.threadInfo;
            const base = info ? toThread(info, 'mine') : { subject: list[0].subject, from: { name: '', email: '' }, receivedAt: list[0].lastAt, messageCount: 0, status: 'Acquired' };
            const latest = list.map(ticket => ticket.lastAt).sort().pop();
            const subject = info?.subject || info?.lastMessage?.subject || list[0].subject;
            return { ...base, subject, key: `thread:${parentItemId}`, parentItemId, section: 'mine', receivedAt: base.receivedAt || latest, tickets: list, unseen: Math.max(0, ...list.map(ticket => ticket.unseen || 0)) };
        });
    }
    async function loadLists() {
        try {
            const [active, ignored, tickets] = await Promise.all([Data.queue('active'), Data.queue('ignored'), Data.tickets()]);
            Object.assign(state.lists, { active, ignored, tickets, threads: ticketThreads(tickets, active) });
            state.listsAt = new Date(); // "Aggiornato alle…" in fondo all'elenco, come la barra di stato del pannello
            state.error = '';
        } catch (error) {
            state.error = error.message;
        }
        state.loaded = true;
        render();
    }
    function reloadAll() {
        state.threads.clear();
        loadLists().then(() => { const item = selectedItem(); if (item) openThread(item.parentItemId); });
    }
    function loadClosed(parentItemId) {
        if (!parentItemId || state.closed.has(parentItemId)) return;
        state.closed.set(parentItemId, null);
        Data.closedTickets(parentItemId).then(list => { state.closed.set(parentItemId, list); render(); }).catch(() => state.closed.set(parentItemId, []));
    }
    async function openThread(parentItemId) {
        loadClosed(parentItemId);
        if (!parentItemId || state.threads.has(parentItemId)) return;
        const thread = { messages: [], bodies: new Map(), loading: true, error: '' };
        state.threads.set(parentItemId, thread);
        try { thread.messages = await Data.messages(parentItemId); }
        catch (error) { thread.error = error.message; }
        thread.loading = false;
        render();
        await Promise.all(thread.messages.map(async message => {
            try { thread.bodies.set(message.id, await Data.body(message.id)); }
            catch (error) { thread.bodies.set(message.id, { error: error.message }); }
            render();
        }));
    }
    function select(item) {
        state.selected = item.key;
        state.panel = null;
        state.armed = null;
        render();
        openThread(item.parentItemId);
        loadThreadTasks(item.parentItemId);
    }
    function closeSelected() {
        state.selected = null;
        state.panel = null;
        render();
    }

    // ------------------------------------------------------------------
    // Azioni
    // ------------------------------------------------------------------
    // Tag: tuo → lo togli; di un collega → secondo clic per subentrare; nessuno → lo metti.
    // Come nel pannello (setLabel): l'etichetta cambia subito a schermo (la propria compare con un piccolo rimbalzo), poi
    // si salva; se non riesce (per esempio l'ha presa un collega nel frattempo) torna com'era e lo si dice.
    async function toggleTag(item) {
        const mine = item.status === 'Working' && isMe(item.assignedTo);
        const other = item.assignedTo && !mine && ['Working', 'Ignored'].includes(item.status);
        if (other && state.armed !== item.key) { state.armed = item.key; render(); return; }
        state.armed = null;
        const before = { status: item.status, assignedTo: item.assignedTo };
        Object.assign(item, mine ? { assignedTo: '' } : { status: 'Working', assignedTo: state.user.email });
        state.tagEntering = mine ? null : item.key;
        render();
        state.tagEntering = null;
        try {
            await Data.thread(item, mine ? 'untag' : 'tag', other ? { force: true } : {});
        } catch (error) {
            Object.assign(item, before);
            render();
            showStatus(CHANGED[error.reason] || error.message || String(error), 'danger');
        }
        loadLists();
    }
    // Presa in carico, inoltro e ignora vogliono il proprio tag: se manca si mette prima.
    async function ensureTag(item) {
        if (item.status === 'Working' && isMe(item.assignedTo)) return;
        if (item.assignedTo && !isMe(item.assignedTo)) {
            const error = new Error(CHANGED.tagged_by_other);
            error.reason = 'not_tagged';
            throw error;
        }
        await Data.thread(item, 'tag');
    }

    // Presa in carico: Agenzia (suggerita dal dominio del mittente), Attività, Short description; i Dettagli mostrano
    // i campi del ticket e il link di AMP già compilato.
    // Agenzia suggerita (come nel pannello): dal dominio del mittente, altrimenti dal nome nel testo; con il motivo.
    function suggestCompany(from, subject) {
        const domain = String(from?.email || '').split('@')[1]?.toLowerCase() || '';
        const companies = Object.entries(state.settings.companies);
        const byDomain = domain && companies.find(([, company]) => company.domains.some(item => domain === item || domain.endsWith(`.${item}`)));
        if (byDomain) return { id: byDomain[0], reason: `dal dominio @${domain}` };
        const text = String(subject || '').toLowerCase();
        const byText = companies.find(([, company]) => company.name && text.includes(company.name.toLowerCase()));
        return byText ? { id: byText[0], reason: 'dal testo della mail' } : null;
    }
    // Attività suggerite per l'agenzia (come nel pannello): imparate dalle prese in carico di questo operatore, pesando
    // le parole dell'oggetto e della mail. Restano in questo browser.
    const USAGE_KEY = 'magus_usage_v1';
    const Usage = {
        load() { try { return JSON.parse(localStorage.getItem(USAGE_KEY) || '{}') || {}; } catch { return {}; } },
        words: text => [...new Set(String(text || '').toLowerCase().split(/[^a-zà-ù0-9]+/).filter(word => word.length > 3))].slice(0, 40),
        record(companyId, activityId, text) {
            const data = Usage.load();
            const entry = data[`${companyId}|${activityId}`] || { n: 0, w: {} };
            entry.n += 1;
            Usage.words(text).forEach(word => { entry.w[word] = (entry.w[word] || 0) + 1; });
            data[`${companyId}|${activityId}`] = entry;
            try { localStorage.setItem(USAGE_KEY, JSON.stringify(data)); } catch { /* memoria del browser non disponibile */ }
        },
        suggest(companyId, text) {
            const words = Usage.words(text);
            return Object.entries(Usage.load())
                .filter(([key]) => key.startsWith(`${companyId}|`))
                .map(([key, entry]) => ({ id: key.slice(companyId.length + 1), score: entry.n + 5 * words.reduce((sum, word) => sum + (entry.w[word] || 0), 0) }))
                .filter(entry => state.settings.activities[entry.id])
                .sort((a, b) => b.score - a.score)
                .slice(0, 3)
                .map(entry => entry.id);
        }
    };
    const suggestText = draft => `${draft.subject || ''} ${String(draft.description || '').slice(0, 400)}`;
    // Con l'agenzia scelta, se l'attività non è stata scelta a mano si propone la più probabile (etichetta "suggerita").
    function proposeActivity(draft) {
        if (draft.activityId && !draft.activityProposed) return;
        const [top] = draft.companyId ? Usage.suggest(draft.companyId, suggestText(draft)) : [];
        draft.activityId = top || (draft.activityProposed ? '' : draft.activityId);
        draft.activityProposed = Boolean(top);
    }
    function takeDraft(item) {
        const key = `take:${item?.key || 'new'}`;
        if (!state.forms.has(key)) {
            const thread = item && state.threads.get(item.parentItemId);
            const first = thread?.messages?.[0];
            state.forms.set(key, {
                companyId: '',
                suggestion: item && !item.newTicket ? suggestCompany(item.from, item.subject) : null,
                activityId: '',
                subject: item && !item.newTicket ? cleanSubject(item.subject) : '',
                description: first ? thread.bodies.get(first.id)?.text || '' : '',
                detailsOpen: false
            });
            const draft = state.forms.get(key);
            draft.companyId = draft.suggestion?.id || '';
        }
        return state.forms.get(key);
    }
    const SEVERITY = { '1': '1 - High', '2': '2 - Medium', '3': '3 - Low' };
    const AMP_LINK_MAX = 6000;
    function ticketFields(draft) {
        const company = state.settings.companies[draft.companyId];
        const activity = state.settings.activities[draft.activityId];
        if (!company || !activity) return null;
        const prefix = activity.shortDescriptionPrefix || '';
        return {
            company: reference(company.company),
            assignmentGroup: reference(company.assignmentGroup),
            assignedTo: state.settings.profile.assignedTo,
            category: reference(activity.category),
            impact: activity.impact,
            urgency: activity.urgency,
            minutes: Number(activity.timeWorked) || 0,
            shortDescription: prefix ? `${prefix} ${draft.subject.replace(/^\s*\[[^\]]+\]\s*/, '')}`.trim() : draft.subject.trim(),
            description: String(draft.description || '').slice(0, 4000)
        };
    }
    // Nuovo incident su AMP con i campi già compilati ("^" separa i campi: nel testo si raddoppia).
    function ampLink(fields) {
        const value = text => String(text ?? '').replace(/\^/g, '^^');
        const worked = fields.minutes ? `1970-01-01 ${pad(Math.floor(fields.minutes / 60))}:${pad(fields.minutes % 60)}:00` : '';
        const pairs = [
            ['company', fields.company.value], ['assignment_group', fields.assignmentGroup.value], ['assigned_to', fields.assignedTo.value],
            ['x_avana_platform_category_value', fields.category.value], ['impact', fields.impact], ['urgency', fields.urgency],
            ['short_description', fields.shortDescription], ['time_worked', worked]
        ].filter(([, text]) => text);
        const base = `https://amp.service-now.com/incident.do?sys_id=-1&sysparm_query=${encodeURIComponent(pairs.map(([name, text]) => `${name}=${value(text)}`).join('^'))}`;
        const description = text => (text ? encodeURIComponent(`^description=${value(text)}`) : '');
        let text = fields.description;
        while (text && (base + description(text)).length > AMP_LINK_MAX) text = text.slice(0, Math.floor(text.length * .8));
        return base + description(text);
    }
    async function takeCharge(source) {
        const draft = takeDraft(source);
        const item = source?.newTicket ? null : source; // nuovo ticket senza mail: niente thread
        const fields = ticketFields(draft);
        if (!fields) return showStatus('Scegli Agenzia e Attività.', 'danger');
        if (!item && !String(draft.subject || '').trim()) return showStatus('Scrivi la Short description.', 'danger');
        const company = state.settings.companies[draft.companyId];
        const thread = item && state.threads.get(item.parentItemId);
        // Su un thread che ha già un ticket se ne apre un altro (SHP-<thread>-<n>): niente tag né presa del thread.
        const linked = item ? linkedThread(item) : false;
        const ticket = await run(async () => {
            if (item && !linked) {
                await ensureTag(item);
                await Data.thread({ ...item, messageCount: thread?.messages?.length || item.messageCount }, 'acquire');
            }
            return Data.createTicket(item ? { parentItemId: item.parentItemId, messageId: draft.messageId || thread?.messages?.[0]?.id } : null,
                { agency: company.name, shortDescription: fields.shortDescription, description: fields.description, minutes: fields.minutes });
        }, null);
        if (!ticket) return;
        await exitCard([...document.querySelectorAll(`[data-card="${CSS.escape(source?.key || '')}"]`)].find(node => node.offsetParent));
        Usage.record(draft.companyId, draft.activityId, suggestText(draft));
        state.forms.delete(`take:${source?.key || 'new'}`);
        if (item) state.sideCards.delete(item.key);
        state.panel = null;
        await loadLists();
        // si resta sul thread (ora con il ticket nel pannello di destra); il ticket senza mail si apre da solo
        state.selected = ticket.parentItemId ? `thread:${ticket.parentItemId}` : ticket.key; // senza mail: il ticket nuovo, in Ticket
        state.lists.tickets.filter(entry => entry.parentItemId === ticket.parentItemId).forEach(entry => state.openTicket.set(entry.number, entry.number === ticket.number));
        render();
        openThread(ticket.parentItemId);
        showStatus(`Ticket ${ticket.number} aperto e assegnato a te.`, 'success', null, ICONS.cardTake);
    }
    async function ignoreThread(item) {
        const done = await run(async () => { await ensureTag(item); await Data.thread(item, 'ignore'); }, null);
        if (!done) return;
        await exitCard([...document.querySelectorAll(`[data-card="${CSS.escape(item.key)}"]`)].find(node => node.offsetParent));
        closeSelected();
        await loadLists();
        showStatus('Spostata nelle Ignorate', 'success', { label: 'Annulla', onclick: async () => { await run(() => Data.thread({ ...item, status: 'Ignored' }, 'restore'), null); await loadLists(); } }, ICONS.cardIgnore);
    }

    // Inoltro in quattro passi: ticket, risposta con la sigla del gruppo, inoltro, chiusura del ticket. Al primo passo
    // che non riesce si ferma; il ticket resta tra gli aperti con la striscia dei passi e si riprende da lì.
    const FORWARD_STEPS = [['ticket', 'Ticket'], ['reply', 'Risposta'], ['forward', 'Inoltro'], ['close', 'Chiusura']];
    const FORWARD_ACTIONS = {
        ticket: async job => {
            await ensureTag(job.item);
            job.ticket = await Data.createTicket({ ...job.item, messageId: job.messageId },
                { agency: '', shortDescription: cleanSubject(job.item.subject), description: job.description, minutes: 0, forwardGroup: job.group.name || job.group.tag });
        },
        reply: job => Data.reply(job.item.parentItemId, { tag: job.group.tag, reference: job.ticket.ampReference || job.ticket.number, ticketId: job.ticket.number }),
        forward: job => Data.forward(job.item, job.group),
        close: async job => { job.ticket = await Data.updateTicket(job.ticket, 'resolve', `Inoltrato a ${job.group.tag}`); }
    };
    async function runForward(job, from) {
        for (let index = from; index < FORWARD_STEPS.length; index += 1) {
            job.steps[index] = 'run';
            render();
            try {
                await FORWARD_ACTIONS[FORWARD_STEPS[index][0]](job);
                job.steps[index] = 'ok';
            } catch (error) {
                console.error('[Magus]', error);
                job.steps[index] = 'ko';
                job.error = error;
                render();
                return false;
            }
        }
        render();
        return true;
    }
    async function forwardThread(item, group) {
        const thread = state.threads.get(item.parentItemId);
        const first = thread?.messages?.[0];
        const job = { item, group, messageId: first?.id, description: first ? thread.bodies.get(first.id)?.text || '' : '', ticket: null, steps: FORWARD_STEPS.map(() => 'wait') };
        state.panel = { type: 'forwarding', job };
        state.busy = true;
        const ok = await runForward(job, 0);
        state.busy = false;
        if (!job.ticket) {
            state.panel = null;
            if (CHANGED[job.error?.reason]) { showStatus(CHANGED[job.error.reason], 'warning'); reloadAll(); }
            else showStatus('Inoltro non riuscito', 'danger');
            return;
        }
        if (ok) {
            // tutto bene: la scheda esce, poi "Inoltrata a PO"
            await exitCard([...document.querySelectorAll(`[data-card="${CSS.escape(item.key)}"]`)].find(node => node.offsetParent));
            state.panel = null;
            closeSelected();
            await loadLists();
            showStatus(`Inoltrata a ${group.tag}`, 'success', null, ICONS.cardForward);
            return;
        }
        // un passo non riuscito: il ticket resta In lavorazione con la striscia; la pillola dice dove si è fermato
        state.forwardJobs.set(job.ticket.number, job);
        const stuck = FORWARD_STEPS[job.steps.indexOf('ko')][1];
        state.panel = null;
        await loadLists();
        state.selected = `thread:${item.parentItemId}`;
        render();
        showStatus(`Inoltro fermo al passo ${stuck}: riprova dal ticket`, 'warning');
    }
    // Inoltro fermo a metà su un ticket: i passi si ricavano dal ticket se la pagina non l'ha seguito.
    function forwardJobFor(ticket) {
        if (!ticket.forwardGroup || !OPEN_TICKET_STATUSES.includes(ticket.status)) return null;
        if (!state.forwardJobs.has(ticket.number)) {
            const group = forwardGroups().find(entry => [entry.name, entry.id, entry.tag].includes(ticket.forwardGroup));
            if (!group) return null;
            state.forwardJobs.set(ticket.number, {
                item: { parentItemId: ticket.parentItemId, subject: ticket.subject }, group, ticket,
                steps: ['ok', ticket.repliedAt ? 'ok' : 'ko', ticket.repliedAt ? 'ko' : 'wait', 'wait']
            });
        }
        return state.forwardJobs.get(ticket.number);
    }
    async function resumeForward(job, index) {
        if (state.busy) return;
        state.busy = true;
        const ok = await runForward(job, index);
        state.busy = false;
        if (ok) {
            state.forwardJobs.delete(job.ticket.number);
            showStatus(`Inoltrata a ${job.group.tag}`);
            closeSelected();
        }
        await loadLists();
    }

    // Aggiornamento del ticket: commento, risoluzione, attesa, annullamento; minuti da aggiungere al tempo lavorato.
    async function updateTicket(ticket) {
        const draft = updateDraft(ticket);
        if (!draft.text.trim()) return showStatus('Scrivi o scegli prima la risposta.', 'danger');
        const type = draft.type;
        const done = await run(() => Data.updateTicket(ticket, type, draft.text.trim(), Number(draft.minutes) || 0, type === 'hold' ? draft.holdUntil || '' : ''), null);
        if (!done) return;
        state.forms.delete(`update:${ticket.number}`);
        state.panel = null;
        if (ticket.parentItemId) { const thread = allItems().find(entry => entry.key === `thread:${ticket.parentItemId}`); if (thread) state.sideCards.delete(thread.key); } // il pannello dell'azione si chiude
        const closing = type === 'resolve' || type === 'cancel';
        if (closing && !ticket.parentItemId) closeSelected();
        if (closing) { state.closed.delete(ticket.parentItemId); state.openTicket.delete(ticket.number); } // passa tra i chiusi del thread
        await loadLists();
        if (closing) loadClosed(ticket.parentItemId);
        showStatus(closing ? `${ticket.number} chiuso` : `${ticket.number} aggiornato`, 'success', null, ICONS[{ comment: 'actComment', resolve: 'actResolve', hold: 'actHold', cancel: 'actCancel' }[type]]);
    }

    // Risposta a tutti con i destinatari e l'oggetto scelti.
    async function sendReply(item, thread) {
        const draft = draftFor(item, thread);
        if (!draft.text.trim()) return showStatus('Scrivi la risposta', 'danger');
        if (!addresses(draft.to).length) return showStatus('Manca il destinatario', 'danger');
        const ticket = item.key.startsWith('ticket:') ? item : null;
        const done = await run(() => Data.reply(item.parentItemId, {
            text: draft.text.trim(), to: addresses(draft.to), cc: addresses(draft.cc), bcc: addresses(draft.bcc), subject: draft.subject,
            ...(ticket ? { ticketId: ticket.number, reference: ticket.ampReference || ticket.number } : {})
        }), 'Risposta inviata');
        if (!done) return;
        const closing = draft.closeTicket && state.lists.tickets.find(ticket => ticket.number === draft.closeTicket);
        if (closing) { const update = updateDraft(closing); Object.assign(update, { type: 'resolve', text: draft.text.trim() }); await updateTicket(closing); }
        state.drafts.delete(item.parentItemId);
        state.composing.delete(item.parentItemId);
        state.threads.delete(item.parentItemId);
        openThread(item.parentItemId);
    }

    async function search(text) {
        state.search = text;
        if (!text.trim()) { state.found = null; render(); return; }
        const found = await run(() => Data.searchTickets(text.trim()));
        state.found = found || [];
        render();
    }

    // Etichetta sulla riga della coda (come nel pannello): senza etichetta il pulsantino per mettere la propria; la propria
    // si toglie con un clic; quella di un collega, sul thread aperto, al primo clic si prepara al passaggio (il suo
    // cognome barrato, poi il proprio) e al secondo diventa propria. Le ignorate mostrano solo chi le ha ignorate.
    function queueTag(item) {
        const stop = handler => event => { event.stopPropagation(); handler(); };
        const tagged = ['Working', 'Ignored'].includes(item.status) && item.assignedTo;
        const entering = state.tagEntering === item.key ? ' tag-in' : '';
        if (item.section !== 'active') return tagged ? h('span', { class: `tag${isMe(item.assignedTo) ? ' mine' : ''}` }, surname(operatorName(item.assignedTo))) : null;
        if (!tagged) return h('button', { type: 'button', class: 'tag-add', title: 'Metti la tua etichetta', 'aria-label': 'Metti la tua etichetta', onclick: stop(() => toggleTag(item)) }, icon(ICONS.tagAdd));
        if (isMe(item.assignedTo)) return h('button', { type: 'button', class: `tag mine${entering}`, title: 'Togli la tua etichetta', onclick: stop(() => toggleTag(item)) }, surname(operatorName(item.assignedTo)));
        if (item.key !== state.selected) return h('span', { class: 'tag', title: operatorName(item.assignedTo) }, surname(operatorName(item.assignedTo)));
        const armed = state.armed === item.key;
        return h('button', { type: 'button', class: `tag swap${armed ? ' armed' : ''}`, title: armed ? 'Clic di nuovo per prenderla' : `Prendi la mail di ${operatorName(item.assignedTo)}`, onclick: stop(() => toggleTag(item)) },
            armed ? [h('s', {}, surname(operatorName(item.assignedTo))), icon(ICONS.swap), h('span', { class: 'tag-next' }, surname(currentUser().displayValue))] : surname(operatorName(item.assignedTo)));
    }
    // Testo cercato evidenziato (markText del pannello).
    function markText(text, query) {
        const value = String(text || '');
        const needle = String(query || '').trim().toLowerCase();
        if (!needle) return value;
        const parts = [];
        let from = 0;
        const lower = value.toLowerCase();
        for (let at = lower.indexOf(needle); at >= 0; at = lower.indexOf(needle, from)) {
            parts.push(value.slice(from, at), h('mark', { class: 'mark' }, value.slice(at, at + needle.length)));
            from = at + needle.length;
        }
        parts.push(value.slice(from));
        return parts;
    }
    // Avatar colorato: il colore viene dal nome, così la stessa persona ha sempre lo stesso colore.
    function avatarTone(name) {
        let hash = 0;
        for (const char of String(name || '')) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
        return `tone-${hash % 5 + 1}`;
    }
    const personAvatar = (name, extra = '') => h('span', { class: `avatar ${avatarTone(name)}${extra}`, 'aria-hidden': 'true' }, initials(name));
    function listItem(item) {
        const ticket = item.key.startsWith('ticket:');
        const pick = () => select(item);
        const person = ticket ? '' : item.from?.name || item.from?.email || '';
        return h('li', {},
            h('div', { class: `item${person ? ' with-avatar' : ''}${item.addressed ? ` addr-${item.addressed}` : ''}`, 'data-key': item.key, role: 'button', tabindex: '0', 'aria-current': String(item.key === state.selected), onclick: pick, onkeydown: event => { if (event.key === 'Enter' && event.target === event.currentTarget) pick(); } },
                person ? personAvatar(person) : null,
                h('span', { class: 'item-top' },
                    h('span', { class: 'item-title' }, markText(item.subject, state.search)),
                    h('span', { class: 'item-time' }, shortWhen(ticket ? item.lastAt : item.receivedAt))),
                item.section === 'mine' ? h('span', { class: 'item-meta' },
                    h('span', {}, item.from?.name ? markText(item.from.name, state.search) : null), ccPill(item),
                    item.tickets.map(entry => h('span', { class: `tag${entry.status === 'On Hold' ? ' working' : ''}`, title: TICKET_STATUS[entry.status] || entry.status }, markText(entry.number, state.search))),
                    null) :
                h('span', { class: 'item-meta' },
                    ticket ? h('span', {}, markText([item.number, item.agency].filter(Boolean).join(' · '), state.search)) : h('span', {}, markText(item.from.name, state.search)), ticket ? null : ccPill(item),
                    ticket ? h('span', { class: `tag${item.status === 'On Hold' ? ' working' : ''}` }, TICKET_STATUS[item.status] || item.status) : queueTag(item),
                    null),
                ticket ? null : itemExtra(item)));
    }
    // Sotto la riga: quante mail, se ci sono allegati, da quanto aspetta una risposta (se l'ultima non è nostra).
    // Pillola "Cc" quando il servizio è solo in copia nell'ultima mail (nessuna azione richiesta).
    const ccPill = item => item.addressed === 'cc' ? h('span', { class: 'tag cc-pill', title: 'Siamo in copia' }, 'Cc') : null;
    function itemExtra(item) {
        const waited = item.section === 'active' && !item.lastFromService ? minutesSince(item.receivedAt) : null;
        const late = waited !== null && waited >= WAIT_LATE_MINUTES;
        if (!item.messageCount && !item.hasAttachment && waited === null) return null;
        return h('span', { class: 'item-extra' },
            item.messageCount ? h('span', { title: 'Mail del thread' }, icon(ICONS.mail), String(item.messageCount)) : null,
            item.hasAttachment ? h('span', { title: 'Allegati' }, icon(ICONS.attach)) : null,
            waited !== null ? h('span', { class: `item-wait${late ? ' late' : ''}`, title: 'Da quanto aspetta una risposta' }, `aspetta da ${duration(waited)}`) : null);
    }
    const WAIT_LATE_MINUTES = 120; // oltre, "aspetta da" diventa del colore dell'attenzione
    const minutesSince = when => { const date = parseDate(when); return date ? Math.max(0, Math.round((Date.now() - date.getTime()) / 60000)) : null; };
    const duration = minutes => minutes < 60 ? `${minutes} min` : minutes < 1440 ? `${Math.floor(minutes / 60)}h${minutes % 60 ? String(minutes % 60).padStart(2, '0') : ''}` : `${Math.floor(minutes / 1440)} g`;
    // Barra di stato (come nel pannello): pallino e stato dei servizi, a destra l'ora dell'ultimo aggiornamento.
    function statusBar() {
        const tone = state.error ? 'danger' : !state.loaded ? 'neutral' : 'ok';
        const text = state.error ? `Servizi in errore: ${state.error}` : !state.loaded ? 'Caricamento…' : 'Servizi attivi';
        return h('div', { class: `list-foot statusbar-${tone}` },
            h('span', { class: 'statusbar-dot', 'aria-hidden': 'true' }),
            h('span', { class: 'statusbar-text', title: text }, text),
            state.listsAt ? h('span', { class: 'statusbar-sync', title: 'Ultimo aggiornamento degli elenchi' }, `Aggiornato ${shortWhen(state.listsAt.toISOString())}`) : null,
            h('span', { class: 'statusbar-keys', title: SHORTCUTS.map(([keys, label]) => `${keys}  ${label}`).join('\n'), 'aria-label': 'Scorciatoie da tastiera' }, icon(ICONS.keys)));
    }
    // Elenco come in Outlook: solo le mail (un thread per riga, dal più recente); i ticket del thread stanno nel pannello
    // di destra. Le ignorate a parte. La ricerca filtra quello che c'è e, con Invio, cerca anche tra tutti i ticket.
    // Elenco a sinistra: Posta | Ticket.
    //  - Posta: le mail (in coda e quelle con ticket), dal più recente; in fondo le ignorate, in una sezione che si apre.
    //  - Ticket: i ticket senza mail (non stanno nella coda delle mail), Nuovo ticket in cima; con Invio la ricerca
    //    cerca tra tutti i ticket.
    // Filtri rapidi sopra Posta: tutte, mie (con la mia etichetta o in carico a me), libere (in coda senza etichetta), in copia.
    const POSTA_FILTERS = {
        all: () => true,
        mine: item => isMe(item.assignedTo) && ['Working', 'Acquired'].includes(item.status) || item.section === 'mine',
        free: item => item.section === 'active' && !item.assignedTo,
        cc: item => item.addressed === 'cc'
    };
    // Voci dell'elenco nell'ordine in cui si vedono (per le frecce della tastiera).
    function visibleItems() {
        return [...document.querySelectorAll('[data-list] .list .item')].map(node => allItems().find(item => item.key === node.dataset.key)).filter(Boolean);
    }
    function listColumn() {
        const needle = state.search.trim().toLowerCase();
        const match = item => !needle || [item.subject, item.number, item.agency, item.from?.name, item.ampReference, ...(item.tickets || []).flatMap(ticket => [ticket.number, ticket.ampReference, ticket.agency])].some(text => String(text || '').toLowerCase().includes(needle));
        const byDate = (a, b) => (parseDate(b.lastAt || b.receivedAt)?.getTime() || 0) - (parseDate(a.lastAt || a.receivedAt)?.getTime() || 0);
        const mails = [...state.lists.active, ...state.lists.threads].filter(match).filter(POSTA_FILTERS[state.postaFilter] || Boolean).sort(byDate);
        const ignored = state.lists.ignored.filter(match);
        const mailless = state.lists.tickets.filter(ticket => !ticket.parentItemId);
        const tickets = mailless.filter(match).sort(byDate);
        const found = state.found ? state.found.filter(item => !mailless.some(open => open.number === item.number)) : [];
        const head = h('div', { class: 'column-head stack' },
            h('div', { class: 'segmented', role: 'group', 'aria-label': 'Sezione' },
                [['mail', 'Posta', 'queue', state.lists.active.length + state.lists.threads.length], ['tickets', 'Ticket', 'ticket', mailless.length]].map(([id, label, iconName, count]) =>
                    h('button', { type: 'button', class: 'segment', 'aria-pressed': String(state.section === id), onclick: () => { if (state.section !== id) { state.section = id; closeSelected(); } } },
                        icon(ICONS[iconName]), label, h('span', { class: 'count' }, String(count))))),
            h('div', { class: 'search-row' },
                h('label', { class: 'search' }, icon(ICONS.search),
                    h('input', { id: 'search', type: 'search', placeholder: state.section === 'tickets' ? 'Cerca (Invio: tra tutti i ticket)' : 'Cerca', value: state.search, 'aria-label': 'Cerca',
                        oninput: event => { state.search = event.target.value; if (!state.search) state.found = null; render(); },
                        onkeydown: event => { if (event.key === 'Enter' && state.section === 'tickets') search(event.target.value); } }))),
            state.section === 'mail' ? h('div', { class: 'segmented filters', role: 'group', 'aria-label': 'Filtri' },
                [['all', 'Tutte'], ['mine', 'Mie'], ['free', 'Libere'], ['cc', 'Cc']].map(([id, label]) =>
                    h('button', { type: 'button', class: 'segment', 'aria-pressed': String(state.postaFilter === id), onclick: () => { state.postaFilter = id; render(); } }, label))) : null);
        const list = items => h('ul', { class: 'list' }, items.map(listItem));
        let body;
        if (!state.loaded) body = empty('queue', 'Caricamento…');
        else if (state.error) body = empty('queue', state.error);
        else if (state.section === 'tickets') {
            body = [
                h('button', { type: 'button', class: `new-ticket${state.selected === 'new-ticket' ? ' active' : ''}`, onclick: () => { state.selected = 'new-ticket'; state.panel = null; render(); } }, icon(ICONS.cardTake), 'Nuovo ticket'),
                tickets.length ? list(tickets) : (needle ? null : empty('ticket', 'Nessun ticket senza mail')),
                found.length ? h('section', { class: 'group' }, h('h2', { class: 'group-title' }, 'Ricerca nei ticket', h('span', { class: 'count' }, String(found.length))), list(found)) : null];
        } else {
            const open = state.ignoredOpen || Boolean(needle && ignored.length);
            body = [
                mails.length ? list(mails) : empty('queue', needle || state.postaFilter !== 'all' ? 'Nessun risultato' : 'Niente in coda'),
                state.lists.ignored.length ? h('div', { class: `list-section${open ? ' open' : ''}` },
                    h('button', { type: 'button', class: 'list-section-toggle', 'aria-expanded': String(open), onclick: () => { state.ignoredOpen = !state.ignoredOpen; render(); } },
                        icon(ICONS.ignored), h('span', {}, `Ignorate (${needle ? ignored.length : state.lists.ignored.length})`), h('span', { class: 'caret', 'aria-hidden': 'true' }, '▾')),
                    open ? list(ignored) : null) : null];
        }
        return h('section', { class: 'column', 'aria-label': 'Elenco', 'data-list': '' },
            h('div', { class: 'card' }, head, h('div', { class: 'scroll', 'data-scroll': `list:${state.section}` }, body),
                statusBar()));
    }

    // Ogni mail con sotto i suoi comandi: Rispondi e Rispondi a tutti aprono il modulo sotto la mail, crescendo dal
    // pulsante; Inoltra (solo in coda) e Crea ticket (solo sulle mail ricevute) preparano la scheda del thread nel

        const zone = find();
        const from = zone?.offsetHeight || 0;
        const old = zone?.firstElementChild;
        if (old && !reducedMotion()) await old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 110, easing: 'linear', fill: 'forwards' }).finished.catch(() => {});
        change();
        render();
        const next = find();
        if (!next || reducedMotion()) return;
        const content = next.firstElementChild;
        if (content) content.style.opacity = '0';
        const to = content ? next.scrollHeight : 0;
        if (to !== from) { next.style.overflow = 'hidden'; if (!content) next.style.display = 'block'; await next.animate([{ height: `${from}px` }, { height: `${to}px` }], { duration: 240, easing: 'ease-in-out' }).finished.catch(() => {}); next.style.overflow = ''; next.style.display = ''; }

        const operations = (Array.isArray(state.config.utilities?.operations) ? state.config.utilities.operations : [])
            .filter(operation => operation?.id && operation?.name && Array.isArray(operation.fields))
            .map(operation => ({
                ...operation,
                fields: operation.fields.filter(field => field?.id && UTILITY_FIELD_TYPES.includes(field.type)),

            const taken = (operation?.fields || []).filter(other => other.type === 'email').map(other => String(flow?.values?.[other.id] || '').toLowerCase()).filter(Boolean);

    function editorForm(tab, id, item) {

            if (field.reference) {
                values[field.key] = reference(item[field.key]).displayValue;

            }
            if (field.options) {

            }
            const initial = field.list ? (item[field.key] || []).join(', ') : String(item[field.key] ?? '');
            values[field.key] = initial;
            return input(field.label, initial, value => { values[field.key] = value; }, { id: fieldId, multiline: field.multiline, type: field.number ? 'number' : undefined, min: field.number ? '0' : undefined });

        const close = () => { state.editing = null; render(); };

            const targetId = id || createId(values[nameKey]);

            editor.fields.forEach(field => {
                const value = values[field.key];
                if (field.reference) next[field.key] = keepReference(previous[field.key], value);
                else if (field.list) next[field.key] = [...new Set(String(value).split(/[,;\s]+/).map(entry => entry.trim().toLowerCase().replace(/^@/, '')).filter(Boolean))];
