<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anteprima area AMP</title>
<!-- Stili dell'add-in di jak, per vedere l'area AMP nel suo contesto reale -->
<link href="taskpane.css" rel="stylesheet">
<style>
  /* ---- Solo per l'anteprima: la finta Outlook non fa parte dell'add-in ---- */
  :root { --ol-blue: #0f6cbd; --ol-line: #e1dfdd; --ol-muted: #605e5c; --ol-soft: #f5f5f5; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: #e9e7e5; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; color: #242424; }
  .preview-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 14px; background: #323130; color: #fff; }
  .preview-bar strong { font-size: 14px; margin-right: 4px; }
  .preview-bar button { padding: 4px 9px; border: 1px solid #8a8886; border-radius: 4px; background: #fff; color: #242424; font: inherit; cursor: pointer; }
  .preview-bar .note { color: #c8c6c4; font-size: 12px; }
  .layout { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; }

  /* Outlook simulata */
  .outlook { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 1px solid #c8c6c4; border-radius: 6px; background: #fff; overflow: hidden; }
  .ol-top { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--ol-blue); color: #fff; }
  .ol-top b { font-size: 14px; }
  .ol-top span { opacity: .85; font-size: 12px; }
  .ol-main { flex: 1; min-height: 0; display: flex; }
  .ol-list { flex: 0 0 300px; overflow-y: auto; border-right: 1px solid var(--ol-line); margin: 0; padding: 0; list-style: none; }
  .ol-row { display: grid; gap: 2px; padding: 9px 12px; border-bottom: 1px solid #f3f2f1; border-left: 3px solid transparent; cursor: pointer; }
  .ol-row:hover { background: #f5f5f5; }
  .ol-row.selected { background: #e8f1fa; border-left-color: var(--ol-blue); }
  .ol-row-top { display: flex; justify-content: space-between; gap: 8px; }
  .ol-sender { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ol-time { color: var(--ol-muted); font-size: 11px; white-space: nowrap; }
  .ol-subject { color: var(--ol-blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ol-snippet { color: var(--ol-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ol-cats { display: flex; gap: 4px; min-height: 0; }
  .ol-cat { padding: 0 7px; border-radius: 3px; font-size: 11px; font-weight: 600; color: #fff; }
  .ol-read { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 20px; }
  .ol-read h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .ol-read .ol-cats { margin-bottom: 12px; }
  .ol-msg { margin-bottom: 10px; border: 1px solid var(--ol-line); border-radius: 6px; }
  .ol-msg-head { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; background: #faf9f8; border-radius: 6px 6px 0 0; }
  .ol-msg-head small { color: var(--ol-muted); }
  .ol-msg.out .ol-msg-head { background: #eff6fc; }
  .ol-msg-body { margin: 0; padding: 10px 12px; white-space: pre-wrap; font: inherit; }
  .ol-actions { display: flex; gap: 8px; margin: 4px 0 12px; }
  .ol-btn { padding: 5px 14px; border: 1px solid #c8c6c4; border-radius: 4px; background: #fff; font: inherit; cursor: pointer; }
  .ol-btn.primary { background: var(--ol-blue); border-color: var(--ol-blue); color: #fff; }
  .ol-compose { display: grid; gap: 8px; margin-bottom: 14px; padding: 12px; border: 1px solid var(--ol-blue); border-radius: 6px; background: #fff; }
  .ol-compose textarea { min-height: 140px; padding: 8px; border: 1px solid #c8c6c4; border-radius: 4px; font: inherit; resize: vertical; }
  .ol-toast { padding: 8px 12px; margin-bottom: 12px; border-radius: 4px; background: #dff6dd; color: #107c10; font-weight: 600; }
  .ol-empty { color: var(--ol-muted); padding: 40px; text-align: center; }

  /* Riquadro dell'add-in */
  .taskpane { flex: 0 0 360px; display: flex; flex-direction: column; border: 1px solid #c8c6c4; border-radius: 6px; background: #f5f5f5; overflow: hidden; }
  .taskpane main { flex: 1; min-height: 0; overflow-y: auto; }
  .taskpane .app-header { padding: 12px 16px; }
  @media (max-width: 980px) {
    .layout { flex-direction: column; }
    .ol-main { flex-direction: column; }
    .ol-list { flex-basis: auto; max-height: 260px; border-right: 0; border-bottom: 1px solid var(--ol-line); }
    .taskpane { flex-basis: auto; min-height: 600px; }
  }
</style>
</head>
<body>

<div class="preview-bar">
  <strong>Anteprima area AMP</strong>
  <button type="button" id="preview-seed">Carica configurazioni di esempio</button>
  <button type="button" id="preview-reset-mail">Ripristina mail e ticket</button>
  <button type="button" id="preview-reset-config">Azzera configurazioni</button>
  <span class="note">Dati inventati · le configurazioni restano solo in questo browser</span>
</div>

<div class="layout">
  <!-- Outlook simulata: casella condivisa con le mail, i tag (categorie) e la risposta -->
  <section class="outlook" aria-label="Outlook simulato">
    <div class="ol-top"><b>Outlook (simulato)</b><span id="ol-mailbox"></span></div>
    <div class="ol-main">
      <ul class="ol-list" id="ol-list"></ul>
      <div class="ol-read" id="ol-read"></div>
    </div>
  </section>

  <!-- Riquadro dell'add-in: stessa struttura di taskpane.html (intestazione, schermata principale, area AMP) -->
  <div class="taskpane">
    <header class="app-header"><img alt="" height="40" src="icon-64.png" width="40"><div class="app-title"><h1>Test-Plugin</h1><p>anteprima area AMP</p></div></header>
    <main>
      <div id="main-view">
        <div class="notice">Schermata principale dell'add-in (simulata).</div>
        <button class="secondary-button amp-open-button" id="open-amp-button" type="button">Apri area AMP</button>
      </div>
      <div id="header-view" hidden></div>
      <section class="amp-view" hidden id="amp-view"></section>
    </main>
  </div>
</div>

<script src="amp-preview-backend.js"></script>
<script>
(function () {
  'use strict';
  const mailbox = window.AmpBackend.mailbox;
  const OPERATOR = { displayName: 'Marco Rossi', emailAddress: 'marco.rossi@example.com' };
  const CATEGORY_COLORS = { Marco: '#0f6cbd', Giulia: '#107c10', Luca: '#c75000' };
  const byId = id => document.getElementById(id);
  const pad = value => String(value).padStart(2, '0');
  const listeners = new Set();
  let selectedConversation = null;
  let compose = null; // { text } quando la risposta è aperta
  let toast = '';

  function el(tag, props = {}, ...children) {
    const element = document.createElement(tag);
    Object.entries(props).forEach(([key, value]) => {
      if (key === 'class') element.className = value;
      else if (key.startsWith('on')) element.addEventListener(key.slice(2), value);
      else element.setAttribute(key, value);
    });
    children.flat().forEach(child => child != null && element.append(child instanceof Node ? child : String(child)));
    return element;
  }
  function when(iso) {
    const date = new Date(iso);
    const today = new Date().toDateString() === date.toDateString();
    return today ? `${pad(date.getHours())}:${pad(date.getMinutes())}` : `${pad(date.getDate())}/${pad(date.getMonth() + 1)} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }
  const categoryChips = categories => el('div', { class: 'ol-cats' },
    categories.map(name => el('span', { class: 'ol-cat', style: `background:${CATEGORY_COLORS[name] || '#8a8886'}` }, name)));

  function conversations() {
    const groups = new Map();
    mailbox.listMessages().forEach(message => {
      if (!groups.has(message.conversationId)) groups.set(message.conversationId, []);
      groups.get(message.conversationId).push(message);
    });
    return [...groups.values()]
      .map(messages => messages.sort((a, b) => a.receivedAt.localeCompare(b.receivedAt)))
      .sort((a, b) => b[b.length - 1].receivedAt.localeCompare(a[a.length - 1].receivedAt));
  }
  const selectedMessages = () => conversations().find(list => list[0].conversationId === selectedConversation) || null;
  // La mail "aperta" è l'ultima della conversazione, come quando la selezioni in Outlook.
  const selectedMessage = () => selectedMessages()?.slice(-1)[0] || null;

  function renderList() {
    byId('ol-mailbox').textContent = `${mailbox.address.name} <${mailbox.address.email}> · casella condivisa`;
    byId('ol-list').replaceChildren(...conversations().map(messages => {
      const first = messages[0];
      const last = messages[messages.length - 1];
      const incoming = [...messages].reverse().find(item => item.direction === 'in') || first;
      return el('li', {
        class: `ol-row${first.conversationId === selectedConversation ? ' selected' : ''}`,
        onclick: () => select(first.conversationId)
      },
        el('div', { class: 'ol-row-top' }, el('span', { class: 'ol-sender' }, incoming.from.name), el('span', { class: 'ol-time' }, when(last.receivedAt))),
        el('div', { class: 'ol-subject' }, first.subject + (messages.length > 1 ? ` (${messages.length})` : '')),
        el('div', { class: 'ol-snippet' }, last.body.replace(/\s+/g, ' ')),
        categoryChips(last.categories));
    }));
  }
  function renderReading() {
    const messages = selectedMessages();
    const pane = byId('ol-read');
    if (!messages) {
      pane.replaceChildren(el('div', { class: 'ol-empty' }, 'Seleziona una mail.'));
      return;
    }
    const last = messages[messages.length - 1];
    const parts = [
      toast ? el('div', { class: 'ol-toast' }, toast) : null,
      el('h1', {}, messages[0].subject),
      categoryChips(last.categories),
      compose ? null : el('div', { class: 'ol-actions' }, el('button', { class: 'ol-btn primary', onclick: () => openReply('') }, 'Rispondi')),
      compose ? el('div', { class: 'ol-compose' },
        el('b', {}, `A: ${(last.direction === 'in' ? last.from : last.to[0]).name}`),
        (() => { const area = el('textarea', { id: 'ol-compose-text', 'aria-label': 'Testo della risposta' }); area.value = compose.text; area.addEventListener('input', () => { compose.text = area.value; }); return area; })(),
        el('div', { class: 'ol-actions' },
          el('button', { class: 'ol-btn primary', id: 'ol-send', onclick: send }, 'Invia'),
          el('button', { class: 'ol-btn', onclick: () => { compose = null; renderReading(); } }, 'Scarta'))) : null,
      [...messages].reverse().map(message => el('article', { class: `ol-msg ${message.direction}` },
        el('div', { class: 'ol-msg-head' },
          el('span', {}, el('b', {}, message.from.name), ' ', el('small', {}, `<${message.from.email}>`)),
          el('small', {}, when(message.receivedAt))),
        el('pre', { class: 'ol-msg-body' }, message.body)))
    ];
    pane.replaceChildren(...parts.flat().filter(Boolean));
  }
  function renderOutlook() { renderList(); renderReading(); }

  function select(conversationId) {
    if (selectedConversation !== conversationId) { compose = null; toast = ''; }
    selectedConversation = conversationId;
    renderOutlook();
    publish();
  }
  function openReply(text) {
    if (!selectedConversation) return false;
    compose = { text: text ? `${text}\n` : '' };
    toast = '';
    renderReading();
    byId('ol-compose-text')?.focus();
    return true;
  }
  function send() {
    const text = (compose?.text || '').trim();
    if (!text) return;
    const { applied } = mailbox.sendReply(selectedMessage().id, text, OPERATOR.displayName);
    compose = null;
    const STATES = { '2': 'In Progress', '3': 'On Hold', '6': 'Resolved', '8': 'Canceled' };
    toast = applied ? `Risposta inviata · ${applied.number} aggiornato su ServiceNow: commento aggiunto, stato ${STATES[applied.state]}.` : 'Risposta inviata (nessun ticket aperto collegato).';
    renderOutlook();
    publish();
  }

  // ---- Ciò che l'add-in di jak mette a disposizione (TestPluginAPI), sulla mail selezionata ----
  function messageContext() {
    const message = selectedMessage();
    if (!message) return null;
    return {
      itemId: message.id,
      conversationId: message.conversationId,
      normalizedConversationId: message.conversationId,
      subject: message.subject,
      sender: { displayName: message.from.name, emailAddress: message.from.email },
      to: message.to.map(item => ({ displayName: item.name, emailAddress: item.email })),
      cc: [],
      dateTimeCreated: message.receivedAt,
      bodyText: message.body,
      categories: message.categories.map(name => ({ displayName: name, color: null })),
      attachments: [],
      mailbox: { userDisplayName: OPERATOR.displayName, userEmailAddress: OPERATOR.emailAddress, accountType: 'enterprise', timeZone: 'Europe/Rome' }
    };
  }
  function publish() {
    const snapshot = messageContext();
    listeners.forEach(listener => { try { listener(snapshot); } catch (error) { console.error(error); } });
  }
  window.TestPluginAPI = Object.freeze({
    version: 'anteprima',
    getCurrentMessageContext: messageContext,
    onMessageChanged(listener) { listeners.add(listener); return () => listeners.delete(listener); },
    showMainView() {
      byId('main-view').hidden = false;
      byId('header-view').hidden = true;
      byId('amp-view').hidden = true;
    }
  });
  // Solo anteprima: aprire una mail e la risposta (in Outlook vero: Office.js).
  window.AmpPreviewOutlook = Object.freeze({
    openMessage(messageId) {
      const message = mailbox.getMessage(messageId);
      if (!message) return false;
      select(message.conversationId);
      return true;
    },
    openReply
  });
  // Quando il pannello cambia qualcosa (tag, ticket), la finta Outlook si aggiorna.
  window.AmpBackend.subscribe(renderOutlook);

  // ---- Barra dell'anteprima ----
  byId('preview-seed').addEventListener('click', () => {
    const reference = (value, displayValue) => ({ value, displayValue });
    localStorage.setItem('snow_ticket_assistant_v1', JSON.stringify({
      version: 3, created: new Date().toISOString(), updated: new Date().toISOString(),
      profile: { assignedTo: reference('sys_user_1', 'Marco Rossi') },
      companies: {
        alfa: { name: 'Agenzia Alfa', company: reference('sys_co_1', 'Agenzia Alfa'), assignmentGroup: reference('sys_ag_1', 'Gruppo Alfa'), domains: ['agenziaalfa.it'] },
        beta: { name: 'Agenzia Beta', company: reference('sys_co_2', 'Agenzia Beta'), assignmentGroup: reference('sys_ag_2', 'Gruppo Beta'), domains: ['agenziabeta.it'] },
        gamma: { name: 'Comune Gamma', company: reference('sys_co_3', 'Comune Gamma'), assignmentGroup: reference('', 'Gruppo Gamma'), domains: ['comune-gamma.it'] }
      },
      activities: {
        posta: { name: 'Posta elettronica', category: reference('sys_cat_1', 'Posta elettronica'), impact: '3', urgency: '3', timeWorked: 15, shortDescriptionPrefix: '[FWD]' },
        password: { name: 'Reset password', category: reference('sys_cat_2', 'Account'), impact: '3', urgency: '2', timeWorked: 5, shortDescriptionPrefix: '' },
        stampante: { name: 'Stampante', category: reference('sys_cat_3', 'Hardware'), impact: '3', urgency: '3', timeWorked: 30, shortDescriptionPrefix: '' }
      },
      favorites: [{ company: 'alfa', activity: 'posta' }, { company: 'beta', activity: 'password' }],
      recent: [],
      combinationResponses: {
        'gamma::stampante': { company: 'gamma', activity: 'stampante', response: 'Buongiorno,\n\nil tecnico è intervenuto e la stampante ora funziona correttamente.\n\nCordiali saluti,\nSupporto AMP', updated: '' }
      },
      usefulResponses: {
        attesa: { title: 'Attesa riscontro', response: 'Buongiorno,\n\nrestiamo in attesa di un vostro riscontro.\n\nCordiali saluti,\nSupporto AMP', created: '', updated: '' },
        risolto: { title: 'Problema risolto', response: 'Buongiorno,\n\nil problema è stato risolto. Se dovesse ripresentarsi, rispondete pure a questa mail.\n\nCordiali saluti,\nSupporto AMP', created: '', updated: '' }
      },
      preferences: { favoritesGroupBy: 'none' }
    }));
    location.reload();
  });
  byId('preview-reset-mail').addEventListener('click', () => { mailbox.reset(); location.reload(); });
  byId('preview-reset-config').addEventListener('click', () => {
    Object.keys(localStorage).filter(key => key.startsWith('snow_ticket_assistant')).forEach(key => localStorage.removeItem(key));
    location.reload();
  });

  renderOutlook();
})();
</script>
<script defer src="amp.js"></script>
<script>
  // Nell'anteprima l'area AMP si apre subito.
  window.addEventListener('DOMContentLoaded', () => window.AmpModule?.show());
</script>
</body>
</html>
