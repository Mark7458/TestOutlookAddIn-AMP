<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magus</title>
<style>
/* Magus: vetro scuro del pannello AMP. Token in :root, una regola per tipo di elemento. */
:root {
  color-scheme: dark;
  --bg: #0f1420;
  --glow-a: rgba(70, 120, 220, .32);
  --glow-b: rgba(140, 110, 230, .22);
  --surface: rgba(255, 255, 255, .05);
  --surface-strong: rgba(255, 255, 255, .08);
  --hover: rgba(255, 255, 255, .07);
  --line: rgba(255, 255, 255, .12);
  --line-strong: rgba(255, 255, 255, .22);
  --text: #e8ecf4;
  --muted: #9aa4b8;
  --subtle: #6f7a8f;
  --accent: #7cb4ff;
  --accent-fill: rgba(70, 130, 230, .55);
  --accent-line: rgba(124, 180, 255, .45);
  --selected: rgba(124, 180, 255, .14);
  --working: #e3b65c;
  --danger: #f08a8a;
  --radius: 12px;
  --radius-lg: 16px;
  --blur: blur(18px);
  --font: "Segoe UI", system-ui, sans-serif;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 18px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font: var(--fs-md)/1.45 var(--font); color: var(--text);
  background: radial-gradient(ellipse 620px 460px at 8% 0%, var(--glow-a), transparent 70%), radial-gradient(ellipse 560px 460px at 96% 100%, var(--glow-b), transparent 70%), var(--bg);
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Superfici */
.card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .07); }

/* Pulsanti: pieno (azione principale), contorno, comando di testo */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px;
  background: transparent; font-weight: 500; text-decoration: none; cursor: pointer; transition: background-color .2s, filter .2s; }
.btn:hover { background: var(--hover); }
.btn.primary { border-color: var(--accent-line); background: var(--accent-fill); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.danger { border-color: rgba(240, 138, 138, .4); color: var(--danger); }
.btn.wide { width: 100%; }
.link { display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; border: 0; background: none; color: var(--accent); font-size: var(--fs-sm); font-weight: 500; text-decoration: none; cursor: pointer; }
.link:hover { color: var(--text); }
.icon { flex: none; width: 16px; height: 16px; }

/* Pagina di accesso */
.login { flex: 1; min-height: 100%; display: grid; place-items: center; padding: 16px; }
.login .card { width: min(380px, 100%); padding: 22px; }
.login h1 { margin: 0 0 18px; font-size: 20px; font-weight: 600; }

/* App: barra in alto e colonne */
.app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.topbar { flex: none; display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand { font-size: var(--fs-lg); font-weight: 600; letter-spacing: .2px; }
.tabs { min-width: 0; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: rgba(0, 0, 0, .18); overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { background: var(--surface-strong); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.count { min-width: 18px; color: var(--muted); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .count { color: var(--accent); }
.account { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; color: var(--muted); font-size: var(--fs-sm); }
.avatar { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--selected); color: var(--accent); font-size: var(--fs-xs); font-weight: 600; }
.account .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) minmax(260px, 320px); gap: 12px; }
.column { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.column > .card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; }
.column-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 12px 0; }

/* Selettore della sezione (Attive / Ignorate) */
.segmented { display: flex; flex: 1; padding: 3px; border-radius: 10px; background: rgba(0, 0, 0, .2); }
.segment { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: var(--fs-sm); font-weight: 500; cursor: pointer; }
.segment[aria-pressed="true"] { background: var(--surface-strong); color: var(--text); }

/* Elenco dei thread e dei ticket */
.list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.item { display: grid; gap: 3px; width: 100%; padding: 10px 12px; border: 1px solid transparent; border-radius: var(--radius); background: none; text-align: left; cursor: pointer; }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { border-color: var(--accent-line); background: var(--selected); }
.item-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.item-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
.item-time { flex: none; color: var(--subtle); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.item-meta { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: var(--fs-sm); }
.item-meta > span:first-child { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tag { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text); font-size: var(--fs-xs); font-weight: 500; }
.tag.mine { border-color: var(--accent-line); color: var(--accent); }
.tag.working { border-color: rgba(227, 182, 92, .45); color: var(--working); }
.count-badge { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent-fill); color: #fff; font-size: var(--fs-xs); font-weight: 600; text-align: center; line-height: 20px; }

/* Thread */
.thread-head { flex: none; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.thread-title { margin: 0; font-size: var(--fs-lg); font-weight: 600; text-wrap: balance; }
.thread-sub { margin-top: 2px; color: var(--muted); font-size: var(--fs-sm); }
.messages { display: grid; gap: 10px; }
.message { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255, 255, 255, .035); }
.message.service { background: rgba(124, 180, 255, .06); }
.message-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin-bottom: 6px; color: var(--muted); font-size: var(--fs-sm); }
.message-from { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); font-weight: 500; }
.message-time { margin-left: auto; flex: none; color: var(--subtle); font-size: var(--fs-xs); }
.message-body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
.message-body.loading { color: var(--subtle); }
.attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.attachment { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: var(--fs-xs); }
.thread-body { display: grid; gap: 12px; align-content: start; }
.composer { display: grid; gap: 0; padding: 4px 12px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: rgba(0, 0, 0, .16); }
.compose-field { display: flex; align-items: center; gap: 10px; min-width: 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.compose-field > span { flex: none; width: 56px; color: var(--muted); }
.compose-field input { flex: 1; min-width: 0; height: 36px; border: 0; background: none; color: var(--text); font: inherit; outline-offset: -2px; }
.composer textarea { width: 100%; min-height: 110px; margin-top: 10px; resize: vertical; padding: 10px 0 0; border: 0; background: none; color: var(--text); font: inherit; outline-offset: 2px; }
.composer textarea::placeholder { color: var(--subtle); }
.composer-actions { display: flex; align-items: center; gap: 14px; padding-top: 8px; border-top: 1px solid var(--line); }
.composer-actions .btn { margin-left: auto; }
.group + .group { margin-top: 14px; }
.group-title { display: flex; align-items: center; gap: 8px; margin: 2px 12px 6px; color: var(--muted); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

/* Colonna destra: dettagli e azioni */
.side { display: grid; gap: 14px; align-content: start; padding: 14px; }
.side h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.fields { display: grid; margin: 0; }
.field { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.field dt { color: var(--muted); }
.field dd { margin: 0; min-width: 0; text-align: right; overflow-wrap: anywhere; }
.actions { display: grid; gap: 8px; }
.actions-row { display: flex; gap: 8px; }
.actions-row .btn { flex: 1; }

/* Moduli */
.form { display: grid; gap: 10px; }
.field-input { display: grid; gap: 4px; min-width: 0; color: var(--muted); font-size: var(--fs-sm); }
.field-input :is(input, select, textarea), .search input, .amp-link input { width: 100%; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(0, 0, 0, .18); color: var(--text); font: inherit; font-size: var(--fs-md); }
.field-input textarea { height: auto; min-height: 90px; padding: 8px 10px; resize: vertical; }
.field-input select option { background: #1b2130; }
.hint { margin: 0; color: var(--subtle); font-size: var(--fs-sm); }
.details { border-top: 1px solid var(--line); padding-top: 8px; font-size: var(--fs-sm); }
.details summary { color: var(--accent); font-weight: 500; cursor: pointer; }
.details[open] summary { margin-bottom: 4px; }
.amp-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-top: 8px; }
.tag-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.choices { display: grid; gap: 6px; }
.link.danger { color: var(--danger); }
.btn:disabled, .link:disabled { opacity: .5; cursor: default; filter: none; }
.btn.icon-only { flex: none; width: 36px; padding: 0; }
.column-head.stack { flex-direction: column; align-items: stretch; }
.search-row { display: flex; gap: 8px; }
.search { position: relative; flex: 1; min-width: 0; }
.search .icon { position: absolute; left: 10px; top: 10px; color: var(--subtle); }
.search input { padding-left: 32px; }
.segmented.small .segment { height: 28px; font-size: var(--fs-xs); }
.link.responses { position: relative; }
.link.responses select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* Inoltro: passi con pallino (fatto, in corso, non riuscito, da fare) */
.forward-box { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.step { display: grid; justify-items: center; gap: 4px; color: var(--subtle); font-size: var(--fs-xs); }
.step-dot { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background: none; color: inherit; }
.step-dot .icon { width: 13px; height: 13px; }
.step.ok { color: var(--accent); } .step.ok .step-dot { border-color: var(--accent-line); background: var(--selected); }
.step.run { color: var(--text); }
.step.ko { color: var(--danger); } .step.ko .step-dot { border-color: rgba(240, 138, 138, .5); cursor: pointer; }
.spinner { width: 12px; height: 12px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Pillola dell'esito */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: calc(100% - 32px); padding: 9px 16px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: rgba(22, 28, 42, .92); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 8px 24px rgba(0, 0, 0, .35); color: var(--text); font-size: var(--fs-sm); font-weight: 500; transform: translateX(-50%); }
.toast.success { color: #8fd6b0; } .toast.warning { color: var(--working); } .toast.danger { color: var(--danger); }

/* Tools */
.tools { display: grid; gap: 18px; align-content: start; max-width: 640px; padding: 18px; }
.tool { display: grid; gap: 10px; }
.tool h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.link-actions { display: flex; flex-wrap: wrap; gap: 6px 16px; }

/* Stati vuoti */
.empty { display: grid; place-items: center; gap: 8px; height: 100%; min-height: 160px; padding: 24px; color: var(--subtle); font-size: var(--fs-sm); text-align: center; }
.empty .icon { width: 28px; height: 28px; }
.back { display: none; }
.workspace.single { grid-template-columns: minmax(0, 1fr); }
.workspace.single > .column { display: flex !important; }

/* Larghezze: tre colonne, poi due (dettagli sotto il thread), poi una sola con il ritorno all'elenco */
@media (max-width: 1100px) {
  .workspace { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); }
  .workspace > .column:last-child { display: none; }
  .side-inline { display: grid !important; padding: 0 0 6px; }
}
.side-inline { display: none; }
@media (max-width: 760px) {
  .app { gap: 10px; padding-top: 10px; }
  .brand, .account .name, .tab:not([aria-selected="true"]) .tab-label { display: none; }
  .tab { padding: 0 11px; }
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .workspace.detail-open > .column:first-child, .workspace:not(.detail-open) > .column:nth-child(2) { display: none; }
  .back { display: inline-flex; margin-bottom: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Anteprima: risposte finte delle Function e dell'accesso, nello stesso formato di quelle vere.
(() => {
  const ME = 'utente@esempio.it', BOX = 'servizio@esempio.it';
  const ago = minutes => new Date(Date.now() - minutes * 60000).toISOString();
  const config = { payload: { ticketing: { email: BOX }, forwardingTargets: { ES: { name: 'Email Security', code: 'ES' }, PO: { name: 'Posta', code: 'PO' } }, operators: { 'OP-1': { email: ME, displayName: 'Mario Rossi', tag: 'Rossi' }, 'OP-2': { email: 'luigi.verdi@esempio.it', displayName: 'Luigi Verdi', tag: 'Verdi' } } } };
  const threads = [
    { id: 101, subject: 'Errore accesso casella condivisa', from: 'Anna Bianchi <anna.bianchi@agenzia.it>', at: 22, count: 2, thread: { status: 'Working', assignedTo: ME, statusAt: ago(15) } },
    { id: 102, subject: 'Richiesta licenza Visio', from: 'Paolo Neri <paolo.neri@agenzia.it>', at: 48, count: 1, thread: { status: 'New' } },
    { id: 103, subject: 'Abilitazione Teams per utente esterno', from: 'Sara Gialli <sara.gialli@agenzia.it>', at: 95, count: 3, thread: { status: 'Working', assignedTo: 'luigi.verdi@esempio.it', statusAt: ago(60) } },
    { id: 104, subject: 'Aggiunta membri a lista di distribuzione', from: 'Marco Blu <marco.blu@agenzia.it>', at: 160, count: 1, thread: { status: 'New' } },
    { id: 105, subject: 'Reset MFA', from: 'Elena Viola <elena.viola@agenzia.it>', at: 1500, count: 2, thread: { status: 'New' } }
  ];
  const ignored = [{ id: 201, subject: 'Newsletter servizi cloud', from: 'Notifiche <noreply@fornitore.it>', at: 300, count: 1, thread: { status: 'Ignored', statusBy: 'luigi.verdi@esempio.it', statusAt: ago(280) } }];
  const toItem = t => ({ parentItemId: t.id, conversationId: 'C' + t.id, subject: t.subject, from: t.from, lastReceived: ago(t.at), messageCount: t.count, lastMessage: { messageId: 'M' + t.id + '-' + t.count, from: t.from, subject: t.subject, receivedDate: ago(t.at) }, thread: t.thread });
  const tickets = [
    { id: '11', ticketId: 'SHP-0042', parentItemId: 106, status: 'In Progress', agency: 'DEM', operator: ME, shortDescription: 'Casella condivisa protocollo non visibile', ampReference: 'INC0123456', created: ago(200), elapsedTime: 25 },
    { id: '12', ticketId: 'SHP-0039', parentItemId: 107, status: 'On Hold', agency: 'AG1', operator: ME, shortDescription: 'Migrazione archivio PST', ampReference: 'INC0123311', created: ago(3000), elapsedTime: 90 },
    { id: '13', ticketId: 'SHP-M-7', parentItemId: null, status: 'In Progress', agency: 'AG2', operator: 'luigi.verdi@esempio.it', shortDescription: 'Verifica regole di inoltro', created: ago(500), elapsedTime: 10 }
  ];
  const conversations = {
    101: [['Anna Bianchi <anna.bianchi@agenzia.it>', 22 + 30, 'Buongiorno,\n\nda stamattina non riesco ad aprire la casella condivisa protocollo@agenzia.it da Outlook: compare un errore di autorizzazione.\n\nGrazie\nAnna Bianchi', true], [BOX, 22, 'Salve,\n\nsi prende in carico la richiesta.\n\nSaluti,\nMario Rossi\nService Desk', false]],
    102: [['Paolo Neri <paolo.neri@agenzia.it>', 48, 'Buongiorno,\n\nchiedo l\'assegnazione di una licenza Visio per il collega Luca Rossi.\n\nCordiali saluti\nPaolo Neri', false]],
    103: [['Sara Gialli <sara.gialli@agenzia.it>', 200, 'Buongiorno,\n\nserve abilitare la chat Teams con un consulente esterno.\n\nSara', false], [BOX, 150, 'Salve,\n\nci indica l\'indirizzo del consulente?\n\nSaluti,\nLuigi Verdi', false], ['Sara Gialli <sara.gialli@agenzia.it>', 95, 'È consulente@studio-esterno.it, grazie.', false]],
    104: [['Marco Blu <marco.blu@agenzia.it>', 160, 'Buongiorno,\n\nvanno aggiunti alla lista uffici-roma@agenzia.it i colleghi in allegato.\n\nGrazie', true]],
    105: [['Elena Viola <elena.viola@agenzia.it>', 1560, 'Ho cambiato telefono e non riesco più ad approvare l\'accesso.', false], [BOX, 1500, 'Salve,\n\nprocediamo con il reset del metodo di autenticazione.\n\nSaluti,\nLuigi Verdi', false]],
    106: [['Giorgio Rosa <giorgio.rosa@agenzia.it>', 260, 'La casella protocollo non compare più in Outlook.', false], [BOX, 200, 'Salve,\n\nsi prende in carico la richiesta, riferimento INC0123456.\n\nSaluti,\nMario Rossi', false], ['Giorgio Rosa <giorgio.rosa@agenzia.it>', 30, 'Ora la vedo ma non riesco a inviare per conto della casella.', false]],
    107: [['Chiara Verdi <chiara.verdi@agenzia.it>', 3100, 'Dobbiamo importare un archivio PST di 30 GB nella nuova casella.', true], [BOX, 3000, 'Salve,\n\nattendiamo il caricamento del file nella cartella condivisa.\n\nSaluti,\nMario Rossi', false]],
    201: [['Notifiche <noreply@fornitore.it>', 300, 'Novità del mese sui servizi cloud.', false]]
  };
  const closed = [{ id: '9', ticketId: 'SHP-0031', parentItemId: null, status: 'Resolved', agency: 'DEM', operator: ME, shortDescription: 'Reset password casella protocollo', ampReference: 'INC0122001', created: ago(9000), elapsedTime: 15 }];
  const bodies = {};
  try {
    if (!localStorage.getItem('snow_ticket_assistant_v1')) localStorage.setItem('snow_ticket_assistant_v1', JSON.stringify({
      profile: { assignedTo: { displayValue: 'Mario Rossi', value: 'abc123' } },
      companies: { dem: { name: 'Agenzia del Demanio', domains: ['agenzia.it'], company: { displayValue: 'Agenzia del Demanio', value: 'c1' }, assignmentGroup: { displayValue: 'M365 Service Desk', value: 'g1' } }, ag1: { name: 'Agenzia Uno', domains: ['agenziauno.it'], company: { displayValue: 'Agenzia Uno', value: 'c2' }, assignmentGroup: { displayValue: 'M365 Service Desk', value: 'g1' } } },
      activities: { a1: { name: 'Casella condivisa', category: { displayValue: 'Exchange', value: 'k1' }, impact: '3', urgency: '3', timeWorked: 15 }, a2: { name: 'Licenze', category: { displayValue: 'Licensing', value: 'k2' }, impact: '3', urgency: '3', timeWorked: 10 } },
      usefulResponses: { r1: { title: 'Presa in carico', response: 'si prende in carico la richiesta.' }, r2: { title: 'Richiesta informazioni', response: 'per procedere ci serve il nome completo dell\'utente.' } }
    }));
  } catch {}
  const subjects = Object.fromEntries([...threads, ...ignored].map(t => [t.id, t.subject]).concat([[106, 'Casella protocollo non visibile'], [107, 'Importazione archivio PST']]));
  const messages = id => (conversations[id] || []).map(([from, at, text, attach], index) => {
    const messageId = `M${id}-${index + 1}`;
    const subject = (index ? 'RE: ' : '') + (subjects[id] || '');
    bodies[messageId] = { subject, from, to: [BOX], cc: id === 101 || id === 106 ? ['ufficio.it@agenzia.it'] : [], receivedDate: ago(at), hasAttachments: attach, text, newText: text };

        render();

    // Esegue un'azione: blocca i pulsanti, mostra l'esito; se il thread è cambiato nel frattempo aggiorna tutto.
    async function run(action, done) {
        if (state.busy) return null;
        state.busy = true;
        render();
        try {
            const result = await action();
            if (done) showStatus(typeof done === 'function' ? done(result) : done);
            return result ?? true;
        } catch (error) {
            console.error('[Magus]', error);
            if (CHANGED[error.reason]) {
                showStatus(CHANGED[error.reason], 'warning');
                if (error.reason !== 'not_tagged') reloadAll();
            } else showStatus(error.message || 'Operazione non riuscita', 'danger');
            return null;
        } finally {
            state.busy = false;
            render();
        }
    }

    async function loadLists() {
        try {
            const [active, ignored, tickets] = await Promise.all([Data.queue('active'), Data.queue('ignored'), Data.tickets()]);
            Object.assign(state.lists, { active, ignored, tickets });
            state.error = '';
        } catch (error) {
            state.error = error.message;
        }
        state.loaded = true;
        render();
    }
    function reloadAll() {
        state.threads.clear();
        loadLists().then(() => { const item = selectedItem(); if (item) openThread(item.parentItemId); });
    }
    async function openThread(parentItemId) {
        if (!parentItemId || state.threads.has(parentItemId)) return;
        const thread = { messages: [], bodies: new Map(), loading: true, error: '' };
        state.threads.set(parentItemId, thread);
        try { thread.messages = await Data.messages(parentItemId); }
        catch (error) { thread.error = error.message; }
        thread.loading = false;
        render();
        await Promise.all(thread.messages.map(async message => {
            try { thread.bodies.set(message.id, await Data.body(message.id)); }
            catch (error) { thread.bodies.set(message.id, { error: error.message }); }
            render();
        }));
    }
    function select(item) {
        state.selected = item.key;
        state.panel = null;
        state.armed = null;
        render();
        openThread(item.parentItemId);
    }
    function closeSelected() {
        state.selected = null;
        state.panel = null;
        render();
    }

    // ------------------------------------------------------------------
    // Azioni
    // ------------------------------------------------------------------
    // Tag: tuo → lo togli; di un collega → secondo clic per subentrare; nessuno → lo metti.
    async function toggleTag(item) {
        const mine = item.status === 'Working' && isMe(item.assignedTo);
        const other = item.assignedTo && !mine && ['Working', 'Ignored'].includes(item.status);
        if (other && state.armed !== item.key) { state.armed = item.key; render(); return; }
        state.armed = null;
        const done = await run(() => Data.thread(item, mine ? 'untag' : 'tag', other ? { force: true } : {}), mine ? 'Tag tolto' : 'Tag messo');
        if (done) await loadLists();
    }
    // Presa in carico, inoltro e ignora vogliono il proprio tag: se manca si mette prima.
    async function ensureTag(item) {
        if (item.status === 'Working' && isMe(item.assignedTo)) return;
        if (item.assignedTo && !isMe(item.assignedTo)) {
            const error = new Error(CHANGED.tagged_by_other);
            error.reason = 'not_tagged';
            throw error;
        }
        await Data.thread(item, 'tag');
    }

    // Presa in carico: Agenzia (suggerita dal dominio del mittente), Attività, Short description; i Dettagli mostrano
    // i campi del ticket e il link di AMP già compilato.
    function suggestCompany(from, subject) {
        const domain = String(from?.email || '').split('@')[1]?.toLowerCase() || '';
        const companies = Object.entries(state.settings.companies);
        const byDomain = domain && companies.find(([, company]) => company.domains.some(item => domain === item || domain.endsWith(`.${item}`)));
        if (byDomain) return byDomain[0];
        const text = String(subject || '').toLowerCase();
        return companies.find(([, company]) => company.name && text.includes(company.name.toLowerCase()))?.[0] || '';
    }
    function takeDraft(item) {
        const key = `take:${item?.key || 'new'}`;
        if (!state.forms.has(key)) {
            const thread = item && state.threads.get(item.parentItemId);
            const first = thread?.messages?.[0];
            state.forms.set(key, {
                companyId: item ? suggestCompany(item.from, item.subject) : '',
                activityId: '',
                subject: item ? cleanSubject(item.subject) : '',
                description: first ? thread.bodies.get(first.id)?.text || '' : '',
                detailsOpen: false
            });
        }
        return state.forms.get(key);
    }
    const SEVERITY = { '1': '1 - High', '2': '2 - Medium', '3': '3 - Low' };
    const AMP_LINK_MAX = 6000;
    function ticketFields(draft) {
        const company = state.settings.companies[draft.companyId];
        const activity = state.settings.activities[draft.activityId];
        if (!company || !activity) return null;
        const prefix = activity.shortDescriptionPrefix || '';
        return {
            company: reference(company.company),
            assignmentGroup: reference(company.assignmentGroup),
            assignedTo: state.settings.profile.assignedTo,
            category: reference(activity.category),
            impact: activity.impact,
            urgency: activity.urgency,
            minutes: Number(activity.timeWorked) || 0,
            shortDescription: prefix ? `${prefix} ${draft.subject.replace(/^\s*\[[^\]]+\]\s*/, '')}`.trim() : draft.subject.trim(),
            description: String(draft.description || '').slice(0, 4000)
        };
    }
    // Nuovo incident su AMP con i campi già compilati ("^" separa i campi: nel testo si raddoppia).
    function ampLink(fields) {
        const value = text => String(text ?? '').replace(/\^/g, '^^');
        const worked = fields.minutes ? `1970-01-01 ${pad(Math.floor(fields.minutes / 60))}:${pad(fields.minutes % 60)}:00` : '';
        const pairs = [
            ['company', fields.company.value], ['assignment_group', fields.assignmentGroup.value], ['assigned_to', fields.assignedTo.value],
            ['x_avana_platform_category_value', fields.category.value], ['impact', fields.impact], ['urgency', fields.urgency],
            ['short_description', fields.shortDescription], ['time_worked', worked]
        ].filter(([, text]) => text);
        const base = `https://amp.service-now.com/incident.do?sys_id=-1&sysparm_query=${encodeURIComponent(pairs.map(([name, text]) => `${name}=${value(text)}`).join('^'))}`;
        const description = text => (text ? encodeURIComponent(`^description=${value(text)}`) : '');
        let text = fields.description;
        while (text && (base + description(text)).length > AMP_LINK_MAX) text = text.slice(0, Math.floor(text.length * .8));
        return base + description(text);
    }
    async function takeCharge(item) {
        const draft = takeDraft(item);
        const fields = ticketFields(draft);
        if (!fields) return showStatus('Scegli agenzia e attività', 'danger');
        const company = state.settings.companies[draft.companyId];
        const thread = item && state.threads.get(item.parentItemId);
        const ticket = await run(async () => {
            if (item) {
                await ensureTag(item);
                await Data.thread({ ...item, messageCount: thread?.messages?.length || item.messageCount }, 'acquire');
            }
            return Data.createTicket(item ? { ...item, messageId: thread?.messages?.[0]?.id } : null,
                { agency: company.name, shortDescription: fields.shortDescription, description: fields.description, minutes: fields.minutes });
        }, created => `Ticket ${created.number} aperto`);
        if (!ticket) return;
        state.forms.delete(`take:${item?.key || 'new'}`);
        state.panel = null;
        await loadLists();
        state.selected = ticket.key;
        render();
        openThread(ticket.parentItemId);
    }
    async function ignoreThread(item) {
        const done = await run(async () => { await ensureTag(item); await Data.thread(item, 'ignore'); }, 'Ignorata');
        if (done) { closeSelected(); await loadLists(); }
    }
    async function restoreThread(item) {
        const done = await run(() => Data.thread(item, 'restore'), 'Rimessa in coda');
        if (done) { closeSelected(); await loadLists(); }
    }

    // Inoltro in quattro passi: ticket, risposta con la sigla del gruppo, inoltro, chiusura del ticket. Al primo passo
    // che non riesce si ferma; il ticket resta tra gli aperti con la striscia dei passi e si riprende da lì.
    const FORWARD_STEPS = [['ticket', 'Ticket'], ['reply', 'Risposta'], ['forward', 'Inoltro'], ['close', 'Chiusura']];
    const FORWARD_ACTIONS = {
        ticket: async job => {
            await ensureTag(job.item);
            job.ticket = await Data.createTicket({ ...job.item, messageId: job.messageId },
                { agency: '', shortDescription: cleanSubject(job.item.subject), description: job.description, minutes: 0, forwardGroup: job.group.name || job.group.tag });
        },
        reply: job => Data.reply(job.item.parentItemId, { tag: job.group.tag, reference: job.ticket.ampReference || job.ticket.number, ticketId: job.ticket.number }),
        forward: job => Data.forward(job.item, job.group),
        close: async job => { job.ticket = await Data.updateTicket(job.ticket, 'resolve', `Inoltrato a ${job.group.tag}`); }
    };
    async function runForward(job, from) {
        for (let index = from; index < FORWARD_STEPS.length; index += 1) {
            job.steps[index] = 'run';
            render();
            try {
                await FORWARD_ACTIONS[FORWARD_STEPS[index][0]](job);
                job.steps[index] = 'ok';
            } catch (error) {
                console.error('[Magus]', error);
                job.steps[index] = 'ko';
                job.error = error;
                render();
                return false;
            }
        }
        render();
        return true;
    }
    async function forwardThread(item, group) {
        const thread = state.threads.get(item.parentItemId);
        const first = thread?.messages?.[0];
        const job = { item, group, messageId: first?.id, description: first ? thread.bodies.get(first.id)?.text || '' : '', ticket: null, steps: FORWARD_STEPS.map(() => 'wait') };
        state.panel = { type: 'forwarding', job };
        state.busy = true;
        const ok = await runForward(job, 0);
        state.busy = false;
        if (!job.ticket) {
            state.panel = null;
            if (CHANGED[job.error?.reason]) { showStatus(CHANGED[job.error.reason], 'warning'); reloadAll(); }
            else showStatus('Inoltro non riuscito', 'danger');
            return;
        }
        if (ok) {
            state.panel = null;
            showStatus(`Inoltrata a ${group.tag}`);
            closeSelected();
        } else {
            state.forwardJobs.set(job.ticket.number, job);
            const stuck = FORWARD_STEPS[job.steps.indexOf('ko')][1];
            showStatus(`Bloccato su ${stuck}`, 'warning');
            state.selected = job.ticket.key;
            state.panel = null;
        }
        await loadLists();
    }
    // Inoltro fermo a metà su un ticket: i passi si ricavano dal ticket se la pagina non l'ha seguito.
    function forwardJobFor(ticket) {
        if (!ticket.forwardGroup || !OPEN_TICKET_STATUSES.includes(ticket.status)) return null;
        if (!state.forwardJobs.has(ticket.number)) {
            const group = forwardGroups().find(entry => [entry.name, entry.id, entry.tag].includes(ticket.forwardGroup));
            if (!group) return null;
            state.forwardJobs.set(ticket.number, {
                item: { parentItemId: ticket.parentItemId, subject: ticket.subject }, group, ticket,
                steps: ['ok', ticket.repliedAt ? 'ok' : 'ko', ticket.repliedAt ? 'ko' : 'wait', 'wait']
            });
        }
        return state.forwardJobs.get(ticket.number);
    }
    async function resumeForward(job, index) {
        if (state.busy) return;
        state.busy = true;
        const ok = await runForward(job, index);
        state.busy = false;
        if (ok) {
            state.forwardJobs.delete(job.ticket.number);
            showStatus(`Inoltrata a ${job.group.tag}`);
            closeSelected();
        }
        await loadLists();
    }

    // Aggiornamento del ticket: commento, risoluzione, attesa, annullamento; minuti da aggiungere al tempo lavorato.
    const UPDATE_TYPES = [['comment', 'Aggiorna'], ['resolve', 'Risolvi'], ['hold', 'In attesa'], ['cancel', 'Annulla']];
    async function updateTicket(ticket) {
        const draft = state.forms.get(`update:${ticket.number}`) || { type: 'comment', text: '', minutes: '' };
        if (!draft.text.trim() && draft.type === 'comment' && !Number(draft.minutes)) return showStatus('Scrivi il commento', 'danger');
        const label = { comment: 'Ticket aggiornato', resolve: 'Ticket risolto', hold: 'Ticket in attesa', cancel: 'Ticket annullato' }[draft.type];
        const done = await run(() => Data.updateTicket(ticket, draft.type, draft.text.trim(), draft.minutes), label);
        if (!done) return;
        state.forms.delete(`update:${ticket.number}`);
        state.panel = null;
        if (draft.type === 'resolve' || draft.type === 'cancel') closeSelected();
        await loadLists();
    }

    // Risposta a tutti con i destinatari e l'oggetto scelti.
    async function sendReply(item, thread) {
        const draft = draftFor(item, thread);
        if (!draft.text.trim()) return showStatus('Scrivi la risposta', 'danger');
        if (!addresses(draft.to).length) return showStatus('Manca il destinatario', 'danger');
        const ticket = item.key.startsWith('ticket:') ? item : null;
        const done = await run(() => Data.reply(item.parentItemId, {
            text: draft.text.trim(), to: addresses(draft.to), cc: addresses(draft.cc), bcc: addresses(draft.bcc), subject: draft.subject,
            ...(ticket ? { ticketId: ticket.number, reference: ticket.ampReference || ticket.number } : {})
        }), 'Risposta inviata');
        if (!done) return;
        state.drafts.delete(item.parentItemId);
        state.threads.delete(item.parentItemId);
        openThread(item.parentItemId);
    }

    async function search(text) {
        state.search = text;
        if (!text.trim()) { state.found = null; render(); return; }
        const found = await run(() => Data.searchTickets(text.trim()));
        state.found = found || [];
        render();
    }

    // Una vista sola: i ticket aperti e, sotto, i thread in coda; le ignorate a parte. La ricerca filtra quello che
    // c'è e, con Invio, cerca anche tra tutti i ticket.
    function listColumn() {

                h('button', { type: 'button', class: 'btn icon-only', title: 'Nuovo ticket', 'aria-label': 'Nuovo ticket', onclick: () => { state.selected = 'new'; state.panel = null; render(); } }, icon(ICONS.plus))));
        const body = !state.loaded ? empty('queue', 'Caricamento…')

    function message(item, thread) {
        const body = thread.bodies.get(item.id);
        const service = sameEmail(item.from.email, serviceMailbox());
        return h('article', { class: `message${service ? ' service' : ''}` },

            !body ? h('p', { class: 'message-body loading' }, 'Caricamento…')
                : body.error ? h('p', { class: 'message-body loading' }, body.error)
                    : h('p', { class: 'message-body' }, body.text),
            item.hasAttachment || body?.hasAttachments
                ? h('div', { class: 'attachments' }, h('span', { class: 'attachment' }, icon(ICONS.attach), 'Allegati'))

    // Risposta a tutti precompilata dall'ultima mail arrivata (non della casella del servizio): A = chi l'ha scritta,
    // Cc = gli altri destinatari, Oggetto = RE: della mail. Tutto modificabile; Ccn su richiesta.
    function draftFor(item, thread) {
        const id = item.parentItemId;
        if (state.drafts.has(id)) return state.drafts.get(id);
        const service = serviceMailbox();
        const last = [...thread.messages].reverse().find(entry => !sameEmail(entry.from.email, service)) || thread.messages[thread.messages.length - 1];
        const body = last && thread.bodies.get(last.id);
        const to = last?.from.email || '';
        const cc = [...(body?.to || []), ...(body?.cc || [])].filter(address => address && !sameEmail(address, service) && !sameEmail(address, to));
        const subject = last?.subject || item.subject || '';
        return { to, cc: [...new Set(cc)].join('; '), bcc: '', subject: /^re:/i.test(subject) ? subject : `RE: ${subject}`, text: '', bccOpen: false };
    }
    function composer(item, thread) {
        const id = item.parentItemId;
        const draft = draftFor(item, thread);
        const change = (key, value) => { state.drafts.set(id, { ...draftFor(item, thread), [key]: value }); };
        const responses = Object.entries(state.settings.usefulResponses).sort(([, a], [, b]) => String(a.title).localeCompare(String(b.title), 'it'));
        const field = (key, label) => h('label', { class: 'compose-field' },
            h('span', {}, label),
            h('input', { id: `reply-${key}-${id}`, value: draft[key], autocomplete: 'off', oninput: event => change(key, event.target.value) }),
            key === 'cc' && !draft.bccOpen ? h('button', { type: 'button', class: 'link', onclick: () => { change('bccOpen', true); render(); document.getElementById(`reply-bcc-${id}`)?.focus(); } }, 'Ccn') : null);
        return h('div', { class: 'composer' },
            field('to', 'A'),
            field('cc', 'Cc'),
            draft.bccOpen ? field('bcc', 'Ccn') : null,
            field('subject', 'Oggetto'),
            h('textarea', { id: `reply-text-${id}`, placeholder: 'Rispondi a tutti', 'aria-label': 'Testo della risposta', oninput: event => change('text', event.target.value) }, draft.text),
            h('div', { class: 'composer-actions' },
                responses.length ? h('label', { class: 'link responses' }, icon(ICONS.responses), 'Risposte',
                    h('select', { 'aria-label': 'Risposte utili', onchange: event => { const chosen = state.settings.usefulResponses[event.target.value]; if (chosen) { change('text', chosen.response || ''); render(); } } },
                        h('option', { value: '' }, ''), responses.map(([key, entry]) => h('option', { value: key }, entry.title)))) : null,
                button('Invia', () => sendReply(item, thread), { kind: 'primary', iconName: 'send' })));
    }
    function threadColumn(item) {
        if (state.selected === 'new') return newTicketColumn();
        if (!item) return h('section', { class: 'column', 'aria-label': 'Thread' }, h('div', { class: 'card' }, empty('mail', 'Scegli un thread')));
        const thread = state.threads.get(item.parentItemId);
        const ready = thread && !thread.loading && !thread.error;
        const content = !item.parentItemId ? empty('mail', 'Ticket senza mail')
            : !thread || thread.loading ? empty('mail', 'Caricamento…')
                : thread.error ? empty('mail', thread.error)
                    : h('div', { class: 'messages' }, [...thread.messages].reverse().map(entry => message(entry, thread)));
        return h('section', { class: 'column', 'aria-label': 'Thread' },
            h('div', { class: 'card' },
                h('div', { class: 'thread-head' },
                    h('button', { type: 'button', class: 'link back', onclick: closeSelected }, icon(ICONS.back), 'Elenco'),
                    h('h1', { class: 'thread-title' }, item.subject),
                    h('div', { class: 'thread-sub' }, thread?.messages?.length ? `${thread.messages.length} mail` : '')),
                h('div', { class: 'scroll thread-body', 'data-scroll': `thread:${item.key}` },
                    h('div', { class: 'side side-inline' }, sideContent(item)),
                    ready && item.section !== 'ignored' ? composer(item, thread) : null,
                    content)));
    }

    // Ticket senza mail: lo stesso modulo della presa in carico, con la descrizione scritta a mano.
    function newTicketColumn() {
        const draft = takeDraft(null);
        return h('section', { class: 'column', 'aria-label': 'Nuovo ticket' },
            h('div', { class: 'card' },
                h('div', { class: 'thread-head' },
                    h('button', { type: 'button', class: 'link back', onclick: closeSelected }, icon(ICONS.back), 'Elenco'),
                    h('h1', { class: 'thread-title' }, 'Nuovo ticket')),
                h('div', { class: 'scroll side' },
                    takeForm(null),
                    input('Descrizione', draft.description, value => { draft.description = value; }, { multiline: true, id: 'new-description' }),
                    h('div', { class: 'actions-row' }, button('Annulla', closeSelected), button('Crea ticket', () => takeCharge(null), { kind: 'primary', iconName: 'check' })))));
    }

    function fields(rows) {
        return h('dl', { class: 'fields' }, rows.filter(([, value]) => value).map(([label, value]) => h('div', { class: 'field' }, h('dt', {}, label), h('dd', {}, value))));
    }
    function takeForm(item) {
        const draft = takeDraft(item);
        const companies = Object.entries(state.settings.companies).sort(byName);
        const activities = Object.entries(state.settings.activities).sort(byName);
        const details = ticketFields(draft);
        return h('div', { class: 'form' },
            companies.length && activities.length ? null : h('p', { class: 'hint' }, 'Importa le configurazioni in Tools'),
            dropdown('Agenzia', [['', 'Scegli'], ...companies.map(([id, company]) => [id, company.name])], draft.companyId, value => { draft.companyId = value; render(); }),
            dropdown('Attività', [['', 'Scegli'], ...activities.map(([id, activity]) => [id, activity.name])], draft.activityId, value => { draft.activityId = value; render(); }),
            input('Short description', draft.subject, value => { draft.subject = value; }, { id: `take-subject-${item?.key || 'new'}` }),
            details ? h('details', { class: 'details', open: draft.detailsOpen, ontoggle: event => { draft.detailsOpen = event.target.open; } },
                h('summary', {}, 'Dettagli'),
                fields([
                    ['Company', details.company.displayValue],
                    ['Gruppo', details.assignmentGroup.displayValue],
                    ['Assegnato a', details.assignedTo.displayValue],
                    ['Categoria', details.category.displayValue],
                    ['Impatto / Urgenza', `${SEVERITY[details.impact] || '?'} / ${SEVERITY[details.urgency] || '?'}`],
                    ['Tempo lavorato', `${details.minutes} min`]
                ]),
                h('div', { class: 'amp-link' },
                    h('input', { value: ampLink(details), readonly: true, 'aria-label': 'Link di AMP', onfocus: event => event.target.select() }),
                    link('Copia', async () => {
                        try { await navigator.clipboard.writeText(ampLink(details)); showStatus('Link copiato'); }
                        catch { showStatus('Copia non riuscita', 'danger'); }
                    }, 'copy'))) : null);
    }
    function forwardStrip(job, retry) {
        return h('div', { class: 'steps', role: 'list' }, FORWARD_STEPS.map(([, label], index) => {
            const status = job.steps[index];
            const mark = status === 'ok' ? icon(ICONS.check) : status === 'ko' ? icon(ICONS.close) : status === 'run' ? h('span', { class: 'spinner' }) : null;
            const dot = status === 'ko' && retry
                ? h('button', { type: 'button', class: 'step-dot', title: `Riprova: ${label}`, 'aria-label': `Riprova: ${label}`, onclick: () => retry(index) }, mark)
                : h('span', { class: 'step-dot' }, mark);
            return h('div', { class: `step ${status}`, role: 'listitem' }, dot, h('span', { class: 'step-label' }, label));
        }));
    }

    function threadSide(item) {
        const mine = item.status === 'Working' && isMe(item.assignedTo);
        const tagged = ['Working', 'Ignored'].includes(item.status) && item.assignedTo;
        const tagRow = h('div', { class: 'tag-row' },
            tagged ? h('span', { class: `tag${mine ? ' mine' : ''}` }, operatorName(item.assignedTo)) : h('span', { class: 'hint' }, 'Nessun tag'),
            link(mine ? 'Togli' : tagged ? (state.armed === item.key ? 'Clic di nuovo per conferma' : 'Subentra') : 'Metti il tag', () => toggleTag(item), 'tag'));
        const info = fields([
            ['Stato', item.status === 'Working' ? 'In coda' : THREAD_STATUS[item.status] || item.status],
            ['Ignorata da', item.status === 'Ignored' ? operatorName(item.statusBy) : ''],
            ['Mail', String(item.messageCount || '')],
            ['Ultima', fullWhen(item.receivedAt)]
        ]);
        if (item.section === 'ignored') {
            return [h('h2', {}, 'Ignorata'), tagRow, info, h('div', { class: 'actions' }, button('Rimetti in coda', () => restoreThread(item), { kind: 'primary', iconName: 'restore', wide: true }))];
        }
        if (state.panel?.type === 'forwarding') return [h('h2', {}, `Inoltro a ${state.panel.job.group.tag}`), forwardStrip(state.panel.job)];
        if (state.panel === 'take') {
            return [h('h2', {}, 'Presa in carico'), takeForm(item),
                h('div', { class: 'actions-row' }, button('Annulla', () => { state.panel = null; render(); }), button('Crea ticket', () => takeCharge(item), { kind: 'primary', iconName: 'check' }))];
        }
        if (state.panel === 'forward') {
            const groups = forwardGroups();
            return [h('h2', {}, 'Inoltra a'),
                groups.length ? h('div', { class: 'choices' }, groups.map(group => button(group.name ? `${group.tag} · ${group.name}` : group.tag, () => forwardThread(item, group), { wide: true }))) : h('p', { class: 'hint' }, 'Nessun gruppo nella config'),
                h('div', { class: 'actions-row' }, button('Annulla', () => { state.panel = null; render(); }))];
        }
        return [h('h2', {}, 'Thread'), tagRow, info,
            h('div', { class: 'actions' },
                button('Prendi in carico', () => { state.panel = 'take'; render(); }, { kind: 'primary', iconName: 'take', wide: true }),
                h('div', { class: 'actions-row' },
                    button('Inoltra', () => { state.panel = 'forward'; render(); }, { iconName: 'forward' }),
                    button('Ignora', () => ignoreThread(item), { kind: 'danger', iconName: 'ignore' })))];
    }
    function ticketSide(item) {
        const job = forwardJobFor(item);
        const draft = state.forms.get(`update:${item.number}`) || { type: 'comment', text: '', minutes: '' };
        const keep = () => state.forms.set(`update:${item.number}`, draft);
        const parts = [h('h2', {}, item.number),
            fields([
                ['Stato', TICKET_STATUS[item.status] || item.status],
                ['Agenzia', item.agency],
                ['Operatore', operatorName(item.operator)],
                ['AMP', item.ampReference],
                ['Inoltrato a', item.forwardGroup],
                ['Aperto', fullWhen(item.openedAt)],
                ['Tempo lavorato', item.minutes ? `${item.minutes} min` : '']
            ])];
        if (item.found && !OPEN_TICKET_STATUSES.includes(item.status)) return parts;
        if (job) parts.push(h('div', { class: 'forward-box' }, h('span', { class: 'hint' }, `Inoltro a ${job.group.tag}`), forwardStrip(job, index => resumeForward(job, index))));
        parts.push(h('div', { class: 'form' },
            h('div', { class: 'segmented small', role: 'group', 'aria-label': 'Azione' },
                UPDATE_TYPES.map(([type, label]) => h('button', { type: 'button', class: 'segment', 'aria-pressed': String(draft.type === type), onclick: () => { draft.type = type; keep(); render(); } }, label))),
            input(draft.type === 'resolve' || draft.type === 'cancel' ? 'Note di risoluzione' : 'Commento', draft.text, value => { draft.text = value; keep(); }, { multiline: true, id: `update-text-${item.number}` }),
            input('Minuti da aggiungere', draft.minutes, value => { draft.minutes = value; keep(); }, { type: 'number', min: '0', id: `update-minutes-${item.number}` }),
            button(UPDATE_TYPES.find(([type]) => type === draft.type)[1], () => updateTicket(item), { kind: draft.type === 'cancel' ? 'danger' : 'primary', wide: true })));
        return parts;
    }
    function sideContent(item) {
        return item.key.startsWith('ticket:') ? ticketSide(item) : threadSide(item);
    }
    function sideColumn(item) {
        return h('aside', { class: 'column', 'aria-label': 'Dettagli' },
            h('div', { class: 'card' }, item ? h('div', { class: 'scroll side', 'data-scroll': `side:${item.key}` }, sideContent(item)) : empty('ticket', '')));
    }

    // Tools: profilo (assegnatario di ServiceNow), configurazioni (importa / esporta il JSON del pannello), aggiornamento.
    function toolsView() {
        const profile = state.settings.profile.assignedTo;
        const counts = `${Object.keys(state.settings.companies).length} agenzie · ${Object.keys(state.settings.activities).length} attività · ${Object.keys(state.settings.usefulResponses).length} risposte`;
        const importFile = h('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: async event => {
            const file = event.target.files?.[0];
            if (!file) return;
            try {
                state.settings = normalizeSettings(JSON.parse(await file.text()));
                saveSettings(state.settings);
                showStatus('Configurazioni importate');
            } catch { showStatus('File non valido', 'danger'); }
        } });
        const exportLink = () => {
            const blob = new Blob([JSON.stringify(state.settings, null, 2)], { type: 'application/json' });
            const anchor = h('a', { href: URL.createObjectURL(blob), download: 'magus-configurazioni.json' });
            anchor.click();
            setTimeout(() => URL.revokeObjectURL(anchor.href), 1000);
        };
        return h('main', { class: 'workspace single' }, h('section', { class: 'column' }, h('div', { class: 'card' }, h('div', { class: 'scroll tools' },
            h('section', { class: 'tool' },
                h('h2', {}, 'Profilo'),
                input('Assegnato a (nome su AMP)', profile.displayValue, value => { profile.displayValue = value; saveSettings(state.settings); }, { id: 'profile-name' }),
                input('sys_id su AMP', profile.value, value => { profile.value = value; saveSettings(state.settings); }, { id: 'profile-sysid' })),
            h('section', { class: 'tool' },
                h('h2', {}, 'Configurazioni'),
                h('p', { class: 'hint' }, counts),
                h('div', { class: 'link-actions' }, importFile,
                    link('Importa JSON', () => importFile.click(), 'import'),
                    link('Esporta JSON', exportLink, 'export'))),
            h('section', { class: 'tool' },
                h('h2', {}, 'Elenchi'),
                h('div', { class: 'link-actions' }, link('Aggiorna adesso', () => reloadAll(), 'refresh')))))));
    }

    function workspace() {
        if (state.tab === 'tools') return toolsView();
        if (state.tab === 'utility') return h('main', { class: 'workspace single' }, h('section', { class: 'column' }, h('div', { class: 'card' }, empty('utility', 'Utility'))));
        const item = selectedItem();
        return h('main', { class: `workspace${item || state.selected === 'new' ? ' detail-open' : ''}` }, listColumn(), threadColumn(item), sideColumn(item));
    }
    function toast() {
        return state.toast ? h('div', { class: `toast ${state.toast.tone}`, role: 'status' }, state.toast.text) : null;
    }

    // Ridisegna tutto tenendo la posizione degli elenchi e il campo attivo.
    function render() {
        if (!state.user) return;
        const scrolls = new Map([...root.querySelectorAll('[data-scroll]')].map(node => [node.dataset.scroll, node.scrollTop]));
        const active = document.activeElement;
        const focus = active?.id ? { id: active.id, start: active.selectionStart, end: active.selectionEnd } : null;
        root.replaceChildren(topbar(), workspace(), toast() || '');
        root.querySelectorAll('[data-scroll]').forEach(node => { if (scrolls.has(node.dataset.scroll)) node.scrollTop = scrolls.get(node.dataset.scroll); });
        const field = focus && document.getElementById(focus.id);
        if (field) {
            field.focus();
            try { if (typeof focus.start === 'number') field.setSelectionRange(focus.start, focus.end); } catch { /* campo senza selezione */ }
        }
    }

    // Chi non è entrato vede solo Accedi (login Microsoft con reindirizzamento, poi si torna qui).
    function loginScreen() {
        return h('main', { class: 'login' },
            h('div', { class: 'card' },
                h('h1', {}, 'Magus'),
                h('button', { type: 'button', class: 'btn primary wide', onclick: () => window.MagusAuth.login() },
                    icon('<path d="M12 4h3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 15 16h-3M7.5 13.5 11 10 7.5 6.5M11 10H3.5"/>'), 'Accedi con Microsoft')));
    }

    // Aggiornamento degli elenchi: ogni config.refresh.listsSeconds (60 s) e quando la pagina torna in primo piano.
    function scheduleRefresh() {
        const seconds = Math.min(900, Math.max(15, Number(state.config.refresh?.listsSeconds) || 60));
        setInterval(() => { if (document.visibilityState === 'visible' && !state.busy) loadLists(); }, seconds * 1000);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !state.busy) loadLists(); });
    }

    (async () => {
        state.user = await Data.session();
        if (!state.user) { root.replaceChildren(loginScreen()); return; }
        render();
        try { state.config = await Data.config(); } catch { state.config = {}; }
        await loadLists();
        scheduleRefresh();
    })();
})();

</script>
</body>
</html>
