<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magus</title>
<style>
/* Magus: tema e stile del pannello AMP (Impostazioni → Profilo → Aspetto). Vetro scuro in :root; data-mode (light/dark)
   e data-style (glass/flat) su <html> ridefiniscono solo i token. Gli elementi usano solo i token. */
:root {
  /* Pulsanti pieni come nel pannello (vetro scuro: zaffiro scurito, vetro colorato) */
  --btn-fill: color-mix(in srgb, color-mix(in srgb, #0f5fbf 82%, #000) 86%, transparent);
  --btn-line: rgba(255, 255, 255, .14);
  --btn-highlight: 0 0 transparent;
  --btn-hover: brightness(1.08);
  color-scheme: dark;
  --bg: #0f1420;
  --glow-a: rgba(70, 120, 220, .32);
  --glow-b: rgba(140, 110, 230, .22);
  --surface: rgba(255, 255, 255, .05);
  --surface-strong: rgba(255, 255, 255, .08);
  --hover: rgba(255, 255, 255, .07);
  --line: rgba(255, 255, 255, .12);
  --line-strong: rgba(255, 255, 255, .22);
  --text: #e8ecf4;
  --muted: #9aa4b8;
  --subtle: #6f7a8f;
  --accent: #7cb4ff;
  --accent-fill: rgba(70, 130, 230, .55);
  --accent-line: rgba(124, 180, 255, .45);
  --selected: rgba(124, 180, 255, .14);
  --working: #e3b65c;
  --danger: #f08a8a;
  --success: #8fd6b0;
  --track: rgba(0, 0, 0, .2); /* fondo di schede e selettori */
  --field-bg: rgba(0, 0, 0, .18);
  --option-bg: #1b2130;
  --menu-bg: rgba(24, 30, 44, .94);
  --toast-bg: rgba(22, 28, 42, .92);
  --message-bg: rgba(255, 255, 255, .035);
  --message-service-bg: rgba(124, 180, 255, .06);
  --panel-bg: rgba(255, 255, 255, .03);
  --card-shadow: 0 10px 30px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .07);
  --thumb-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 1px 3px rgba(0, 0, 0, .25);
  --menu-shadow: 0 12px 32px rgba(0, 0, 0, .45);
  --highlight: inset 0 1px 0 rgba(255, 255, 255, .18);
  --radius: 12px;
  --radius-lg: 16px;
  --blur: blur(18px);
  --font: "Segoe UI", system-ui, sans-serif;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 18px;
  --motion: .44s cubic-bezier(.32, 1.12, .5, 1); /* scivola con un leggero rimbalzo finale, come iOS */
  --ease: cubic-bezier(.3, .8, .2, 1);
  --glow-rest: 0 0 12px rgba(80, 150, 255, .28), 0 0 3px rgba(80, 150, 255, .14);
  --glow-hover: 0 0 24px rgba(80, 150, 255, .66), 0 0 6px rgba(80, 150, 255, .38);
  --glow-left: -7px 0 22px rgba(80, 150, 255, .62), 0 0 6px rgba(80, 150, 255, .36);
  --glow-right: 7px 0 22px rgba(80, 150, 255, .62), 0 0 6px rgba(80, 150, 255, .36);
  --label: #0078d4; /* colore della propria etichetta (Profilo) */
}
/* Vetro chiaro */
:root[data-mode="light"] {
  --btn-fill: color-mix(in srgb, #0f5fbf 86%, transparent);
  --btn-line: rgba(255, 255, 255, .22);
  --btn-highlight: inset 0 1px 0 rgba(255, 255, 255, .22);
  color-scheme: light;
  --bg: #e9f1fb;
  --glow-a: rgba(121, 184, 255, .45);
  --glow-b: rgba(185, 168, 245, .32);
  --surface: rgba(255, 255, 255, .72);
  --surface-strong: rgba(255, 255, 255, .96);
  --hover: rgba(255, 255, 255, .9);
  --line: rgba(0, 40, 90, .1);
  --line-strong: rgba(0, 0, 0, .16);
  --text: #242424;
  --muted: #605e5c;
  --subtle: #8a8886;
  --accent: #106ebe;
  --accent-fill: rgba(15, 95, 191, .86);
  --accent-line: rgba(0, 90, 180, .35);
  --selected: rgba(0, 120, 212, .1);
  --working: #8a5a00;
  --danger: #a4262c;
  --success: #107c10;
  --track: rgba(214, 224, 240, .6);
  --field-bg: rgba(255, 255, 255, .7);
  --option-bg: #fff;
  --menu-bg: rgba(251, 252, 254, .96);
  --toast-bg: rgba(255, 255, 255, .94);
  --message-bg: rgba(255, 255, 255, .55);
  --message-service-bg: rgba(0, 120, 212, .07);
  --panel-bg: rgba(255, 255, 255, .5);
  --card-shadow: 0 6px 20px rgba(30, 60, 110, .08), inset 0 1px 0 rgba(255, 255, 255, .6);
  --thumb-shadow: 0 1px 3px rgba(0, 0, 0, .1);
  --menu-shadow: 0 12px 32px rgba(30, 60, 110, .18);
  --highlight: inset 0 1px 0 rgba(255, 255, 255, .22);
  --blur: blur(14px) saturate(1.2);
}
/* Flat scuro (come Outlook scuro): niente trasparenze, sfocature e bagliori */
:root[data-style="flat"] {
  --btn-fill: #0078d4;
  --btn-line: transparent;
  --btn-highlight: 0 0 transparent;
  --btn-hover: brightness(.92);
  --bg: #201f1e;
  --glow-a: transparent;
  --glow-b: transparent;
  --surface: #2d2c2b;
  --surface-strong: #3b3a39;
  --hover: #3b3a39;
  --line: #484644;
  --line-strong: #605e5c;
  --text: #f3f2f1;
  --muted: #c8c6c4;
  --subtle: #a19f9d;
  --accent: #6cb8f6;
  --accent-fill: #0078d4;
  --accent-line: #3a6a8f;
  --selected: #19344a;
  --working: #f0d257;
  --danger: #ffb3b8;
  --success: #6ccb5f;
  --track: #252423;
  --field-bg: #252423;
  --option-bg: #2d2c2b;
  --menu-bg: #2d2c2b;
  --toast-bg: #2d2c2b;
  --message-bg: #292827;
  --message-service-bg: #1d2f3f;
  --panel-bg: #292827;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --thumb-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --menu-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  --highlight: 0 0 transparent;
  --blur: none;
  --glow-rest: 0 0 transparent;
  --glow-hover: 0 0 transparent;
  --glow-left: 0 0 transparent;
  --glow-right: 0 0 transparent;
}
/* Flat chiaro (come Outlook) */
:root[data-style="flat"][data-mode="light"] {
  --btn-fill: #0078d4;
  --btn-line: transparent;
  --btn-highlight: 0 0 transparent;
  --bg: #f5f5f5;
  --surface: #fff;
  --surface-strong: #fff;
  --hover: #faf9f8;
  --line: #e1dfdd;
  --line-strong: #c8c6c4;
  --text: #242424;
  --muted: #605e5c;
  --subtle: #8a8886;
  --accent: #106ebe;
  --accent-fill: #0078d4;
  --accent-line: #c7e0f4;
  --selected: #eff6fc;
  --working: #8a5a00;
  --danger: #a4262c;
  --success: #107c10;
  --track: #edebe9;
  --field-bg: #fff;
  --option-bg: #fff;
  --menu-bg: #fff;
  --toast-bg: #fff;
  --message-bg: #faf9f8;
  --message-service-bg: #eff6fc;
  --panel-bg: #faf9f8;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .06);
  --thumb-shadow: 0 1px 2px rgba(0, 0, 0, .1);
  --menu-shadow: 0 8px 24px rgba(0, 0, 0, .14);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font: var(--fs-md)/1.45 var(--font); color: var(--text);
  background: radial-gradient(ellipse 620px 460px at 8% 0%, var(--glow-a), transparent 70%), radial-gradient(ellipse 560px 460px at 96% 100%, var(--glow-b), transparent 70%), var(--bg);
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Superfici */
.card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--card-shadow); }

/* Pulsanti: pieno (azione principale), contorno, comando di testo */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px;
  background: transparent; font-weight: 500; text-decoration: none; cursor: pointer; transition: background-color .3s, border-color .3s, box-shadow .35s, filter .3s, transform .15s var(--ease); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:hover { background: var(--hover); }
.btn.primary { border-color: var(--btn-line); background: var(--btn-fill); color: #fff; box-shadow: var(--btn-highlight); }
.btn.primary:hover:not(:disabled) { background: var(--btn-fill); filter: var(--btn-hover); }
/* Pulsanti di chiamata (Rispondi, Rispondi a tutti), come i pulsanti del pannello che aprono un modulo: bagliore che
   respira al passaggio del mouse */
.pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: var(--glow-rest); color: var(--accent); font-weight: 500; cursor: pointer; transition: border-color .4s ease, box-shadow .4s ease, transform .15s var(--ease); }
.pill:hover { box-shadow: var(--highlight), var(--glow-hover); animation: call-on .4s ease-out, call-sway 4.8s ease-in-out .4s infinite; }
.pill:active { transform: scale(.97); }
.reply-bar { display: flex; flex-wrap: wrap; gap: 8px; }
.composer-head { display: flex; align-items: center; gap: 8px; min-height: 34px; color: var(--muted); font-size: var(--fs-sm); font-weight: 600; }
.composer-head .icon { color: var(--accent); }
.composer-head .modal-close { margin-left: auto; width: 30px; height: 30px; }
.btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: var(--danger); }
@keyframes call-on { from { box-shadow: var(--highlight), var(--glow-rest); } }
@keyframes call-sway {
  0%, 100% { box-shadow: var(--highlight), var(--glow-hover); }
  25% { box-shadow: var(--highlight), var(--glow-left); }
  75% { box-shadow: var(--highlight), var(--glow-right); } }
.btn.danger { border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--danger); }
.btn.wide { width: 100%; }
.link { display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; border: 0; background: none; color: var(--accent); font-size: var(--fs-sm); font-weight: 500; text-decoration: none; cursor: pointer; transition: color .2s; }
.link:hover { color: var(--text); }
.icon { flex: none; width: 16px; height: 16px; }

/* Pagina di accesso */
.login { flex: 1; min-height: 100%; display: grid; place-items: center; padding: 16px; }
.login .card { width: min(380px, 100%); padding: 22px; }
.login h1 { margin: 0 0 18px; font-size: 20px; font-weight: 600; }

/* App: barra in alto e colonne */
.app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.topbar { flex: none; display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand { font-size: var(--fs-lg); font-weight: 600; letter-spacing: .2px; }
.tabs { position: relative; min-width: 0; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--track); overflow-x: auto; }
.tab { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; transition: color .25s; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.count { min-width: 18px; color: var(--muted); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .count { color: var(--accent); }
.account { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; color: var(--muted); font-size: var(--fs-sm); }
.avatar { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--selected); color: var(--accent); font-size: var(--fs-xs); font-weight: 600; }
.account { position: relative; }
.account-button { display: inline-flex; align-items: center; gap: 8px; min-width: 0; height: 36px; padding: 0 8px 0 3px; border: 1px solid transparent; border-radius: 999px; background: none; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; transition: background-color .2s, border-color .25s, color .2s; }
.account-button:hover, .account-button[aria-expanded="true"] { border-color: var(--line); background: var(--hover); color: var(--text); }
.account-button .icon { width: 14px; height: 14px; transition: transform .25s var(--ease); }
.account-button[aria-expanded="true"] .icon { transform: rotate(180deg); }
.account .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* Menu a tendina dell'utente */
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; display: grid; min-width: 220px; padding: 6px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--menu-bg); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--menu-shadow); animation: menu-in .2s var(--ease) both; }
.menu-head { display: grid; gap: 1px; padding: 8px 10px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.menu-head .name { color: var(--text); font-size: var(--fs-sm); font-weight: 600; }
.menu-head .email { color: var(--subtle); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.menu-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); font-size: var(--fs-sm); text-align: left; cursor: pointer; transition: background-color .15s; }
.menu-item:hover { background: var(--hover); }
.menu-item .icon { color: var(--muted); }
@keyframes menu-in { from { opacity: 0; transform: translateY(-4px); } }

.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) minmax(260px, 320px); gap: 12px; }
.column { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.column > .card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 6px 10px 10px; scrollbar-gutter: stable; }
/* Barre di scorrimento sottili come nel pannello: 4 px, senza binario */
@supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; } }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { border-radius: 2px; background: var(--line-strong); }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
.column-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 12px 0; }

/* Selettore della sezione (Attive / Ignorate) */
.segmented { position: relative; display: flex; flex: 1; padding: 3px; border-radius: 10px; background: var(--track); }
.segment { position: relative; z-index: 1; transition: color .25s; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: var(--fs-sm); font-weight: 500; cursor: pointer; }
.segment[aria-pressed="true"] { color: var(--text); }
/* Pillola della voce scelta (schede e selettori): un elemento solo che scivola (animate() in app.js) */
.thumb { position: absolute; top: 3px; bottom: 3px; left: 0; z-index: 0; border-radius: 8px; background: var(--surface-strong); box-shadow: var(--thumb-shadow); pointer-events: none; }
.tabs .thumb { border-radius: 9px; }
.thumb.moving { transition: transform var(--motion), width var(--motion); }
/* Selettore con le icone: la voce scelta è più larga e ha il nome, che compare allargandosi con lei */
.segmented.icons .segment { flex: 1 1 0; min-width: 0; overflow: hidden; gap: 0; }
.segmented.icons .segment.big { flex-grow: 2.6; }
.segmented.icons:has(.segment:nth-of-type(4)) .segment.big { flex-grow: 4.5; }
.segmented.icons .segment-name { display: inline-grid; grid-template-columns: 0fr; opacity: 0; }
.segmented.icons .segment-name > span { min-width: 0; overflow: hidden; white-space: nowrap; }
.segmented.icons .segment.big .segment-name { grid-template-columns: 1fr; opacity: 1; margin-left: 6px; }
.segmented.icons .segment-name .count { margin-left: 6px; }
.segmented.icons.growing .segment { transition: color .25s, flex-grow var(--motion); }
.segmented.icons.growing .segment-name { transition: grid-template-columns var(--motion), opacity var(--motion), margin-left var(--motion); }

/* Elenco dei thread e dei ticket */
.list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.item { display: grid; gap: 3px; width: 100%; padding: 10px 12px; border: 1px solid transparent; border-radius: var(--radius); background: none; text-align: left; cursor: pointer; transition: background-color .2s, border-color .3s, transform .15s var(--ease); }
.item:active { transform: scale(.99); }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { border-color: var(--accent-line); background: var(--selected); }
.item-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.item-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
.item-time { flex: none; color: var(--subtle); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.item-meta { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: var(--fs-sm); }
.item-meta > span:first-child { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tag { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text); font-size: var(--fs-xs); font-weight: 500; }
.tag.mine { border-color: color-mix(in srgb, var(--label) 60%, transparent); background: color-mix(in srgb, var(--label) 22%, transparent); color: color-mix(in srgb, var(--label) 45%, var(--text)); }
.tag.working { border-color: color-mix(in srgb, var(--working) 50%, transparent); color: var(--working); }
.count-badge { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent-fill); color: #fff; font-size: var(--fs-xs); font-weight: 600; text-align: center; line-height: 20px; }

/* Thread */
.thread-head { flex: none; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.thread-title { margin: 0; font-size: var(--fs-lg); font-weight: 600; text-wrap: balance; }
.thread-sub { margin-top: 2px; color: var(--muted); font-size: var(--fs-sm); }
.messages { display: grid; gap: 10px; }
.message { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--message-bg); }
.message.service { background: var(--message-service-bg); }
.message-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin-bottom: 6px; color: var(--muted); font-size: var(--fs-sm); }
.message-from { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); font-weight: 500; }
.message-time { margin-left: auto; flex: none; color: var(--subtle); font-size: var(--fs-xs); }
.message-body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
.message-body.loading { color: var(--subtle); }
.attachments { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.attachment { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: var(--fs-xs); }
.thread-body { display: grid; gap: 12px; align-content: start; }
.composer { display: grid; gap: 0; padding: 4px 12px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--field-bg); }
.compose-field { display: flex; align-items: center; gap: 10px; min-width: 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.compose-field > span { flex: none; width: 56px; color: var(--muted); }
.compose-field input { flex: 1; min-width: 0; height: 36px; border: 0; background: none; color: var(--text); font: inherit; outline-offset: -2px; }
.composer textarea { width: 100%; min-height: 110px; margin-top: 10px; resize: vertical; padding: 10px 0 0; border: 0; background: none; color: var(--text); font: inherit; outline-offset: 2px; }
.composer textarea::placeholder { color: var(--subtle); }
.composer-actions { display: flex; align-items: center; gap: 14px; padding-top: 8px; border-top: 1px solid var(--line); }
.composer-actions .btn { margin-left: auto; }
.group + .group { margin-top: 14px; }
.group-title { display: flex; align-items: center; gap: 8px; margin: 2px 12px 6px; color: var(--muted); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

/* Colonna destra: dettagli e azioni */
.side { display: grid; gap: 14px; align-content: start; padding: 14px; }
.side h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.fields { display: grid; margin: 0; }
.field { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.field dt { color: var(--muted); }
.field dd { margin: 0; min-width: 0; text-align: right; overflow-wrap: anywhere; }
.actions { display: grid; gap: 8px; }
.actions-row { display: flex; gap: 8px; }
.actions-row .btn { flex: 1; }

/* Moduli */
.form { display: grid; gap: 10px; }
.field-input { display: grid; gap: 4px; min-width: 0; color: var(--muted); font-size: var(--fs-sm); }
.field-input :is(input, select, textarea), .search input, .amp-link input { width: 100%; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--field-bg); color: var(--text); font: inherit; font-size: var(--fs-md); }
.field-input textarea { height: auto; min-height: 90px; padding: 8px 10px; resize: vertical; }
.field-input select option { background: var(--option-bg); }
.hint { margin: 0; color: var(--subtle); font-size: var(--fs-sm); }
.details { border-top: 1px solid var(--line); padding-top: 8px; font-size: var(--fs-sm); }
.details summary { color: var(--accent); font-weight: 500; cursor: pointer; }
.details[open] summary { margin-bottom: 4px; }
.amp-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-top: 8px; }
.tag-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.choices { display: grid; gap: 6px; }
.link.danger { color: var(--danger); }
.btn:disabled, .link:disabled { opacity: .5; cursor: default; filter: none; }
.btn.icon-only { flex: none; width: 36px; padding: 0; }
.column-head.stack { flex-direction: column; align-items: stretch; }
.search-row { display: flex; gap: 8px; }
.search { position: relative; flex: 1; min-width: 0; }
.search .icon { position: absolute; left: 10px; top: 10px; color: var(--subtle); }
.search input { padding-left: 32px; }
.segmented.small .segment { height: 28px; font-size: var(--fs-xs); }
.link.responses { position: relative; }
.link.responses select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* Inoltro: passi con pallino (fatto, in corso, non riuscito, da fare) */
.forward-box { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.step { display: grid; justify-items: center; gap: 4px; color: var(--subtle); font-size: var(--fs-xs); }
.step-dot { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background: none; color: inherit; }
.step-dot .icon { width: 13px; height: 13px; }
.step.ok { color: var(--accent); } .step.ok .step-dot { border-color: var(--accent-line); background: var(--selected); }
.step.run { color: var(--text); }
.step.ko { color: var(--danger); } .step.ko .step-dot { border-color: color-mix(in srgb, var(--danger) 50%, transparent); cursor: pointer; }
.spinner { width: 12px; height: 12px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Pillola dell'esito */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: calc(100% - 32px); padding: 9px 16px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: var(--toast-bg); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--menu-shadow); color: var(--text); font-size: var(--fs-sm); font-weight: 500; transform: translateX(-50%); }
.toast.success { color: var(--success); } .toast.warning { color: var(--working); } .toast.danger { color: var(--danger); }

/* Impostazioni: finestra in sovrimpressione, con il resto sfocato dietro */
.modal-backdrop { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 45%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.modal-backdrop.opening { animation: fade-in .25s var(--ease) both; }
.modal { overflow: hidden; background: var(--menu-bg); display: flex; flex-direction: column; width: min(760px, 100%); height: min(720px, 100%); min-height: 0; }
.modal-backdrop.opening .modal { animation: modal-in .32s var(--ease) both; }
.modal-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.modal-head h2 { margin: 0; margin-right: auto; font-size: var(--fs-lg); font-weight: 600; }
.modal-close { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; transition: background-color .2s, color .2s; }
.modal-close:hover { background: var(--hover); color: var(--text); }
@keyframes fade-in { from { opacity: 0; } }
@keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.98); } }
/* Etichetta: palette dei colori (Profilo) */
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { min-width: 28px; height: 26px; padding: 0 8px; border: 1px solid color-mix(in srgb, var(--swatch) 60%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--swatch) 22%, transparent); color: color-mix(in srgb, var(--swatch) 45%, var(--text)); font-size: var(--fs-xs); font-weight: 600; cursor: pointer; transition: transform .15s var(--ease), box-shadow .25s; }
.swatch:hover { transform: scale(1.06); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface-strong), 0 0 0 3px color-mix(in srgb, var(--swatch) 70%, transparent); }
.field-label { color: var(--muted); font-size: var(--fs-sm); }

/* Impostazioni */
.settings { display: grid; gap: 14px; align-content: start; padding: 16px; }
.settings .tool { padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-bg); }
.settings-head { padding: 12px 16px 0; }
.new-item { justify-self: start; }
.config-list { gap: 8px; }
.config-item { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-bg); transition: border-color .3s, box-shadow .35s; }
.config-item.open { padding: 14px; border-color: var(--accent-line); box-shadow: var(--glow-rest); animation: enter-up .3s var(--ease) both; }
.config-face { display: grid; gap: 4px; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--radius); transition: background-color .2s; }
.config-face:hover { background: var(--hover); }
.config-summary { color: var(--muted); font-size: var(--fs-sm); }
.config-summary.text { white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.config-footer { display: flex; flex-wrap: wrap; gap: 4px; }
.actions-row.start { justify-content: flex-start; }
.actions-row.start .btn { flex: none; }

/* Tools */
.tools { display: grid; gap: 18px; align-content: start; max-width: 640px; padding: 18px; }
.tool { display: grid; gap: 10px; }
.tool h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.link-actions { display: flex; flex-wrap: wrap; gap: 6px 16px; }

/* Stati vuoti */
.empty { display: grid; place-items: center; gap: 8px; height: 100%; min-height: 160px; padding: 24px; color: var(--subtle); font-size: var(--fs-sm); text-align: center; }
.empty .icon { width: 28px; height: 28px; }
.back { display: none; }
.workspace.single { grid-template-columns: minmax(0, 1fr); }
.workspace.single > .column { display: flex !important; }

/* Vista: computer (tre colonne, o due sotto i 1100 px con i dettagli sopra il thread) o mobile (una colonna con il
   ritorno all'elenco). La sceglie Impostazioni > Aspetto; in automatico decide la larghezza dello schermo. */
.side-inline { display: none; }
:root[data-layout="medium"] .workspace { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); }
:root[data-layout="medium"] .workspace > .column:last-child,
:root[data-layout="mobile"] .workspace > aside.column { display: none; }
:root[data-layout="medium"] .side-inline,
:root[data-layout="mobile"] .side-inline { display: grid !important; padding: 0 0 6px; }
:root[data-layout="mobile"] .app { gap: 10px; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
:root[data-layout="mobile"] .brand,
:root[data-layout="mobile"] .account .name,
:root[data-layout="mobile"] .tab:not([aria-selected="true"]) .tab-label { display: none; }
:root[data-layout="mobile"] .topbar { gap: 10px; }
:root[data-layout="mobile"] .tabs { flex: 1; }
:root[data-layout="mobile"] .tab { flex: 1; justify-content: center; padding: 0 11px; height: 38px; }
:root[data-layout="mobile"] .workspace { grid-template-columns: minmax(0, 1fr); }
:root[data-layout="mobile"] .workspace.detail-open > .column:first-child,
:root[data-layout="mobile"] .workspace:not(.detail-open):not(.single) > .column:nth-child(2) { display: none; }
:root[data-layout="mobile"] .back { display: inline-flex; margin-bottom: 6px; min-height: 36px; }
:root[data-layout="mobile"] .thread-head { padding: 10px 12px 8px; }
:root[data-layout="mobile"] .column-head { padding: 10px 10px 0; }
:root[data-layout="mobile"] .item { padding-top: 12px; padding-bottom: 12px; }
:root[data-layout="mobile"] .btn, :root[data-layout="mobile"] .segment { min-height: 38px; }
:root[data-layout="mobile"] input, :root[data-layout="mobile"] select, :root[data-layout="mobile"] textarea { font-size: 16px; }
:root[data-layout="mobile"] .steps { grid-template-columns: repeat(2, 1fr); }
:root[data-layout="mobile"] .modal-backdrop { padding: max(10px, env(safe-area-inset-top, 0px)) 10px max(10px, env(safe-area-inset-bottom, 0px)); }
:root[data-layout="mobile"] .modal { width: 100%; max-width: 100%; min-width: 0; height: 100%; }
:root[data-layout="mobile"] .modal > *, :root[data-layout="mobile"] .settings .tool { min-width: 0; }
/* Vista mobile scelta su uno schermo largo: la pagina resta della larghezza di un telefono, al centro */
:root[data-layout="mobile"][data-wide] .app { width: min(430px, 100%); margin: 0 auto; }
:root[data-layout="mobile"][data-wide] .modal-backdrop { padding: 16px; }
:root[data-layout="mobile"][data-wide] .modal { width: min(430px, 100%); height: min(820px, 100%); }
/* Entrata delle parti che cambiano contenuto e scorrimento della vista tra le schede in alto */
.enter { animation: enter-up .32s var(--ease) both; }
.scroll.settings.enter-next, .scroll.settings.enter-back { overflow-x: hidden; }
.scroll.settings.enter-next > *, .modal .scroll.settings.enter-next > * { animation: enter-next .36s var(--ease) both; }
.scroll.settings.enter-back > * { animation: enter-back .36s var(--ease) both; }
.workspace.enter-next { animation: enter-next .36s var(--ease) both; }
.workspace.enter-back { animation: enter-back .36s var(--ease) both; }
.toast.enter { animation: toast-in .3s var(--ease) both; }
@keyframes enter-up { from { opacity: 0; transform: translateY(6px); } }
@keyframes enter-next { from { opacity: 0; transform: translateX(18px); } }
@keyframes enter-back { from { opacity: 0; transform: translateX(-18px); } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<div class="app" id="app"></div>
<script>
// Anteprima: risposte finte delle Function e dell'accesso, nello stesso formato di quelle vere.
(() => {
  const ME = 'utente@esempio.it', BOX = 'servizio@esempio.it';
  const ago = minutes => new Date(Date.now() - minutes * 60000).toISOString();
  const config = { payload: { ticketing: { email: BOX }, forwardingTargets: { ES: { name: 'Email Security', code: 'ES' }, PO: { name: 'Posta', code: 'PO' } }, operators: { 'OP-1': { email: ME, displayName: 'Mario Rossi', tag: 'Rossi' }, 'OP-2': { email: 'luigi.verdi@esempio.it', displayName: 'Luigi Verdi', tag: 'Verdi' } } } };
  const threads = [
    { id: 101, subject: 'Errore accesso casella condivisa', from: 'Anna Bianchi <anna.bianchi@agenzia.it>', at: 22, count: 2, thread: { status: 'Working', assignedTo: ME, statusAt: ago(15) } },
    { id: 102, subject: 'Richiesta licenza Visio', from: 'Paolo Neri <paolo.neri@agenzia.it>', at: 48, count: 1, thread: { status: 'New' } },
    { id: 103, subject: 'Abilitazione Teams per utente esterno', from: 'Sara Gialli <sara.gialli@agenzia.it>', at: 95, count: 3, thread: { status: 'Working', assignedTo: 'luigi.verdi@esempio.it', statusAt: ago(60) } },
    { id: 104, subject: 'Aggiunta membri a lista di distribuzione', from: 'Marco Blu <marco.blu@agenzia.it>', at: 160, count: 1, thread: { status: 'New' } },
    { id: 105, subject: 'Reset MFA', from: 'Elena Viola <elena.viola@agenzia.it>', at: 1500, count: 2, thread: { status: 'New' } }
  ];
  const ignored = [{ id: 201, subject: 'Newsletter servizi cloud', from: 'Notifiche <noreply@fornitore.it>', at: 300, count: 1, thread: { status: 'Ignored', statusBy: 'luigi.verdi@esempio.it', statusAt: ago(280) } }];
  const toItem = t => ({ parentItemId: t.id, conversationId: 'C' + t.id, subject: t.subject, from: t.from, lastReceived: ago(t.at), messageCount: t.count, lastMessage: { messageId: 'M' + t.id + '-' + t.count, from: t.from, subject: t.subject, receivedDate: ago(t.at) }, thread: t.thread });
  const tickets = [
    { id: '11', ticketId: 'SHP-0042', parentItemId: 106, status: 'In Progress', agency: 'DEM', operator: ME, shortDescription: 'Casella condivisa protocollo non visibile', ampReference: 'INC0123456', created: ago(200), elapsedTime: 25 },
    { id: '12', ticketId: 'SHP-0039', parentItemId: 107, status: 'On Hold', agency: 'AG1', operator: ME, shortDescription: 'Migrazione archivio PST', ampReference: 'INC0123311', created: ago(3000), elapsedTime: 90 },
    { id: '13', ticketId: 'SHP-M-7', parentItemId: null, status: 'In Progress', agency: 'AG2', operator: 'luigi.verdi@esempio.it', shortDescription: 'Verifica regole di inoltro', created: ago(500), elapsedTime: 10 }
  ];
  const conversations = {
    101: [['Anna Bianchi <anna.bianchi@agenzia.it>', 22 + 30, 'Buongiorno,\n\nda stamattina non riesco ad aprire la casella condivisa protocollo@agenzia.it da Outlook: compare un errore di autorizzazione.\n\nGrazie\nAnna Bianchi', true], [BOX, 22, 'Salve,\n\nsi prende in carico la richiesta.\n\nSaluti,\nMario Rossi\nService Desk', false]],
    102: [['Paolo Neri <paolo.neri@agenzia.it>', 48, 'Buongiorno,\n\nchiedo l\'assegnazione di una licenza Visio per il collega Luca Rossi.\n\nCordiali saluti\nPaolo Neri', false]],
    103: [['Sara Gialli <sara.gialli@agenzia.it>', 200, 'Buongiorno,\n\nserve abilitare la chat Teams con un consulente esterno.\n\nSara', false], [BOX, 150, 'Salve,\n\nci indica l\'indirizzo del consulente?\n\nSaluti,\nLuigi Verdi', false], ['Sara Gialli <sara.gialli@agenzia.it>', 95, 'È consulente@studio-esterno.it, grazie.', false]],
    104: [['Marco Blu <marco.blu@agenzia.it>', 160, 'Buongiorno,\n\nvanno aggiunti alla lista uffici-roma@agenzia.it i colleghi in allegato.\n\nGrazie', true]],
    105: [['Elena Viola <elena.viola@agenzia.it>', 1560, 'Ho cambiato telefono e non riesco più ad approvare l\'accesso.', false], [BOX, 1500, 'Salve,\n\nprocediamo con il reset del metodo di autenticazione.\n\nSaluti,\nLuigi Verdi', false]],
    106: [['Giorgio Rosa <giorgio.rosa@agenzia.it>', 260, 'La casella protocollo non compare più in Outlook.', false], [BOX, 200, 'Salve,\n\nsi prende in carico la richiesta, riferimento INC0123456.\n\nSaluti,\nMario Rossi', false], ['Giorgio Rosa <giorgio.rosa@agenzia.it>', 30, 'Ora la vedo ma non riesco a inviare per conto della casella.', false]],
    107: [['Chiara Verdi <chiara.verdi@agenzia.it>', 3100, 'Dobbiamo importare un archivio PST di 30 GB nella nuova casella.', true], [BOX, 3000, 'Salve,\n\nattendiamo il caricamento del file nella cartella condivisa.\n\nSaluti,\nMario Rossi', false]],
    201: [['Notifiche <noreply@fornitore.it>', 300, 'Novità del mese sui servizi cloud.', false]]
  };
  const closed = [{ id: '9', ticketId: 'SHP-0031', parentItemId: null, status: 'Resolved', agency: 'DEM', operator: ME, shortDescription: 'Reset password casella protocollo', ampReference: 'INC0122001', created: ago(9000), elapsedTime: 15 }];
  const bodies = {};
  try {
    if (!localStorage.getItem('snow_ticket_assistant_v1')) localStorage.setItem('snow_ticket_assistant_v1', JSON.stringify({
      profile: { assignedTo: { displayValue: 'Mario Rossi', value: 'abc123' } },
      companies: { dem: { name: 'Agenzia del Demanio', domains: ['agenzia.it'], company: { displayValue: 'Agenzia del Demanio', value: 'c1' }, assignmentGroup: { displayValue: 'M365 Service Desk', value: 'g1' } }, ag1: { name: 'Agenzia Uno', domains: ['agenziauno.it'], company: { displayValue: 'Agenzia Uno', value: 'c2' }, assignmentGroup: { displayValue: 'M365 Service Desk', value: 'g1' } } },
      activities: { a1: { name: 'Casella condivisa', category: { displayValue: 'Exchange', value: 'k1' }, impact: '3', urgency: '3', timeWorked: 15 }, a2: { name: 'Licenze', category: { displayValue: 'Licensing', value: 'k2' }, impact: '3', urgency: '3', timeWorked: 10 } },
      usefulResponses: { r1: { title: 'Presa in carico', response: 'si prende in carico la richiesta.' }, r2: { title: 'Richiesta informazioni', response: 'per procedere ci serve il nome completo dell\'utente.' } }
    }));
  } catch {}
  const subjects = Object.fromEntries([...threads, ...ignored].map(t => [t.id, t.subject]).concat([[106, 'Casella protocollo non visibile'], [107, 'Importazione archivio PST']]));
  const messages = id => (conversations[id] || []).map(([from, at, text, attach], index) => {
    const messageId = `M${id}-${index + 1}`;
    const subject = (index ? 'RE: ' : '') + (subjects[id] || '');
    bodies[messageId] = { subject, from, to: [BOX], cc: id === 101 || id === 106 ? ['ufficio.it@agenzia.it'] : [], receivedDate: ago(at), hasAttachments: attach, text, newText: text };
    return { messageId, subject, from, receivedDate: ago(at), hasAttachment: attach, status: 'New' };
  });
  const json = data => new Response(JSON.stringify(data), { headers: { 'Content-Type': 'application/json' } });
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const url = new URL(String(input), location.href);
    const path = url.pathname.replace(/^.*?(\/(\.auth|api)\/)/, '$1');
    if (!path.startsWith('/api/')) return realFetch(input, init);
    await delay(250 + Math.random() * 300);
    const name = path.slice(5), q = url.searchParams;
    if (name === 'PluginConfig') return json(config);
    if (name === 'ListQueue') {
      const section = q.get('section');
      if (section === 'active') return json({ threads: threads.map(toItem) });
      if (section === 'ignored') return json({ threads: ignored.map(toItem) });
      return json({ threads: [{ parentItemId: 106, unseenCount: 1, lastReceived: ago(30) }] });
    }
    const body = (() => { try { return JSON.parse(init?.body || '{}'); } catch { return {}; } })();
    if (name === 'SearchTicketRecords') {
      if (body.text) { const t = body.text.toLowerCase(); return json({ records: [...tickets, ...closed].filter(r => [r.ticketId, r.shortDescription, r.ampReference].some(v => String(v || '').toLowerCase().includes(t))) }); }
      return json({ records: tickets.filter(r => ['In Progress', 'On Hold'].includes(r.status)) });
    }
    if (name === 'ManageThread') {
      const all = [...threads, ...ignored]; const t = all.find(x => x.id === Number(body.parentItemId)); if (!t) return json({ status: 'error', message: 'Thread non trovato' });
      const a = body.action;
      if (a === 'tag') t.thread = { status: t.thread.status === 'Ignored' ? 'Ignored' : 'Working', assignedTo: ME, statusAt: ago(0) };
      if (a === 'untag') t.thread = { status: t.thread.status === 'Ignored' ? 'Ignored' : 'New', statusBy: t.thread.statusBy };
      if (a === 'acquire') { threads.splice(threads.indexOf(t), 1); }
      if (a === 'ignore') { threads.splice(threads.indexOf(t), 1); t.thread = { status: 'Ignored', statusBy: ME, statusAt: ago(0) }; ignored.unshift(t); }
      if (a === 'restore') { ignored.splice(ignored.indexOf(t), 1); t.thread = { status: 'New' }; threads.unshift(t); }
      return json({ status: 'ok', thread: t.thread });
    }
    if (name === 'ManageTicket') {
      if (body.action === 'createTicket') {
        const n = body.parentItemId ? `SHP-00${50 + tickets.length}` : `SHP-M-${10 + tickets.length}`;
        const r = { id: String(100 + tickets.length), ticketId: n, parentItemId: body.parentItemId || null, status: 'In Progress', agency: body.agency, operator: ME, shortDescription: body.shortDescription, created: ago(0), elapsedTime: body.elapsedTime, forwardGroup: body.forwardGroup || '' };
        tickets.unshift(r); if (body.parentItemId) conversations[body.parentItemId] = conversations[body.parentItemId] || [];
        return json({ status: 'ok', ticket: r });
      }
      const r = tickets.find(x => x.ticketId === body.ticketId); Object.assign(r, { status: body.status || r.status, notes: body.notes ?? r.notes, elapsedTime: body.elapsedTime ?? r.elapsedTime });
      return json({ status: 'ok', ticket: r });
    }
    if (name === 'ReplyAll') {
      const id = Number(body.parentItemId); (conversations[id] = conversations[id] || []).push([BOX, 0, body.text || 'Salve,\n\nsi prende in carico la richiesta.\n\nSaluti,\nMario Rossi', false]);
      const r = tickets.find(x => x.ticketId === body.ticketId); if (r) r.repliedAt = ago(0);
      return json({ status: 'ok' });
    }
    if (name === 'ListThreadMessages') return json({ messages: messages(Number(q.get('parentItemId'))) });
    if (name === 'GetMailBody') return json(bodies[q.get('messageId')] || { text: '' });
    return json({ status: 'ok' });
  };
  // Accesso finto al posto di MagusAuth (src/auth.js): Accedi entra subito come utente di prova, Esci torna alla schermata di accesso.
  const KEY = 'magus_preview_logged';
  const logged = () => { try { return sessionStorage.getItem(KEY) === '1'; } catch { return false; } };
  const set = value => { try { value ? sessionStorage.setItem(KEY, '1') : sessionStorage.removeItem(KEY); } catch {} location.reload(); };
  window.MagusAuth = { start: async () => logged() ? { email: ME, name: 'Mario Rossi' } : null, login: () => set(true), logout: () => set(false), token: async () => 'token-di-prova' };
})();

</script>
<script>
// Magus: coda dei thread, mail e ticket della casella del servizio (il pannello AMP fuori da Outlook).

    function shortWhen(value) {
        const date = parseDate(value);

        if (days === 0) return `${pad(date.getHours())}:${pad(date.getMinutes())}`;

    // Token rifiutato dalla Function (401): se ne chiede uno nuovo e si riprova una volta.
    async function call(name, params = {}, method = 'GET', retried = false) {
        let url = FUNCTIONS_URL + name;
        const request = { method, headers: { Accept: 'application/json', Authorization: `Bearer ${await window.MagusAuth.token({ fresh: retried })}` } };
        if (method === 'GET') {
            const query = new URLSearchParams(Object.entries(params).filter(([, value]) => value !== undefined && value !== null));
            if (String(query)) url += `?${query}`;
        } else {
            request.headers['Content-Type'] = 'application/json';
            request.body = JSON.stringify(params);
        }
        const response = await fetch(url, request);
        if (response.status === 401 && !retried) return call(name, params, method, true);
        const data = await response.json().catch(() => null);
        if (!response.ok || data?.status === 'error') {
            const error = new Error(data?.message || `${name}: errore ${response.status}`);
            error.reason = data?.reason || data?.error || null;
            error.data = data;
            throw error;
        }
        return data;
    }

        async updateTicket(ticket, type, text, addMinutes) {

            if (type === 'cancel') changes.status = 'Canceled';
            if (type === 'hold') changes.status = 'On Hold';

    }
    // Esegue un'azione: blocca i pulsanti, mostra l'esito; se il thread è cambiato nel frattempo aggiorna tutto.
    async function run(action, done) {
        if (state.busy) return null;
        state.busy = true;
        render();
        try {
            const result = await action();
            if (done) showStatus(typeof done === 'function' ? done(result) : done);
            return result ?? true;
        } catch (error) {
            console.error('[Magus]', error);
            if (CHANGED[error.reason]) {
                showStatus(CHANGED[error.reason], 'warning');
                if (error.reason !== 'not_tagged') reloadAll();
            } else showStatus(error.message || 'Operazione non riuscita', 'danger');
            return null;
        } finally {
            state.busy = false;
            render();
        }
    }

    async function loadLists() {
        try {
            const [active, ignored, tickets] = await Promise.all([Data.queue('active'), Data.queue('ignored'), Data.tickets()]);
            Object.assign(state.lists, { active, ignored, tickets });
            state.error = '';
        } catch (error) {
            state.error = error.message;
        }
        state.loaded = true;
        render();
    }
    function reloadAll() {
        state.threads.clear();
        loadLists().then(() => { const item = selectedItem(); if (item) openThread(item.parentItemId); });
    }
    async function openThread(parentItemId) {
        if (!parentItemId || state.threads.has(parentItemId)) return;
        const thread = { messages: [], bodies: new Map(), loading: true, error: '' };
        state.threads.set(parentItemId, thread);
        try { thread.messages = await Data.messages(parentItemId); }
        catch (error) { thread.error = error.message; }
        thread.loading = false;
        render();
        await Promise.all(thread.messages.map(async message => {
            try { thread.bodies.set(message.id, await Data.body(message.id)); }
            catch (error) { thread.bodies.set(message.id, { error: error.message }); }
            render();
        }));
    }
    function select(item) {
        state.selected = item.key;
        state.panel = null;
        state.armed = null;
        render();
        openThread(item.parentItemId);
    }
    function closeSelected() {
        state.selected = null;
        state.panel = null;
        render();
    }

    // ------------------------------------------------------------------
    // Azioni
    // ------------------------------------------------------------------
    // Tag: tuo → lo togli; di un collega → secondo clic per subentrare; nessuno → lo metti.
    async function toggleTag(item) {
        const mine = item.status === 'Working' && isMe(item.assignedTo);
        const other = item.assignedTo && !mine && ['Working', 'Ignored'].includes(item.status);
        if (other && state.armed !== item.key) { state.armed = item.key; render(); return; }
        state.armed = null;
        const done = await run(() => Data.thread(item, mine ? 'untag' : 'tag', other ? { force: true } : {}), mine ? 'Tag tolto' : 'Tag messo');
        if (done) await loadLists();
    }
    // Presa in carico, inoltro e ignora vogliono il proprio tag: se manca si mette prima.
    async function ensureTag(item) {
        if (item.status === 'Working' && isMe(item.assignedTo)) return;
        if (item.assignedTo && !isMe(item.assignedTo)) {
            const error = new Error(CHANGED.tagged_by_other);
            error.reason = 'not_tagged';
            throw error;
        }
        await Data.thread(item, 'tag');
    }

    // Presa in carico: Agenzia (suggerita dal dominio del mittente), Attività, Short description; i Dettagli mostrano
    // i campi del ticket e il link di AMP già compilato.
    function suggestCompany(from, subject) {
        const domain = String(from?.email || '').split('@')[1]?.toLowerCase() || '';
        const companies = Object.entries(state.settings.companies);
        const byDomain = domain && companies.find(([, company]) => company.domains.some(item => domain === item || domain.endsWith(`.${item}`)));
        if (byDomain) return byDomain[0];
        const text = String(subject || '').toLowerCase();
        return companies.find(([, company]) => company.name && text.includes(company.name.toLowerCase()))?.[0] || '';
    }
    function takeDraft(item) {
        const key = `take:${item?.key || 'new'}`;
        if (!state.forms.has(key)) {
            const thread = item && state.threads.get(item.parentItemId);
            const first = thread?.messages?.[0];
            state.forms.set(key, {
                companyId: item ? suggestCompany(item.from, item.subject) : '',
                activityId: '',
                subject: item ? cleanSubject(item.subject) : '',
                description: first ? thread.bodies.get(first.id)?.text || '' : '',
                detailsOpen: false
            });
        }
        return state.forms.get(key);
    }
    const SEVERITY = { '1': '1 - High', '2': '2 - Medium', '3': '3 - Low' };
    const AMP_LINK_MAX = 6000;
    function ticketFields(draft) {
        const company = state.settings.companies[draft.companyId];
        const activity = state.settings.activities[draft.activityId];
        if (!company || !activity) return null;
        const prefix = activity.shortDescriptionPrefix || '';
        return {
            company: reference(company.company),
            assignmentGroup: reference(company.assignmentGroup),
            assignedTo: state.settings.profile.assignedTo,
            category: reference(activity.category),
            impact: activity.impact,
            urgency: activity.urgency,
            minutes: Number(activity.timeWorked) || 0,
            shortDescription: prefix ? `${prefix} ${draft.subject.replace(/^\s*\[[^\]]+\]\s*/, '')}`.trim() : draft.subject.trim(),
            description: String(draft.description || '').slice(0, 4000)
        };
    }
    // Nuovo incident su AMP con i campi già compilati ("^" separa i campi: nel testo si raddoppia).
    function ampLink(fields) {
        const value = text => String(text ?? '').replace(/\^/g, '^^');
        const worked = fields.minutes ? `1970-01-01 ${pad(Math.floor(fields.minutes / 60))}:${pad(fields.minutes % 60)}:00` : '';
        const pairs = [
            ['company', fields.company.value], ['assignment_group', fields.assignmentGroup.value], ['assigned_to', fields.assignedTo.value],
            ['x_avana_platform_category_value', fields.category.value], ['impact', fields.impact], ['urgency', fields.urgency],
            ['short_description', fields.shortDescription], ['time_worked', worked]
        ].filter(([, text]) => text);
        const base = `https://amp.service-now.com/incident.do?sys_id=-1&sysparm_query=${encodeURIComponent(pairs.map(([name, text]) => `${name}=${value(text)}`).join('^'))}`;
        const description = text => (text ? encodeURIComponent(`^description=${value(text)}`) : '');
        let text = fields.description;
        while (text && (base + description(text)).length > AMP_LINK_MAX) text = text.slice(0, Math.floor(text.length * .8));
        return base + description(text);
    }
    async function takeCharge(item) {
        const draft = takeDraft(item);
        const fields = ticketFields(draft);
        if (!fields) return showStatus('Scegli agenzia e attività', 'danger');
        const company = state.settings.companies[draft.companyId];
        const thread = item && state.threads.get(item.parentItemId);
        const ticket = await run(async () => {
            if (item) {
                await ensureTag(item);
                await Data.thread({ ...item, messageCount: thread?.messages?.length || item.messageCount }, 'acquire');
            }
            return Data.createTicket(item ? { ...item, messageId: thread?.messages?.[0]?.id } : null,
                { agency: company.name, shortDescription: fields.shortDescription, description: fields.description, minutes: fields.minutes });
        }, created => `Ticket ${created.number} aperto`);
        if (!ticket) return;
        state.forms.delete(`take:${item?.key || 'new'}`);
        state.panel = null;
        await loadLists();
        state.selected = ticket.key;
        render();
        openThread(ticket.parentItemId);
    }
    async function ignoreThread(item) {
        const done = await run(async () => { await ensureTag(item); await Data.thread(item, 'ignore'); }, 'Ignorata');
        if (done) { closeSelected(); await loadLists(); }
    }
    async function restoreThread(item) {
        const done = await run(() => Data.thread(item, 'restore'), 'Rimessa in coda');
        if (done) { closeSelected(); await loadLists(); }
    }

    // Inoltro in quattro passi: ticket, risposta con la sigla del gruppo, inoltro, chiusura del ticket. Al primo passo
    // che non riesce si ferma; il ticket resta tra gli aperti con la striscia dei passi e si riprende da lì.
    const FORWARD_STEPS = [['ticket', 'Ticket'], ['reply', 'Risposta'], ['forward', 'Inoltro'], ['close', 'Chiusura']];
    const FORWARD_ACTIONS = {
        ticket: async job => {
            await ensureTag(job.item);
            job.ticket = await Data.createTicket({ ...job.item, messageId: job.messageId },
                { agency: '', shortDescription: cleanSubject(job.item.subject), description: job.description, minutes: 0, forwardGroup: job.group.name || job.group.tag });
        },
        reply: job => Data.reply(job.item.parentItemId, { tag: job.group.tag, reference: job.ticket.ampReference || job.ticket.number, ticketId: job.ticket.number }),
        forward: job => Data.forward(job.item, job.group),
        close: async job => { job.ticket = await Data.updateTicket(job.ticket, 'resolve', `Inoltrato a ${job.group.tag}`); }
    };
    async function runForward(job, from) {
        for (let index = from; index < FORWARD_STEPS.length; index += 1) {
            job.steps[index] = 'run';
            render();
            try {
                await FORWARD_ACTIONS[FORWARD_STEPS[index][0]](job);
                job.steps[index] = 'ok';
            } catch (error) {
                console.error('[Magus]', error);
                job.steps[index] = 'ko';
                job.error = error;
                render();
                return false;
            }
        }
        render();
        return true;
    }
    async function forwardThread(item, group) {
        const thread = state.threads.get(item.parentItemId);
        const first = thread?.messages?.[0];
        const job = { item, group, messageId: first?.id, description: first ? thread.bodies.get(first.id)?.text || '' : '', ticket: null, steps: FORWARD_STEPS.map(() => 'wait') };
        state.panel = { type: 'forwarding', job };
        state.busy = true;
        const ok = await runForward(job, 0);
        state.busy = false;
        if (!job.ticket) {
            state.panel = null;
            if (CHANGED[job.error?.reason]) { showStatus(CHANGED[job.error.reason], 'warning'); reloadAll(); }
            else showStatus('Inoltro non riuscito', 'danger');
            return;
        }
        if (ok) {
            state.panel = null;
            showStatus(`Inoltrata a ${group.tag}`);
            closeSelected();
        } else {
            state.forwardJobs.set(job.ticket.number, job);
            const stuck = FORWARD_STEPS[job.steps.indexOf('ko')][1];
            showStatus(`Bloccato su ${stuck}`, 'warning');
            state.selected = job.ticket.key;
            state.panel = null;
        }
        await loadLists();
    }
    // Inoltro fermo a metà su un ticket: i passi si ricavano dal ticket se la pagina non l'ha seguito.
    function forwardJobFor(ticket) {
        if (!ticket.forwardGroup || !OPEN_TICKET_STATUSES.includes(ticket.status)) return null;
        if (!state.forwardJobs.has(ticket.number)) {
            const group = forwardGroups().find(entry => [entry.name, entry.id, entry.tag].includes(ticket.forwardGroup));
            if (!group) return null;
            state.forwardJobs.set(ticket.number, {
                item: { parentItemId: ticket.parentItemId, subject: ticket.subject }, group, ticket,
                steps: ['ok', ticket.repliedAt ? 'ok' : 'ko', ticket.repliedAt ? 'ko' : 'wait', 'wait']
            });
        }
        return state.forwardJobs.get(ticket.number);
    }
    async function resumeForward(job, index) {
        if (state.busy) return;
        state.busy = true;
        const ok = await runForward(job, index);
        state.busy = false;
        if (ok) {
            state.forwardJobs.delete(job.ticket.number);
            showStatus(`Inoltrata a ${job.group.tag}`);
            closeSelected();
        }
        await loadLists();
    }

    // Aggiornamento del ticket: commento, risoluzione, attesa, annullamento; minuti da aggiungere al tempo lavorato.
    const UPDATE_TYPES = [['comment', 'Aggiorna'], ['resolve', 'Risolvi'], ['hold', 'In attesa'], ['cancel', 'Annulla']];
    async function updateTicket(ticket) {
        const draft = state.forms.get(`update:${ticket.number}`) || { type: 'comment', text: '', minutes: '' };
        if (!draft.text.trim() && draft.type === 'comment' && !Number(draft.minutes)) return showStatus('Scrivi il commento', 'danger');
        const label = { comment: 'Ticket aggiornato', resolve: 'Ticket risolto', hold: 'Ticket in attesa', cancel: 'Ticket annullato' }[draft.type];
        const done = await run(() => Data.updateTicket(ticket, draft.type, draft.text.trim(), draft.minutes), label);
        if (!done) return;
        state.forms.delete(`update:${ticket.number}`);
        state.panel = null;
        if (draft.type === 'resolve' || draft.type === 'cancel') closeSelected();
        await loadLists();
    }

    // Risposta a tutti con i destinatari e l'oggetto scelti.
    async function sendReply(item, thread) {
        const draft = draftFor(item, thread);
        if (!draft.text.trim()) return showStatus('Scrivi la risposta', 'danger');
        if (!addresses(draft.to).length) return showStatus('Manca il destinatario', 'danger');
        const ticket = item.key.startsWith('ticket:') ? item : null;
        const done = await run(() => Data.reply(item.parentItemId, {
            text: draft.text.trim(), to: addresses(draft.to), cc: addresses(draft.cc), bcc: addresses(draft.bcc), subject: draft.subject,
            ...(ticket ? { ticketId: ticket.number, reference: ticket.ampReference || ticket.number } : {})
        }), 'Risposta inviata');
        if (!done) return;
        state.drafts.delete(item.parentItemId);
        state.composing.delete(item.parentItemId);
        state.threads.delete(item.parentItemId);
        openThread(item.parentItemId);
    }

    async function search(text) {
        state.search = text;
        if (!text.trim()) { state.found = null; render(); return; }
        const found = await run(() => Data.searchTickets(text.trim()));
        state.found = found || [];
        render();
    }

    // Una vista sola: i ticket aperti e, sotto, i thread in coda; le ignorate a parte. La ricerca filtra quello che
    // c'è e, con Invio, cerca anche tra tutti i ticket.
    function listColumn() {

                    h('button', { type: 'button', class: 'segment', 'aria-pressed': String(state.section === id), onclick: () => { state.section = id; closeSelected(); } },
                        icon(ICONS[iconName]), label, h('span', { class: 'count' }, String(count))))),

    function message(item, thread) {
        const body = thread.bodies.get(item.id);
        const service = sameEmail(item.from.email, serviceMailbox());
        return h('article', { class: `message${service ? ' service' : ''}` },
            h('div', { class: 'message-head' },
                h('span', { class: 'message-from' }, item.from.name),

            !body ? h('p', { class: 'message-body loading' }, 'Caricamento…')
                : body.error ? h('p', { class: 'message-body loading' }, body.error)
                    : h('p', { class: 'message-body' }, body.text),
            item.hasAttachment || body?.hasAttachments
                ? h('div', { class: 'attachments' }, h('span', { class: 'attachment' }, icon(ICONS.attach), 'Allegati'))
                : null);

    // Risposta a tutti precompilata dall'ultima mail arrivata (non della casella del servizio): A = chi l'ha scritta,
    // Cc = gli altri destinatari, Oggetto = RE: della mail. Tutto modificabile; Ccn su richiesta.
    function draftFor(item, thread) {
        const id = item.parentItemId;
        if (state.drafts.has(id)) return state.drafts.get(id);
        const service = serviceMailbox();
        const last = [...thread.messages].reverse().find(entry => !sameEmail(entry.from.email, service)) || thread.messages[thread.messages.length - 1];
        const body = last && thread.bodies.get(last.id);
        const to = last?.from.email || '';
        const cc = [...(body?.to || []), ...(body?.cc || [])].filter(address => address && !sameEmail(address, service) && !sameEmail(address, to));
        const subject = last?.subject || item.subject || '';
        return { mode: 'all', to, cc: [...new Set(cc)].join('; '), bcc: '', subject: /^re:/i.test(subject) ? subject : `RE: ${subject}`, text: '', bccOpen: false };
    }
    function composer(item, thread) {
        const id = item.parentItemId;
        const draft = draftFor(item, thread);
        const change = (key, value) => { state.drafts.set(id, { ...draftFor(item, thread), [key]: value }); };
        const responses = Object.entries(state.settings.usefulResponses).sort(([, a], [, b]) => String(a.title).localeCompare(String(b.title), 'it'));
        const field = (key, label) => h('label', { class: 'compose-field' },
            h('span', {}, label),
            h('input', { id: `reply-${key}-${id}`, value: draft[key], autocomplete: 'off', oninput: event => change(key, event.target.value) }),
            key === 'cc' && !draft.bccOpen ? h('button', { type: 'button', class: 'link', onclick: () => { change('bccOpen', true); render(); document.getElementById(`reply-bcc-${id}`)?.focus(); } }, 'Ccn') : null);
        return h('div', { class: 'composer' },
            h('div', { class: 'composer-head' }, icon(ICONS[draft.mode === 'one' ? 'reply' : 'replyAll']), draft.mode === 'one' ? 'Rispondi' : 'Rispondi a tutti',
                h('button', { type: 'button', class: 'modal-close', title: 'Scarta', 'aria-label': 'Scarta', onclick: () => closeComposer(item) }, icon(ICONS.trash))),
            field('to', 'A'),
            field('cc', 'Cc'),

    // La scheda cresce dalla forma del pulsante (larghezza, altezza e angoli), poi compare il contenuto; all'inverso
    // il contenuto svanisce e la scheda torna pulsante. Stessi tempi del pannello.
    async function growFrom(card, from) {
        if (reducedMotion() || !card.animate) return;
        const parts = [...card.children];
        const full = { marginLeft: '0px', width: `${card.offsetWidth}px`, height: `${card.offsetHeight}px`, borderRadius: getComputedStyle(card).borderTopLeftRadius };
        parts.forEach(part => { part.style.opacity = '0'; });
        card.style.overflow = 'hidden';
        await card.animate([{ marginLeft: `${from.left}px`, width: `${from.width}px`, height: `${from.height}px`, borderRadius: from.radius }, full], { duration: 260, easing: 'cubic-bezier(.3, .8, .2, 1)' }).finished.catch(() => {});
        card.style.overflow = '';
        parts.forEach(part => { part.style.opacity = ''; });

    }
    async function shrinkTo(card, mode, item) {
        if (reducedMotion() || !card.animate) return;
        // dove tornerà: la posizione del pulsante nella barra, misurata su una copia invisibile

        ghost.style.cssText = `position: absolute; visibility: hidden; pointer-events: none; width: ${card.offsetWidth}px;`;
        card.parentNode.insertBefore(ghost, card);
        const to = shapeOf(ghost.querySelector(`[data-mode="${mode}"]`));
        ghost.remove();
        await Promise.all([...card.children].map(part => part.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, easing: 'ease-out', fill: 'forwards' }).finished.catch(() => {})));
        card.style.overflow = 'hidden';
        await card.animate([{ marginLeft: '0px', width: `${card.offsetWidth}px`, height: `${card.offsetHeight}px`, borderRadius: getComputedStyle(card).borderTopLeftRadius },
            { marginLeft: `${to.left}px`, width: `${to.width}px`, height: `${to.height}px`, borderRadius: to.radius }], { duration: 260, easing: 'cubic-bezier(.3, .8, .2, 1)', fill: 'forwards' }).finished.catch(() => {});

            return h('li', { class: `config-item${open ? ' open' : ''}` }, open ? editorForm(tab, id, item)
                : h('button', { type: 'button', class: 'config-face', onclick: () => { state.editing = { kind: tab, id }; render(); } },
                    h('span', { class: 'item-top' }, h('span', { class: 'item-title' }, item[nameKey] || ''), editor.unverified?.(item) ? chip('Da verificare', 'working') : null),
                    editor.summary(item) ? h('span', { class: `config-summary${tab === 'responses' ? ' text' : ''}` }, editor.summary(item)) : null,
                    editor.footer?.(item).length ? h('span', { class: 'config-footer' }, editor.footer(item).map(text => chip(text))) : null));
        };
        return [
            editing?.id === null ? h('div', { class: 'config-item open new' }, editorForm(tab, null, {}))
                : h('button', { type: 'button', class: 'btn primary new-item', onclick: () => { state.editing = { kind: tab, id: null }; render(); } }, icon(ICONS.plus), editor.newLabel),
            items.length ? h('ul', { class: 'list config-list' }, items.map(([id, item]) => card(id, item))) : (editing ? null : empty(tab === 'responses' ? 'responses' : tab, 'Nessuna voce'))
        ];
    }
    function editorForm(tab, id, item) {
        const editor = EDITORS[tab];
        const values = {};
        const fields = editor.fields.map(field => {
            const fieldId = `edit-${tab}-${field.key}`;
            if (field.reference) {
                values[field.key] = reference(item[field.key]).displayValue;
                return input(field.label, values[field.key], value => { values[field.key] = value; }, { id: fieldId });
            }
            if (field.options) {
                values[field.key] = String(item[field.key] || '3');
                return dropdown(field.label, field.options.map(value => [value, SEVERITY[value] || value]), values[field.key], value => { values[field.key] = value; });
            }
            const initial = field.list ? (item[field.key] || []).join(', ') : String(item[field.key] ?? '');
            values[field.key] = initial;
            return input(field.label, initial, value => { values[field.key] = value; }, { id: fieldId, multiline: field.multiline, type: field.number ? 'number' : undefined, min: field.number ? '0' : undefined });
        });
        const close = () => { state.editing = null; render(); };
        const save = () => {
            const nameKey = editor.nameKey || 'name';
            if (!String(values[nameKey] || '').trim()) return showStatus('Manca il nome', 'danger');
            const collection = state.settings[collectionOf(tab)];
            const targetId = id || createId(values[nameKey]);
            const previous = collection[targetId] || {};
            const next = { ...previous };
            editor.fields.forEach(field => {
                const value = values[field.key];
                if (field.reference) next[field.key] = keepReference(previous[field.key], value);
                else if (field.list) next[field.key] = [...new Set(String(value).split(/[,;\s]+/).map(entry => entry.trim().toLowerCase().replace(/^@/, '')).filter(Boolean))];
                else if (field.number) next[field.key] = Math.max(0, Number.parseInt(value, 10) || 0);
                else next[field.key] = field.multiline ? String(value) : String(value).trim();
            });
            if (tab === 'responses') {
                const now = new Date().toISOString();
                next.created ||= now;
                next.updated = now;
            }
            collection[targetId] = next;
            saveSettings(state.settings);
            showStatus('Salvato');
            close();
        };
        const remove = () => {
            if (state.armed !== `delete:${id}`) { state.armed = `delete:${id}`; render(); return; }
            state.armed = null;
            delete state.settings[collectionOf(tab)][id];
            saveSettings(state.settings);
            showStatus('Eliminato');
            close();
        };
        return h('div', { class: 'form' }, fields,
            h('div', { class: 'actions-row' },
                id ? button(state.armed === `delete:${id}` ? 'Conferma' : 'Elimina', remove, { kind: 'danger', iconName: 'trash' }) : button('Annulla', close),
                id ? button('Chiudi', close) : null,
                button('Salva', save, { kind: 'primary', iconName: 'check' })));
    }

    function workspace() {
        if (state.tab === 'tools') return toolsView();
        if (state.tab === 'utility') return h('main', { class: 'workspace single' }, h('section', { class: 'column' }, h('div', { class: 'card' }, empty('utility', 'Utility'))));
        const item = selectedItem();
        return h('main', { class: `workspace${item || state.selected === 'new' ? ' detail-open' : ''}` }, listColumn(), threadColumn(item), sideColumn(item));
    }
    function toast() {
        return state.toast ? h('div', { class: `toast ${state.toast.tone}`, role: 'status' }, state.toast.text) : null;
    }

    // ------------------------------------------------------------------
    // Movimento (come nel pannello): la pillola della voce scelta scivola nei selettori e nelle schede; le parti che
    // cambiano contenuto entrano con una breve dissolvenza; le schede in alto fanno scorrere la vista nel loro verso.
    // Il ridisegno ricrea tutto: si anima solo ciò che è cambiato dal disegno precedente.
    // ------------------------------------------------------------------
    const motion = { keys: new Map(), thumbs: new Map(), icons: new Map(), modal: false, settingsTab: null, tab: null, toast: null };
    const reducedMotion = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    // Pillola sotto la voce scelta: parte da dove era e scivola sulla nuova.
    function slideThumb(group, selector, key) {
        const chosen = group.querySelector(selector);
        if (!chosen) return;
        const thumb = h('span', { class: 'thumb', 'aria-hidden': 'true' });
        group.prepend(thumb);
        const place = { x: chosen.offsetLeft, width: chosen.offsetWidth };
        const before = motion.thumbs.get(key);
        motion.thumbs.set(key, place);
        const put = ({ x, width }) => { thumb.style.transform = `translateX(${x}px)`; thumb.style.width = `${width}px`; };
        put(before && !reducedMotion() ? before : place);
        if (!before || reducedMotion() || (before.x === place.x && before.width === place.width)) return;
        thumb.getBoundingClientRect();
        thumb.classList.add('moving');
        put(place);
    }
    // Selettore con le icone: la voce di prima si stringe e il suo nome svanisce mentre la nuova si allarga e il suo
    // nome compare; la pillola segue, tutto con lo stesso movimento.
    function growIcons(group, key) {
        const buttons = [...group.querySelectorAll('.segment')];
        const index = buttons.findIndex(button => button.classList.contains('big'));
        if (index < 0) return;
        const before = motion.icons.get(key);
        motion.icons.set(key, index);
        const thumb = h('span', { class: 'thumb', 'aria-hidden': 'true' });
        group.prepend(thumb);
        const put = button => { thumb.style.transform = `translateX(${button.offsetLeft}px)`; thumb.style.width = `${button.offsetWidth}px`; };
        if (before === undefined || before === index || !buttons[before] || reducedMotion()) { put(buttons[index]); return; }
        const from = buttons[before], to = buttons[index];
        // dove arriverà la voce nuova: si misura con le larghezze finali
        const end = { x: to.offsetLeft, width: to.offsetWidth };
        to.classList.remove('big'); from.classList.add('big');
        put(from);
        group.getBoundingClientRect();
        group.classList.add('growing');
        thumb.classList.add('moving');
        from.classList.remove('big'); to.classList.add('big');
        thumb.style.transform = `translateX(${end.x}px)`; thumb.style.width = `${end.width}px`;
    }
    function enter(element, key, name, className = 'enter') {
        if (!element) return;
        const before = motion.keys.get(name);
        motion.keys.set(name, key);
        if (before !== undefined && before !== key && !reducedMotion()) element.classList.add(className);
    }
    function animate() {
        slideThumb(root.querySelector('.tabs'), '.tab[aria-selected="true"]', 'tabs');
        root.querySelectorAll('.segmented.icons').forEach(group => growIcons(group, group.getAttribute('aria-label')));
        root.querySelectorAll('.segmented:not(.icons)').forEach(group => slideThumb(group, '.segment[aria-pressed="true"]', `segmented:${group.getAttribute('aria-label')}`));
        // La finestra delle impostazioni entra solo quando si apre, non a ogni ridisegno; cambiando scheda il contenuto
        // scorre nel verso dello spostamento (come nel pannello).
        const backdrop = root.querySelector('.modal-backdrop');
        if (backdrop && !motion.modal && !reducedMotion()) backdrop.classList.add('opening');
        motion.modal = !!backdrop;
        if (backdrop) {
            const at = SETTINGS_TABS.findIndex(([id]) => id === state.settingsTab);
            if (motion.settingsTab !== null && motion.settingsTab !== at && !reducedMotion()) backdrop.querySelector('.scroll.settings')?.classList.add(at > motion.settingsTab ? 'enter-next' : 'enter-back');
            motion.settingsTab = at;
        } else motion.settingsTab = null;
        const order = TABS.findIndex(tab => tab.id === state.tab);
        if (motion.tab !== null && motion.tab !== order && !reducedMotion()) root.querySelector('.workspace')?.classList.add(order > motion.tab ? 'enter-next' : 'enter-back');
        motion.tab = order;
        if (state.tab !== 'work') return;
        enter(root.querySelector('[aria-label="Elenco"] .scroll'), state.section, 'list');
        enter(root.querySelector('.workspace > .column:nth-child(2) > .card'), state.selected || '', 'thread');
        enter(root.querySelector('aside .side'), `${state.selected}|${state.panel?.type || state.panel || ''}`, 'side');
        const toastNode = root.querySelector('.toast');
        if (toastNode && motion.toast !== state.toast.id) { motion.toast = state.toast.id; toastNode.classList.add('enter'); }
    }

    // Ridisegna tutto tenendo la posizione degli elenchi e il campo attivo.
    function render() {
        if (!state.user) return;
        const scrolls = new Map([...root.querySelectorAll('[data-scroll]')].map(node => [node.dataset.scroll, node.scrollTop]));
        const active = document.activeElement;
        const focus = active?.id ? { id: active.id, start: active.selectionStart, end: active.selectionEnd } : null;
        root.replaceChildren(topbar(), workspace(), state.settingsOpen ? settingsView() : '', toast() || '');
        animate();
        root.querySelectorAll('[data-scroll]').forEach(node => { if (scrolls.has(node.dataset.scroll)) node.scrollTop = scrolls.get(node.dataset.scroll); });
        const field = focus && document.getElementById(focus.id);
        if (field) {
            field.focus();
            try { if (typeof focus.start === 'number') field.setSelectionRange(focus.start, focus.end); } catch { /* campo senza selezione */ }
        }
    }

    // Chi non è entrato vede solo Accedi (login Microsoft con reindirizzamento, poi si torna qui).
    function loginScreen() {
        return h('main', { class: 'login' },
            h('div', { class: 'card' },
                h('h1', {}, 'Magus'),
                h('button', { type: 'button', class: 'btn primary wide', onclick: () => window.MagusAuth.login() },
                    icon('<path d="M12 4h3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 15 16h-3M7.5 13.5 11 10 7.5 6.5M11 10H3.5"/>'), 'Accedi con Microsoft')));
    }

    // Aggiornamento degli elenchi: ogni config.refresh.listsSeconds (60 s) e quando la pagina torna in primo piano.
    function scheduleRefresh() {
        const seconds = Math.min(900, Math.max(15, Number(state.config.refresh?.listsSeconds) || 60));
        setInterval(() => { if (document.visibilityState === 'visible' && !state.busy) loadLists(); }, seconds * 1000);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !state.busy) loadLists(); });
    }

    // Il menu dell'utente si chiude con un clic fuori o con Esc.
    document.addEventListener('click', event => {
        if (state.menuOpen && !event.target.closest('.account')) { state.menuOpen = false; render(); }
    });
    document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        if (state.menuOpen) { state.menuOpen = false; render(); }
        else if (state.settingsOpen) closeSettings();
    });
    applyAppearance(state.settings);
    darkQuery?.addEventListener?.('change', () => applyAppearance(state.settings));
    narrowQuery?.addEventListener?.('change', () => applyLayout(state.settings));
    mediumQuery?.addEventListener?.('change', () => applyLayout(state.settings));

    (async () => {
        state.user = await Data.session();
        if (!state.user) { root.replaceChildren(loginScreen()); return; }
        render();
        try { state.config = await Data.config(); } catch { state.config = {}; }
        await loadLists();
        scheduleRefresh();
    })();
})();

</script>
</body>
</html>
