<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Accesso al servizio</title>

  <script
    src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js">
  </script>

  <script
    src="auth-dialog.bundle.js"
    defer>
  </script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
      color: #323130;
      font-family:
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .auth-card {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #edebe9;
      border-radius: 8px;
      background: #faf9f8;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    p {
      margin: 0;
      color: #605e5c;
      line-height: 1.5;
    }

    .spinner {
      width: 24px;
      height: 24px;
      margin-top: 20px;
      border: 3px solid #c7e0f4;
      border-top-color: #0078d4;
      border-radius: 50%;
      animation: rotate 0.8s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <h1>Accesso al servizio</h1>

    <p>
      Seleziona l'account SOGEI e completa
      l'eventuale verifica MFA.
    </p>

    <div
      class="spinner"
      aria-label="Autenticazione in corso">
    </div>
  </main>
</body>
</html>
